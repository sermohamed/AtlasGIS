  }

  function attachToolsEvents(root) {
    root.querySelectorAll('details.acc[data-acc]').forEach(d => {
      d.addEventListener('toggle', () => { toolsOpen[d.dataset.acc] = d.open; });
    });

    const elevHost = root.querySelector('#tools-elevation-host');
    if (elevHost) {
      try { attachElevationEvents(elevHost); } catch (_) {}
    }

    const rtBtn = root.querySelector('#rt-start');
    const rtMsg = root.querySelector('#rt-msg');
    if (rtMsg && _routeLastMsg) {
      _applyRouteMsg(rtMsg, _routeLastMsg.text, _routeLastMsg.kind);
    }
    if (rtBtn) {
      rtBtn.addEventListener('click', (e) => {
        e.preventDefault();
        startRoutePick(rtMsg, rtBtn);
      });
    }

    // ─── Bornage (polygon by coordinates) ───
    (function bornage() {
      if (!state._bornage) state._bornage = { crs: 'wgs84', points: [] };
      const crsSel = root.querySelector('#bn-crs');
      const xIn = root.querySelector('#bn-x');
      const yIn = root.querySelector('#bn-y');
      const addBtn = root.querySelector('#bn-add');
      const finishBtn = root.querySelector('#bn-finish');
      const msgEl = root.querySelector('#bn-msg');
      const listEl = root.querySelector('#bn-list');
      if (!crsSel || !addBtn || !finishBtn) return;

      const showMsg = (text, kind) => {
        if (!msgEl) return;
        msgEl.textContent = text || '';
        msgEl.style.color = kind === 'err' ? 'var(--danger)' : kind === 'ok' ? 'var(--success)' : 'var(--ink-1)';
      };
      const updateLabels = () => {
        const geo = crsIsGeographic(state._bornage.crs);
        const xl = root.querySelector('#bn-x-label');
        const yl = root.querySelector('#bn-y-label');
        if (xl) xl.textContent = geo ? 'Longitude' : 'X (Est)';
        if (yl) yl.textContent = geo ? 'Latitude' : 'Y (Nord)';
      };
      const renderList = () => {
        if (!listEl) return;
        const pts = state._bornage.points;
        if (!pts.length) {
          listEl.innerHTML = '<div style="font-size:11px;color:var(--ink-2);">Aucun point saisi.</div>';
          return;
        }
        listEl.innerHTML = pts.map((p, i) => `
          <div style="display:flex; align-items:center; gap:8px; font-size:11px; font-family:'JetBrains Mono',ui-monospace,monospace; padding:3px 0; border-bottom:1px solid var(--line);">
            <span style="color:var(--ink-2); width:22px;">${i + 1}</span>
            <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(p.label)}</span>
            <button class="layer-action danger" data-bn-remove="${i}" title="Retirer" style="width:26px;height:26px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>`).join('');
        listEl.querySelectorAll('[data-bn-remove]').forEach(b => {
          b.addEventListener('click', () => {
            const idx = parseInt(b.getAttribute('data-bn-remove'), 10);
            if (!isNaN(idx)) { state._bornage.points.splice(idx, 1); renderList(); showMsg('', ''); }
          });
        });
      };

      // Restore persisted UI state.
      crsSel.value = state._bornage.crs;
      updateLabels();
      renderList();

      crsSel.addEventListener('change', () => {
        state._bornage.crs = crsSel.value;
        updateLabels();
      });

      const addPoint = () => {
        const crs = state._bornage.crs;
        const x = parseCoord(xIn ? xIn.value : '');
        const y = parseCoord(yIn ? yIn.value : '');
        if (x === null || y === null) { showMsg('Coordonnées invalides. Vérifiez la saisie.', 'err'); return; }
        let lng, lat;
        try {
          if (crsIsGeographic(crs)) { lng = x; lat = y; }
          else { const r = reproject([x, y], crs, 'wgs84'); lng = r[0]; lat = r[1]; }
        } catch (e) { showMsg('Conversion de coordonnées impossible.', 'err'); return; }
        if (!isFinite(lng) || !isFinite(lat) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
          showMsg('Coordonnées hors limites (vérifiez le système choisi).', 'err'); return;
        }
        const pts = state._bornage.points;
        if (pts.length) {
          const prev = pts[pts.length - 1];
          let dkm = Infinity;
          try { dkm = turf.distance([prev.lng, prev.lat], [lng, lat], { units: 'kilometers' }); } catch (_) {}
          if (dkm > 100) {
            showMsg(`Point refusé : ${dkm.toFixed(1)} km du point précédent (>100 km ⇒ erreur de saisie).`, 'err');
            return;
          }
        }
        const label = crsIsGeographic(crs)
          ? formatWgsPairDisplay(lng, lat, 6)
          : `${formatProjected(x, 1)} ; ${formatProjected(y, 1)}`;
        pts.push({ lng, lat, x, y, crs, label });
        if (xIn) xIn.value = '';
        if (yIn) yIn.value = '';
        if (xIn) xIn.focus();
        showMsg(`Point ${pts.length} ajouté.`, 'ok');
        renderList();
      };

      const finish = () => {
        const pts = state._bornage.points;
        if (pts.length < 3) { showMsg('Au moins 3 points sont requis pour former un polygone.', 'err'); return; }
        const ring = pts.map(p => [p.lng, p.lat]);
        ring.push([pts[0].lng, pts[0].lat]); // close the ring
        try {
          const newF = addFeature(
            { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] }, properties: { _derived: true, _derivedKind: 'bornage' } },
            'polygon',
            { name: `Bornage (${pts.length} pts)` }
          );
          ensureDerivedLayers();
          syncDerivedLayer();
          notifyFeatures();
          state._bornage.points = [];
          renderList();
          showMsg('✓ Polygone de bornage créé.', 'ok');
          try { zoomToFeature(newF.id); } catch (_) {}
          promptFeatureName(newF.id);
        } catch (e) {
          showMsg('Erreur lors de la création : ' + (e.message || e), 'err');
        }
      };

      addBtn.addEventListener('click', (e) => { e.preventDefault(); addPoint(); });
      finishBtn.addEventListener('click', (e) => { e.preventDefault(); finish(); });
      if (yIn) yIn.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); addPoint(); } });

      const fileIn = root.querySelector('#bn-file');
      const importBtn = root.querySelector('#bn-import');
      const replaceCb = root.querySelector('#bn-replace');
      if (importBtn && fileIn) {
        importBtn.addEventListener('click', (e) => { e.preventDefault(); fileIn.click(); });
        fileIn.addEventListener('change', () => {
          const file = fileIn.files && fileIn.files[0];
          fileIn.value = '';
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const parsed = parseBornageTable(reader.result);
            if (parsed.error) { showMsg(parsed.error, 'err'); return; }
            const crs = state._bornage.crs;
            const { added, skipped } = importBornageRows(parsed.rows, crs, !!(replaceCb && replaceCb.checked));
            renderList();
            if (added === 0) {
              showMsg('Aucun point importé. Vérifiez le système de coordonnées et le format.', 'err');
            } else {
              const skipNote = skipped ? ` (${skipped} ignoré${skipped > 1 ? 's' : ''})` : '';
              showMsg(`${added} point${added > 1 ? 's' : ''} importé${added > 1 ? 's' : ''}${skipNote}.`, 'ok');
            }
          };
          reader.onerror = () => showMsg('Lecture du fichier impossible.', 'err');
          reader.readAsText(file, 'UTF-8');
        });
      }
    })();

    // Buffer
    const bfBtn = root.querySelector('#bf-apply');
    const bfIn = root.querySelector('#bf-radius');
    if (bfIn) {
      // Restore last value across panel re-renders.
      if (typeof state._bufferRadius === 'number' && !isNaN(state._bufferRadius)) {
        bfIn.value = String(state._bufferRadius);
      }
      bfIn.addEventListener('input', () => {
        const v = parseFloat(String(bfIn.value).replace(',', '.'));
        state._bufferRadius = isNaN(v) ? null : v;
      });
    }
    if (bfBtn) bfBtn.addEventListener('click', () => {
      const sel = state.features.filter(f => state.selectedIds.includes(f.id));
      if (sel.length !== 1) {
        ui.confirm('Sélection requise', 'Sélectionnez exactement 1 objet (tap sur la carte) avant de calculer le buffer.', () => {});
        return;
      }
      const src = sel[0];
      // Read FROM THE INPUT directly at click time — but ALSO have the
      // backup from state._bufferRadius in case the input was just reset
      // by a panel re-render that happened mid-flight.
      const rRaw = bfIn ? bfIn.value : '';
      const r = parseFloat(String(rRaw).replace(',', '.'));
      const radius = !isNaN(r) ? r
                   : typeof state._bufferRadius === 'number' ? state._bufferRadius
                   : NaN;
      log.info('[HydraulicGIS] buffer requested radius =', radius, 'raw input =', JSON.stringify(rRaw));
      if (isNaN(radius) || radius === 0) {
        ui.confirm('Rayon invalide', 'Entrez un nombre non nul (ex. 50). Un rayon négatif rétrécit le polygone.', () => {});
        return;
      }
      try {
        const buffered = turf.buffer(src.geojson, radius, { units: 'meters' });
        if (!buffered || !buffered.geometry) {
          ui.confirm('Buffer impossible', "L'opération n'a produit aucune géométrie (rayon trop petit ou trop négatif).", () => {});
          return;
        }
        // Mark as a derived feature: rendered on our app-derived layer
        // (NOT through terra-draw, which silently rejected it before).
        const newF = addFeature({
          type: 'Feature',
          geometry: buffered.geometry,
          properties: { _derived: true, _derivedKind: 'buffer', _bufferSourceId: src.id }
        }, 'polygon', { name: `Buffer ${radius}m de ${src.name}` });
        ensureDerivedLayers();
        syncDerivedLayer();
        notifyFeatures();
        log.info('[HydraulicGIS] buffer created:', newF.id, 'r=' + radius + 'm');
      } catch (err) {
        log.error('[HydraulicGIS] buffer failed:', err);
        ui.confirm('Erreur', "Le calcul du buffer a échoué : " + (err.message || err), () => {});
      }
    });

    // Intersection
    const itBtn = root.querySelector('#it-apply');
    if (itBtn) itBtn.addEventListener('click', () => {
      const polys = state.features
        .filter(f => state.selectedIds.includes(f.id))
        .filter(f => ['polygon', 'rectangle', 'circle'].includes(f.kind));
      if (polys.length < 2) return;
      try {
        // turf.intersect (v7 signature in this bundle) takes a
        // FeatureCollection of polygons and returns the intersection of
        // ALL of them at once. The error "Must specify at least 2
        // geometries" was thrown because we were passing two separate
        // args (v6 signature) — the first arg was being read as the FC
        // and only contained one polygon.
        const fc = turf.featureCollection(polys.map(p => p.geojson));
        const result = root.querySelector('#it-result');
        const intersection = turf.intersect(fc);
        if (!intersection || !intersection.geometry) {
          if (result) {
            result.style.color = 'var(--danger)';
            result.textContent = `Aucun chevauchement entre les ${polys.length} polygones sélectionnés.`;
          }
          return;
        }
        const acc = intersection;
        const newF = addFeature({
          type: 'Feature',
          geometry: acc.geometry,
          properties: { _derived: true, _derivedKind: 'intersection' }
        }, 'polygon', { name: `Intersection (${polys.map(p => p.name).join(' ∩ ')})` });
        ensureDerivedLayers();
        syncDerivedLayer();
        notifyFeatures();
        if (result) {
          result.style.color = 'var(--brand)';
          const areaM2 = turf.area(newF.geojson);
          result.textContent = `✓ Intersection créée. Surface : ${formatArea(areaM2)}`;
        }
        log.info('[HydraulicGIS] intersection created:', newF.id);
      } catch (err) {
        log.error('[HydraulicGIS] intersection failed:', err);
        const result = root.querySelector('#it-result');
        if (result) {
          result.style.color = 'var(--danger)';
          result.textContent = "Erreur : " + (err.message || err);
        }
      }
    });

    // Marching squares emits unordered two-point segments. Join the ones
    // that share an endpoint into continuous polylines so a contour reads as
    // one curve (and can carry a label along it).
    function chainSegments(segments) {
      const KEY = (p) => p[0].toFixed(7) + ',' + p[1].toFixed(7);
      const buckets = new Map();
      const used = new Array(segments.length).fill(false);
      segments.forEach((seg, i) => {
        for (const p of seg) {
          const k = KEY(p);
          if (!buckets.has(k)) buckets.set(k, []);
          buckets.get(k).push(i);
        }
      });
      const takeNext = (key, skip) => {
        const list = buckets.get(key);
        if (!list) return -1;
        for (const i of list) {
          if (i !== skip && !used[i]) return i;
        }
        return -1;
      };
      const lines = [];
      for (let s = 0; s < segments.length; s++) {
        if (used[s]) continue;
        used[s] = true;
        const line = [segments[s][0].slice(), segments[s][1].slice()];
        // Extend forward, then backward, until no neighbour is left.
        for (const forward of [true, false]) {
          let guard = 0;
          while (guard++ < segments.length) {
            const tip = forward ? line[line.length - 1] : line[0];
            const next = takeNext(KEY(tip), -1);
            if (next < 0) break;
            used[next] = true;
            const seg = segments[next];
            const other = KEY(seg[0]) === KEY(tip) ? seg[1] : seg[0];
            if (forward) line.push(other.slice());
            else line.unshift(other.slice());
          }
        }
        lines.push(line);
      }
      return lines;
    }

    // Contour lines: sample elevations on a grid inside the bbox of the
    // selected polygon, then run a basic marching-squares to build polylines
    // at integer multiples of the user-given step. Network access required.
    const cnBtn = root.querySelector('#cn-apply');
    if (cnBtn) cnBtn.addEventListener('click', async () => {
      const sel = state.features.filter(f => state.selectedIds.includes(f.id));
      const polysOnly = sel.filter(f => ['polygon', 'rectangle', 'circle'].includes(f.kind));
      if (polysOnly.length !== 1) return;
      const poly = polysOnly[0];
      const stepIn = root.querySelector('#cn-step');
      const step = parseFloat(String(stepIn.value).replace(',', '.'));
      const result = root.querySelector('#cn-result');
      if (isNaN(step) || step <= 0) {
        if (result) {
          result.style.color = 'var(--danger)';
          result.textContent = "Pas invalide. Entrez un nombre positif (ex. 10).";
        }
        return;
      }

      // Prevent abuse: bbox max ~30 km × 30 km. Open-Elevation rate-limits
      // bursts; a denser grid here would also slow the marching-squares.
      const bbox = turf.bbox(poly.geojson);  // [minX, minY, maxX, maxY]
      const widthKm = turf.distance([bbox[0], bbox[1]], [bbox[2], bbox[1]], { units: 'kilometers' });
      const heightKm = turf.distance([bbox[0], bbox[1]], [bbox[0], bbox[3]], { units: 'kilometers' });
      if (widthKm > 30 || heightKm > 30) {
        if (result) {
          result.style.color = 'var(--danger)';
          result.textContent = `Polygone trop étendu (${widthKm.toFixed(1)} × ${heightKm.toFixed(1)} km). Limite 30 km.`;
        }
        return;
      }

      // Grid resolution drives how far a contour can sit from the real
      // terrain: marching squares can only place a crossing on a cell edge,
      // so the worst-case planimetric error is half a cell. A fixed 25×25
      // grid over a 10 km box means ±200 m of drift against the topo
      // basemap — that was the visible "offset". Target ~120 m cells and
      // cap the grid at 57×57 (3249 samples ≈ 33 API calls).
      const spanKm = Math.max(widthKm, heightKm);
      const N = Math.max(25, Math.min(57, Math.round((spanKm * 1000) / 120) + 1));
      const gridLngs = new Array(N).fill(0).map((_, i) => bbox[0] + (i / (N - 1)) * (bbox[2] - bbox[0]));
      const gridLats = new Array(N).fill(0).map((_, j) => bbox[1] + (j / (N - 1)) * (bbox[3] - bbox[1]));

      cnBtn.disabled = true;
      const origLabel = cnBtn.textContent;
      cnBtn.textContent = 'Échantillonnage…';
      if (result) { result.style.color = 'var(--ink-2)'; result.textContent = 'Requête vers Open-Meteo Elevation…'; }

      try {
        // Open-Meteo Elevation API — free, no key, CORS-enabled, much
        // more reliable than Open-Elevation (which is frequently down).
        // Endpoint accepts up to 100 lat/lng pairs per call as a comma-
        // separated list, so we batch in chunks of 100. Open-Elevation kept
        // as a fallback if Open-Meteo fails (e.g. rate-limited).
        const allElevations = new Array(N * N);
        const flat = [];
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
          flat.push({ lat: gridLats[j], lng: gridLngs[i] });
        }
        async function fetchElevations(points) {
          // Try Open-Meteo first.
          const lats = points.map(p => p.lat.toFixed(6)).join(',');
          const lngs = points.map(p => p.lng.toFixed(6)).join(',');
          const om = `https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`;
          try {
            const r = await fetch(om);
            if (r.ok) {
              const d = await r.json();
              if (d && Array.isArray(d.elevation)) return d.elevation;
            }
          } catch (e) { log.warn('Open-Meteo elevation failed:', e); }
          // Fallback: Open-Elevation POST (often slow, sometimes 502).
          try {
            const r = await fetch('https://api.open-elevation.com/api/v1/lookup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                locations: points.map(p => ({ latitude: p.lat, longitude: p.lng })),
              }),
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const d = await r.json();
            if (d && Array.isArray(d.results)) return d.results.map(x => x.elevation);
          } catch (e) { log.warn('Open-Elevation fallback failed:', e); }
          throw new Error('Aucun service d\'élévation accessible (réseau hors-ligne ?)');
        }
        // Batch by 100 points per call.
        const BATCH = 100;
        let index = 0;
        for (let off = 0; off < flat.length; off += BATCH) {
          const slice = flat.slice(off, Math.min(off + BATCH, flat.length));
          if (result) result.textContent = `Échantillonnage ${off + slice.length} / ${flat.length}…`;
          const elevs = await fetchElevations(slice);
          // A short batch would shift every later sample by one grid cell and
          // silently produce plausible-looking but misplaced contours.
          if (!Array.isArray(elevs) || elevs.length !== slice.length) {
            throw new Error("Réponse d'élévation incomplète — réessayez dans un instant.");
          }
          for (let k = 0; k < elevs.length; k++) {
            allElevations[index++] = elevs[k];
          }
        }
        // Build the elevation grid Z[j][i]. The API returns null over water
        // and on tile gaps; an unguarded null poisons min/max and every
        // marching-squares comparison, which used to silently produce an
        // empty result with no explanation.
        const Z = [];
        for (let j = 0; j < N; j++) {
          Z.push(new Array(N));
          for (let i = 0; i < N; i++) {
            const v = Number(allElevations[j * N + i]);
            Z[j][i] = Number.isFinite(v) ? v : null;
          }
        }
        let minZ = Infinity, maxZ = -Infinity, validCount = 0;
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
          const v = Z[j][i];
          if (v == null) continue;
          validCount++;
          if (v < minZ) minZ = v;
          if (v > maxZ) maxZ = v;
        }
        if (validCount < 4) {
          throw new Error("Aucune altitude exploitable pour cette zone.");
        }
        // Fill the holes with the true mean of the valid samples. Using the
        // midrange invented an elevation that may occur nowhere in the area
        // and drew spurious rings around water and tile gaps.
        let sumZ = 0;
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
          if (Z[j][i] != null) sumZ += Z[j][i];
        }
        const meanZ = sumZ / validCount;
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
          if (Z[j][i] == null) Z[j][i] = meanZ;
        }

        // Generate contour levels from floor(min/step)*step to ceil(max/step)*step.
        // Cap the count: a 0.1 m step over 800 m of relief would launch 8000
        // marching-squares passes and freeze the tab with the button stuck on
        // "Échantillonnage…".
        const MAX_LEVELS = 200;
        const wanted = Math.floor((maxZ - minZ) / step) + 1;
        if (wanted > MAX_LEVELS) {
          const suggested = Math.ceil((maxZ - minZ) / MAX_LEVELS);
          throw new Error(`Pas trop fin : ${wanted} courbes pour ${(maxZ - minZ).toFixed(0)} m de dénivelé. `
            + `Utilisez un pas d'au moins ${suggested} m.`);
        }
        const firstLevel = Math.ceil(minZ / step) * step;
        const lastLevel  = Math.floor(maxZ / step) * step;
        const levels = [];
        for (let v = firstLevel; v <= lastLevel; v += step) levels.push(v);

        // Marching squares — one segment per cell-edge crossing.
        // For each level we collect lineStrings (we don't bother chaining
        // them — the user just sees segments rendered as polylines, which
        // visually merge into closed curves at this resolution).
        const interp = (x1, x2, z1, z2, level) => (level - z1) / (z2 - z1);
        const allFeatures = [];
        for (const L of levels) {
          const segments = [];
          for (let j = 0; j < N - 1; j++) {
            for (let i = 0; i < N - 1; i++) {
              const z00 = Z[j][i], z10 = Z[j][i+1], z11 = Z[j+1][i+1], z01 = Z[j+1][i];
              const lng0 = gridLngs[i], lng1 = gridLngs[i+1];
              const lat0 = gridLats[j], lat1 = gridLats[j+1];
              const c00 = z00 >= L ? 1 : 0;
              const c10 = z10 >= L ? 1 : 0;
              const c11 = z11 >= L ? 1 : 0;
              const c01 = z01 >= L ? 1 : 0;
              const idx = (c00 << 0) | (c10 << 1) | (c11 << 2) | (c01 << 3);
              if (idx === 0 || idx === 15) continue;
              // Edge midpoints (interpolated): bottom=lat0, right=lng1, top=lat1, left=lng0
              const mB = () => [lng0 + interp(lng0, lng1, z00, z10, L) * (lng1 - lng0), lat0];
              const mR = () => [lng1, lat0 + interp(lat0, lat1, z10, z11, L) * (lat1 - lat0)];
              const mT = () => [lng0 + interp(lng0, lng1, z01, z11, L) * (lng1 - lng0), lat1];
              const mL = () => [lng0, lat0 + interp(lat0, lat1, z00, z01, L) * (lat1 - lat0)];
              // Each case lists the segments to draw as PAIRS of edge
              // midpoints. Simple cases produce 1 segment (one inner-pair).
              // Saddle cases (5 and 10) produce 2 segments.
              let pairs;
              switch (idx) {
                case 1: case 14: pairs = [[mL, mB]]; break;
                case 2: case 13: pairs = [[mB, mR]]; break;
                case 3: case 12: pairs = [[mL, mR]]; break;
                case 4: case 11: pairs = [[mR, mT]]; break;
                case 6: case 9:  pairs = [[mB, mT]]; break;
                case 7: case 8:  pairs = [[mL, mT]]; break;
                case 5:  pairs = [[mL, mT], [mB, mR]]; break;
                case 10: pairs = [[mL, mB], [mR, mT]]; break;
                default: continue;
              }
              for (const [fA, fB] of pairs) {
                segments.push([fA(), fB()]);
              }
            }
          }
          // Clip each segment to the source polygon. Per user spec, the
          // contour lines should not extend beyond the object's boundary.
          // We test the segment midpoint with turf.booleanPointInPolygon —
          // sufficient for our short cell-edge segments (the polygon is
          // dense relative to the 25-cell grid).
          const clipped = [];
          for (const seg of segments) {
            const mid = [(seg[0][0] + seg[1][0]) / 2, (seg[0][1] + seg[1][1]) / 2];
            try {
              if (turf.booleanPointInPolygon(turf.point(mid), poly.geojson)) {
                clipped.push(seg);
              }
            } catch (_) {
              // If point-in-polygon fails (degenerate input), keep the segment.
              clipped.push(seg);
            }
          }
          // Stitch the loose cell-edge segments into continuous polylines.
          // Rendering them as separate two-point segments looked jagged and
          // gave nowhere to hang a line-placed elevation label.
          if (clipped.length > 0) {
            allFeatures.push({
              type: 'Feature',
              geometry: { type: 'MultiLineString', coordinates: chainSegments(clipped) },
              properties: { level: L },
            });
          }
        }

        if (allFeatures.length === 0) {
          if (result) {
            result.style.color = 'var(--ink-2)';
            result.textContent = `Aucune courbe générée. Pas trop grand pour cette zone (Δ alt = ${(maxZ-minZ).toFixed(1)} m).`;
          }
          return;
        }

        // Build the contour feature as a single line in our store, marked
        // as a derived feature so it's selectable / deletable / styleable.
        const merged = { type: 'MultiLineString', coordinates: [] };
        for (const f of allFeatures) merged.coordinates.push(...f.geometry.coordinates);
        const newF = addFeature({
          type: 'Feature',
          geometry: merged,
          properties: { _derived: true, _derivedKind: 'contours' }
        }, 'line', { name: `Courbes ${step}m de ${poly.name}` });

        // Elevation labels ride *on* the curves, like a topographic sheet:
        // one line feature per level, rendered with symbol-placement 'line'
        // so MapLibre repeats and rotates "120 m" along each contour.
        const elevationLabelFeatures = [];
        for (const lf of allFeatures) {
          const lines = (lf.geometry.coordinates || []).filter(l => l && l.length >= 2);
          if (!lines.length) continue;
          elevationLabelFeatures.push({
            type: 'Feature',
            geometry: { type: 'MultiLineString', coordinates: lines },
            properties: { elevation: lf.properties.level, contourOwnerId: newF.id },
          });
        }
        // Persist labels on the feature so they survive page refresh.
        newF.geojson.properties._elevationLabels = elevationLabelFeatures;
        saveState();
        ensureContourLabelsLayer();
        syncContourLabelsFromStore();

        ensureDerivedLayers();
        syncDerivedLayer();
        notifyFeatures();
        // notifyFeatures re-renders the panel, so the captured `result` node is
        // detached by now: re-query it or the success message never shows.
        const resultAfter = document.querySelector('#cn-result') || result;
        if (resultAfter) {
          const cellM = (spanKm * 1000) / (N - 1);
          resultAfter.style.color = 'var(--brand)';
          resultAfter.innerHTML = `✓ ${levels.length} niveaux tracés (alt ${minZ.toFixed(0)} → ${maxZ.toFixed(0)} m).`
            + `<br><span style="color:var(--ink-2)">Grille ${N}×${N} · maille ≈ ${cellM.toFixed(0)} m · `
            + `précision planimétrique ≈ ±${(cellM / 2).toFixed(0)} m. Un léger décalage avec les courbes `
            + `du fond « Terrain » est normal : les deux proviennent de MNT différents.</span>`;
        }
        log.info('[HydraulicGIS] contour lines created:', newF.id, 'levels=' + levels.length);
      } catch (err) {
        log.error('[HydraulicGIS] contour lines failed:', err);
        if (result) {
          result.style.color = 'var(--danger)';
          result.textContent = "Erreur : " + (err.message || err) + " (Open-Elevation peut être hors-ligne)";
        }
      } finally {
        cnBtn.disabled = false;
        cnBtn.textContent = origLabel;
      }
    });
  }

  /* ═══ 10c. PANEL CONTENT — LEGEND ════════════════════════════════════════════ */
  // Default config for the legend overlay. Stored on state._legend so
  // changes persist across panel re-renders and across page reloads (via
  // saveState).
  function ensureLegendState() {
    if (!state._legend) {
      state._legend = {
        enabled: false,
        title: t('panel_legend'),
        position: 'bottom-right',
        fontSize: 13,
        // null = follow layer rules: all features in a named layer checked,
        // ungrouped features unchecked by default.
        selectedIds: null,
        labelOverrides: {},
        box: null, // {left, top, width, height} when user dragged/resized
      };
    }
    if (!state._legend._seededSelection) {
      if (state._legend.selectedIds == null) {
        state._legend.selectedIds = legendDefaultSelectedIds();
      }
      state._legend._seededSelection = true;
    }
  }

  function legendDefaultSelectedIds() {
    return state.features.filter((f) => !!f.groupId).map((f) => f.id);
  }

  function renderLegend() {
    ensureLegendState();
    const cfg = state._legend;
    if (cfg.selectedIds === null) cfg.selectedIds = legendDefaultSelectedIds();

    const renderItem = (f) => {
      const included = cfg.selectedIds.includes(f.id);
      const customLabel = cfg.labelOverrides[f.id];
      const swatchColor = f.kind === 'line' ? f.style.stroke : f.style.fill;
      return `
        <div class="surface" style="padding:8px 10px; margin-bottom:4px; display:flex; align-items:center; gap:8px;">
          <input type="checkbox" class="lg-item-toggle" data-id="${f.id}" ${included ? 'checked' : ''} />
          <span style="display:inline-block; width:14px; height:14px; background:${swatchColor}; border:1px solid var(--line); border-radius:2px; flex-shrink:0;"></span>
          <input type="text" class="field lg-item-label" data-id="${f.id}"
                 value="${escapeHtml(customLabel != null ? customLabel : f.name)}"
                 placeholder="${escapeHtml(f.name)}"
                 style="flex:1; min-width:0; font-size:12px; padding:4px 6px;" />
        </div>`;
    };

    let body = '';
    if (!state.features.length) {
      body = `<div class="empty-state">${t('legend_none')}</div>`;
    } else {
      for (const g of state.groups) {
        const members = state.features.filter((f) => f.groupId === g.id);
        if (!members.length) continue;
        body += `<div class="field-label" style="margin:10px 0 4px;">${escapeHtml(g.name)}</div>`;
        body += members.map(renderItem).join('');
      }
      const ungrouped = state.features.filter((f) => !f.groupId);
      if (ungrouped.length) {
        body += `<div class="field-label" style="margin:10px 0 4px;">${t('legend_ungrouped')}</div>`;
        body += ungrouped.map(renderItem).join('');
      }
    }

    return `
      <div class="stack">
        <div class="surface">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="lg-enabled" ${cfg.enabled ? 'checked' : ''} />
            <span style="font-weight:500;">${t('show_legend')}</span>
          </label>
        </div>
        <div class="surface">
          <label class="field-label">${t('legend_title')}</label>
          <input type="text" id="lg-title" class="field" value="${escapeHtml(cfg.title || t('panel_legend'))}" />
          <label class="field-label" style="margin-top:10px;">${t('legend_position')}</label>
          <select id="lg-position" class="field">
            <option value="top-left" ${cfg.position === 'top-left' ? 'selected' : ''}>${t('pos_tl')}</option>
            <option value="top-right" ${cfg.position === 'top-right' ? 'selected' : ''}>${t('pos_tr')}</option>
            <option value="bottom-left" ${cfg.position === 'bottom-left' ? 'selected' : ''}>${t('pos_bl')}</option>
            <option value="bottom-right" ${cfg.position === 'bottom-right' ? 'selected' : ''}>${t('pos_br')}</option>
          </select>
          <label class="field-label" style="margin-top:10px;">${t('legend_fontsize')}</label>
          <select id="lg-fontsize" class="field">
            <option value="11" ${cfg.fontSize === 11 ? 'selected' : ''}>${t('size_s')}</option>
            <option value="13" ${cfg.fontSize === 13 ? 'selected' : ''}>${t('size_m')}</option>
            <option value="15" ${cfg.fontSize === 15 ? 'selected' : ''}>${t('size_l')}</option>
          </select>
        </div>
        <div>
          <div class="field-label" style="display:flex; justify-content:space-between; align-items:center;">
            <span>${t('legend_items')}</span>
            <button class="btn btn-ghost" id="lg-reset-selection" style="font-size:11px; min-height:auto; padding:3px 8px;">
              ${t('legend_sync_eye')}
            </button>
          </div>
          <p style="font-size:11px; color:var(--ink-2); margin:4px 0 8px;">${t('legend_hint')}</p>
          <div id="lg-feature-list">${body}</div>
        </div>
      </div>`;
  }

  function attachLegendEvents(root) {
    ensureLegendState();
    const cfg = state._legend;
    const lgEnabled = root.querySelector('#lg-enabled');
    const lgTitle = root.querySelector('#lg-title');
    const lgPosition = root.querySelector('#lg-position');
    const lgFontSize = root.querySelector('#lg-fontsize');
    const lgReset = root.querySelector('#lg-reset-selection');

    if (lgEnabled) lgEnabled.addEventListener('change', () => {
      cfg.enabled = lgEnabled.checked;
      updateLegendBox();
    });
    if (lgTitle) lgTitle.addEventListener('input', () => {
      cfg.title = lgTitle.value;
      updateLegendBox();
    });
    if (lgPosition) lgPosition.addEventListener('change', () => {
      cfg.position = lgPosition.value;
      cfg.box = null;
      updateLegendBox();
    });
    if (lgFontSize) lgFontSize.addEventListener('change', () => {
      cfg.fontSize = parseInt(lgFontSize.value, 10) || 13;
      updateLegendBox();
    });
    if (lgReset) lgReset.addEventListener('click', () => {
      cfg.selectedIds = legendDefaultSelectedIds();
      updateLegendBox();
      ui.render();
    });

    root.querySelectorAll('.lg-item-toggle').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = cb.dataset.id;
        if (!Array.isArray(cfg.selectedIds)) {
          cfg.selectedIds = legendDefaultSelectedIds();
        }
        if (cb.checked) {
          if (!cfg.selectedIds.includes(id)) cfg.selectedIds.push(id);
        } else {
          cfg.selectedIds = cfg.selectedIds.filter(x => x !== id);
        }
        updateLegendBox();
      });
    });
    // Per-item text inputs: override the display label
    root.querySelectorAll('.lg-item-label').forEach(inp => {
      inp.addEventListener('input', () => {
        const id = inp.dataset.id;
        const v = inp.value.trim();
        if (v) cfg.labelOverrides[id] = v;
        else delete cfg.labelOverrides[id];
        updateLegendBox();
      });
    });
  }

  // ─── Legend renderer ──────────────────────────────────────────────
  // Lazy-creates a floating box on the map and re-renders its content
  // whenever the visible feature list or settings change. Called from
  // both the tools panel handlers (above) and from syncFeaturesToMap
  // (so adding/removing/hiding an object refreshes the legend live).
  function updateLegendBox() {
    let box = document.getElementById('legend-box');
    ensureLegendState();
    const cfg = state._legend || { enabled: false };
    try { saveState(); } catch (_) {}
    if (!cfg.enabled) {
      if (box) box.style.display = 'none';
      return;
    }
    if (!box) {
      box = document.createElement('div');
      box.id = 'legend-box';
      (document.getElementById('app') || document.body).appendChild(box);
      installLegendBoxInteractions(box);
    }
    box.style.display = 'block';
    box.style.fontSize = (cfg.fontSize || 13) + 'px';

    const saved = cfg.box;
    if (saved && isFinite(saved.left) && isFinite(saved.top)) {
      box.style.left = saved.left + 'px';
      box.style.top = saved.top + 'px';
      box.style.right = 'auto';
      box.style.bottom = 'auto';
      if (saved.width) box.style.width = saved.width + 'px';
      if (saved.height) box.style.height = saved.height + 'px';
    } else {
      box.style.top = box.style.bottom = box.style.left = box.style.right = 'auto';
      const pos = cfg.position || 'bottom-right';
      if (pos === 'top-left') { box.style.top = '60px'; box.style.left = '74px'; }
      else if (pos === 'top-right') { box.style.top = '60px'; box.style.right = '10px'; }
      else if (pos === 'bottom-left') { box.style.bottom = '40px'; box.style.left = '74px'; }
      else { box.style.bottom = '40px'; box.style.right = '10px'; }
    }

    const selectedIds = Array.isArray(cfg.selectedIds) ? cfg.selectedIds : legendDefaultSelectedIds();
    const overrides = cfg.labelOverrides || {};
    const items = state.features.filter((f) => selectedIds.includes(f.id));

    // Group rows: layers first, then ungrouped (if any selected).
    const sections = [];
    for (const g of state.groups) {
      const members = items.filter((f) => f.groupId === g.id);
      if (!members.length) continue;
      sections.push({ title: g.name, members });
    }
    const ungrouped = items.filter((f) => !f.groupId);
    if (ungrouped.length) sections.push({ title: t('legend_ungrouped'), members: ungrouped });

    const header = `<div class="lg-drag">${escapeHtml(cfg.title || t('panel_legend'))}</div>`;
    if (!items.length) {
      box.innerHTML = header + `<div style="color:var(--ink-2); font-style:italic;">${t('legend_empty')}</div>`;
      return;
    }
    const rows = sections.map((sec) => {
      const title = `<div class="lg-group-title">${escapeHtml(sec.title)}</div>`;
      const body = sec.members.map((f) => {
        const swatch = f.kind === 'line'
          ? `<span style="display:inline-block; width:14px; height:3px; background:${f.style.stroke}; margin-right:6px; vertical-align:middle;"></span>`
          : `<span style="display:inline-block; width:12px; height:12px; background:${f.style.fill}; border:1px solid ${f.style.stroke}; margin-right:6px; vertical-align:middle; border-radius:2px;"></span>`;
        return `<div style="margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${swatch}${escapeHtml(overrides[f.id] || f.name)}</div>`;
      }).join('');
      return title + body;
    }).join('');
    box.innerHTML = header + rows;
  }

  function installLegendBoxInteractions(box) {
    if (box._lgReady) return;
    box._lgReady = true;
    let dragging = false, ox = 0, oy = 0;
    const onDown = (e) => {
      const handle = e.target.closest('.lg-drag');
      if (!handle) return;
      dragging = true;
      const r = box.getBoundingClientRect();
      const pt = e.touches ? e.touches[0] : e;
      ox = pt.clientX - r.left;
      oy = pt.clientY - r.top;
      e.preventDefault();
    };
    const onMove = (e) => {
      if (!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const left = Math.max(4, Math.min(window.innerWidth - 40, pt.clientX - ox));
      const top = Math.max(4, Math.min(window.innerHeight - 40, pt.clientY - oy));
      box.style.left = left + 'px';
      box.style.top = top + 'px';
      box.style.right = 'auto';
      box.style.bottom = 'auto';
    };
    const onUp = () => {
      if (!dragging) return;
      dragging = false;
      ensureLegendState();
      const r = box.getBoundingClientRect();
      state._legend.box = {
        left: r.left, top: r.top,
        width: r.width, height: r.height,
      };
      try { saveState(); } catch (_) {}
    };
    box.addEventListener('mousedown', onDown);
    box.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
    // Persist size after CSS resize.
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => {
        if (!state._legend || !state._legend.enabled) return;
        const r = box.getBoundingClientRect();
        if (r.width < 40 || r.height < 30) return;
        state._legend.box = {
          left: r.left, top: r.top,
          width: r.width, height: r.height,
        };
      });
      ro.observe(box);
    }
  }

  // Lazy-create the contour rendering layer. Contours go in their own
  // layer so they're styled independently and can be cleared without
  // touching the main feature layers.
  //
  // Derived features (buffers, intersections, contour lines) are NOT
  // routed through terra-draw because:
  //   - terra-draw silently rejects features that don't pass internal
  //     validation (we observed buffers being added to our store but not
  //     showing up on the map).
  //   - terra-draw recomputes layer ordering on every render, fighting
  //     our z-index management.
  //   - they're not user-editable anyway (they're computed), so they
  //     don't need terra-draw's edit UX.
  // We render them on dedicated MapLibre layers we control.
  function ensureDerivedLayers() {
    try {
      // Source for buffer / intersection results (points + lines + polygons).
      if (!map.getSource('app-derived')) {
        map.addSource('app-derived', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      }
      // Polygon fill (with per-feature stroke/fill props).
      if (!map.getLayer('app-derived-fill')) {
        map.addLayer({
          id: 'app-derived-fill', type: 'fill', source: 'app-derived',
          filter: ['==', ['geometry-type'], 'Polygon'],
          paint: {
            'fill-color': ['coalesce', ['get', 'fill'], '#3aa0ff'],
            'fill-opacity': ['coalesce', ['get', 'fillOpacity'], 0.3],
          },
        });
      }
      if (!map.getLayer('app-derived-outline')) {
        map.addLayer({
          id: 'app-derived-outline', type: 'line', source: 'app-derived',
          filter: ['==', ['geometry-type'], 'Polygon'],
          paint: {
            'line-color': ['coalesce', ['get', 'stroke'], '#3aa0ff'],
            'line-width': ['coalesce', ['get', 'strokeWidth'], 2.5],
          },
        });
      }
      if (!map.getLayer('app-derived-line')) {
        map.addLayer({
          id: 'app-derived-line', type: 'line', source: 'app-derived',
          filter: ['in', ['geometry-type'], ['literal', ['LineString', 'MultiLineString']]],
          paint: {
            'line-color': ['coalesce', ['get', 'stroke'], '#3aa0ff'],
            'line-width': ['coalesce', ['get', 'strokeWidth'], 2.5],
          },
        });
      }
      if (!map.getLayer('app-derived-point')) {
        map.addLayer({
          id: 'app-derived-point', type: 'circle', source: 'app-derived',
          filter: ['==', ['geometry-type'], 'Point'],
          paint: {
            'circle-color': ['coalesce', ['get', 'stroke'], '#3aa0ff'],
            'circle-radius': ['case',
              ['boolean', ['get', 'isNav'], false], 10,
              ['max', 7, ['*', ['coalesce', ['get', 'strokeWidth'], 2.5], 3]],
            ],
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 1.5,
          },
        });
      }
      // Source + layer for contour lines (separate so contours can be
      // styled distinctly with a thinner amber line).
      if (!map.getSource('app-contours')) {
        map.addSource('app-contours', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      }
      if (!map.getLayer('app-contours-line')) {
        map.addLayer({
          id: 'app-contours-line', type: 'line', source: 'app-contours',
          paint: {
            'line-color': '#ffd166',
            'line-width': 1.2,
            'line-opacity': 0.85,
          },
        });
      }
    } catch (e) {
      log.warn('[HydraulicGIS] ensureDerivedLayers failed:', e);
    }
  }
  // Push every feature in our store that has properties._derived === true
  // into the app-derived source. Called after addFeature for derived items.
  function syncDerivedLayer() {
    try {
      ensureDerivedLayers();
      const visibleDerived = state.features
        .filter(f => f.geojson && f.geojson.properties
          && (f.geojson.properties._derived || f.geojson.properties._navPoint || f.kind === 'point'))
        .filter(f => isFeatureVisible(f));

      const contourFeatures = visibleDerived.filter(f => f.geojson.properties._derivedKind === 'contours');
      const otherDerived = visibleDerived.filter(f => f.geojson.properties._derivedKind !== 'contours');

      const ctrSrc = map.getSource('app-contours');
      if (ctrSrc) {
        ctrSrc.setData({
          type: 'FeatureCollection',
          features: contourFeatures.map(f => ({
            type: 'Feature',
            id: f.id,
            geometry: f.geojson.geometry,
            properties: { id: f.id },
          })),
        });
      }

      const src = map.getSource('app-derived');
      if (src) {
        src.setData({
          type: 'FeatureCollection',
          features: otherDerived.map(f => ({
            type: 'Feature',
            geometry: f.geojson.geometry,
            properties: {
              id: f.id,
              stroke: f.style.stroke,
              strokeWidth: f.style.strokeWidth,
              fill: f.style.fill,
              fillOpacity: f.style.fillOpacity,
              isNav: !!(f.geojson.properties && f.geojson.properties._navPoint),
            },
          })),
        });
      }
      // Keep above td-* on every sync.
      for (const id of ['app-derived-fill', 'app-derived-outline', 'app-derived-line',
        'app-derived-point', 'app-contours-line',
        'app-contour-labels-symbol', 'app-contour-labels-point']) {
        if (map.getLayer(id)) try { map.moveLayer(id); } catch (_) {}
      }
    } catch (e) {
      log.warn('[HydraulicGIS] syncDerivedLayer failed:', e);
    }
  }
  // Backwards-compat alias kept for the contour code that calls it.
  function ensureContourLayer() { ensureDerivedLayers(); }

  // Layer + source for elevation labels on contour curves.
  function ensureContourLabelsLayer() {
    try {
      ensureDerivedLayers();
      if (!map.getSource('app-contour-labels')) {
        map.addSource('app-contour-labels', {
          type: 'geojson', data: { type: 'FeatureCollection', features: [] },
        });
      }
      if (!map.getLayer('app-contour-labels-symbol')) {
        map.addLayer({
          id: 'app-contour-labels-symbol', type: 'symbol', source: 'app-contour-labels',
          filter: ['==', ['geometry-type'], 'LineString'],
          layout: {
            'text-field': ['concat', ['to-string', ['round', ['get', 'elevation']]], ' m'],
            'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular'],
            'text-size': 11,
            'text-padding': 2,
            // Topographic-sheet style: the value rides along the curve and
            // repeats, instead of a single floating point label per level.
            'symbol-placement': 'line',
            'symbol-spacing': 150,
            'text-rotation-alignment': 'map',
            'text-pitch-alignment': 'viewport',
            'text-keep-upright': true,
            'text-max-angle': 25,
          },
          paint: {
            'text-color': '#ffd166',
            'text-halo-color': '#0b0f14',
            'text-halo-width': 1.6,
          },
        });
      }
      // Contours saved before line-placed labels stored one Point per level.
      if (!map.getLayer('app-contour-labels-point')) {
        map.addLayer({
          id: 'app-contour-labels-point', type: 'symbol', source: 'app-contour-labels',
          filter: ['==', ['geometry-type'], 'Point'],
          layout: {
            'text-field': ['concat', ['to-string', ['round', ['get', 'elevation']]], ' m'],
            'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular'],
            'text-size': 11,
            'text-padding': 2,
          },
          paint: {
            'text-color': '#ffd166',
            'text-halo-color': '#0b0f14',
            'text-halo-width': 1.6,
          },
        });
      }
    } catch (e) {
      log.warn('ensureContourLabelsLayer failed:', e);
    }
  }

  /* ═══ 11. PANEL CONTENT — COORDINATES ═══════════════════════════════════════ */
  let pickModeOff = null;
  let pickModeAbort = null;
  // Drop any armed "choisir sur la carte" gesture. Safe to call at any time.
  function cancelCoordPickMode() {
    const abort = pickModeAbort;
    pickModeOff = null;
    pickModeAbort = null;
    if (abort) { try { abort(); } catch (_) {} }
  }
  // coordHistory hoisted at script top.

  function renderCoordinates() {
    const country = preferredCrsCountry || 'MA';
    const opts = crsOptionsHtml(null, country);
    return `
      <div class="stack">
        <div>
          <label class="field-label">Pays / région</label>
          <select id="cc-country" class="field">${countryOptionsHtml(country)}</select>
          <p id="cc-suggest-hint" style="font-size:11px;color:var(--ink-2);margin:6px 0 0;">
            Pays et projection sont suggérés automatiquement selon le point (carte ou saisie) — vous pouvez les changer.
          </p>
        </div>

        <div>
          <label class="field-label">Système source</label>
          <select id="cc-from" class="field">${opts}</select>
          <select id="cc-format" class="field" style="margin-top:8px;">
            <option value="decimal">Degrés décimaux</option>
            <option value="dms">DMS (deg min sec)</option>
            <option value="dm">DM (deg min)</option>
          </select>
        </div>

        <div class="stack-tight" id="cc-coord-fields">
          <label>
            <span class="field-label" id="cc-a-lbl">Latitude</span>
            <input type="text" id="cc-a" class="field" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ex. 33.987654" style="font-family:'JetBrains Mono',ui-monospace,monospace;" />
          </label>
          <label>
            <span class="field-label" id="cc-b-lbl">Longitude</span>
            <input type="text" id="cc-b" class="field" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ex. -5.123456" style="font-family:'JetBrains Mono',ui-monospace,monospace;" />
          </label>
          <button class="btn btn-subtle" id="cc-pick" style="width:100%;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
            <span id="cc-pick-lbl">Choisir sur la carte</span>
          </button>
          <button class="btn btn-ghost" id="cc-utm" style="width:100%; font-size:12px;">
            Ajouter l’UTM de la carte / du point
          </button>
        </div>

        <div>
          <div class="row" style="justify-content:space-between;">
            <label class="field-label" style="margin-bottom:0;">Système cible</label>
            <button class="btn btn-ghost" id="cc-swap" style="font-size:12px; min-height:auto; padding:4px 8px;">↕ Inverser</button>
          </div>
          <select id="cc-to" class="field" style="margin-top:6px;">${opts}</select>
        </div>

        <div class="row">
          <button class="btn btn-solid" id="cc-convert" style="flex:1;">Convertir</button>
          <button class="btn btn-subtle" id="cc-fly" style="flex:1;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3 9 8 10 5-1 8-5 8-10V6l-8-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            Aller à
          </button>
        </div>

        <div id="cc-error" style="color:var(--danger); font-size:12px;"></div>
        <div id="cc-result" class="surface" style="display:none;"></div>

        ${(coordHistory && coordHistory.length > 0) ? `
          <div>
            <label class="field-label">Historique</label>
            <div id="cc-history">${coordHistory.map(renderHist).join('')}</div>
          </div>` : ''}
      </div>`;
  }

  function renderHist(h) {
    const inIs = CRS_BY_ID[h.from], outIs = CRS_BY_ID[h.to];
    const inText = inIs.isGeographic
      ? formatWgsPairDisplay(h.in[0], h.in[1], 6)
      : `${formatProjected(h.in[0])}, ${formatProjected(h.in[1])}`;
    const outText = outIs.isGeographic
      ? formatWgsPairDisplay(h.out[0], h.out[1], 6)
      : `${formatProjected(h.out[0])}, ${formatProjected(h.out[1])}`;
    return `<div class="hist-item">
      <div class="label">${inIs.label} → ${outIs.label}</div>
      <div>${inText}</div>
      <div class="out">${outText}</div>
    </div>`;
  }

  function attachCoordinatesEvents(root) {
    // A previous render may have left a pick gesture armed over destroyed
    // DOM nodes.
    cancelCoordPickMode();
    const fromSel = root.querySelector('#cc-from');
    const toSel = root.querySelector('#cc-to');
    const fmtSel = root.querySelector('#cc-format');
    const aIn = root.querySelector('#cc-a');
    const bIn = root.querySelector('#cc-b');
    const aLbl = root.querySelector('#cc-a-lbl');
    const bLbl = root.querySelector('#cc-b-lbl');
    const pickBtn = root.querySelector('#cc-pick');
    const pickLbl = root.querySelector('#cc-pick-lbl');
    const errEl = root.querySelector('#cc-error');
    const countrySel = root.querySelector('#cc-country');
    const hintEl = root.querySelector('#cc-suggest-hint');
    let userLockedCountry = false;
    let lastSuggestKey = '';

    fromSel.value = 'wgs84';
    // Prefer the national CRS of the selected country when available.
    const countryCrs = AtlasCRS.getCRSByCountry(preferredCrsCountry || 'MA')
      .filter((d) => d.epsg !== 4326 && d.epsg !== 3857);
    toSel.value = (countryCrs[0] && countryCrs[0].id) || 'lambert-maroc-1';
    if (![...toSel.options].some((o) => o.value === toSel.value)) {
      toSel.value = fromSel.value;
    }

    function crsMeta(id) {
      return CRS_BY_ID[id] || (() => {
        const d = AtlasCRS.getCRS(id);
        return d ? {
          id: d.id, label: d.label, isGeographic: d.isGeographic, axes: d.axes,
        } : null;
      })();
    }

    function setSuggestHint(text, kind) {
      if (!hintEl) return;
      hintEl.textContent = text || 'Pays et projection sont suggérés automatiquement selon le point (carte ou saisie) — vous pouvez les changer.';
      hintEl.style.color = kind === 'ok' ? 'var(--brand)'
        : kind === 'warn' ? 'var(--warning, #e6b35a)'
        : 'var(--ink-2)';
    }

    function refillCrsSelects(keepFrom, keepTo, countryCode) {
      const country = countryCode
        || (countrySel && countrySel.value)
        || preferredCrsCountry
        || 'MA';
      const html = crsOptionsHtml(null, country);
      const prevFrom = keepFrom || fromSel.value;
      const prevTo = keepTo || toSel.value;
      fromSel.innerHTML = html;
      toSel.innerHTML = html;
      if ([...fromSel.options].some((o) => o.value === prevFrom)) fromSel.value = prevFrom;
      else fromSel.value = 'wgs84';
      if ([...toSel.options].some((o) => o.value === prevTo)) toSel.value = prevTo;
      else {
        const firstProjected = [...toSel.options].find((o) => {
          const m = crsMeta(o.value);
          return m && !m.isGeographic;
        });
        toSel.value = firstProjected ? firstProjected.value : fromSel.value;
      }
      updateLabels();
    }

    /** Suggest country + default projected CRS for a WGS84 point. */
    function applyLocationSuggestion(lng, lat, opts) {
      opts = opts || {};
      if (!isFinite(lng) || !isFinite(lat)) return null;
      const key = lng.toFixed(4) + ',' + lat.toFixed(4);
      if (!opts.fromPick && !opts.force && key === lastSuggestKey) return null;
      let suggestion;
      try { suggestion = AtlasCRS.suggestForLocation(lat, lng); }
      catch (_) { return null; }
      if (!suggestion || !suggestion.country) return null;

      if (userLockedCountry && !opts.fromPick && !opts.force) {
        setSuggestHint(
          'Suggestion disponible (' + suggestion.countryName + ') — pays verrouillé manuellement.',
          'warn'
        );
        return suggestion;
      }

      lastSuggestKey = key;
      preferredCrsCountry = suggestion.country;
      try { localStorage.setItem('hydraulic-gis:crs-country:v1', preferredCrsCountry); } catch (_) {}
      if (countrySel) countrySel.value = suggestion.country;

      const wantTo = (suggestion.crs && suggestion.crs.id) || null;
      refillCrsSelects(
        opts.forceFromWgs84 ? 'wgs84' : fromSel.value,
        wantTo,
        suggestion.country
      );
      if (opts.forceFromWgs84) fromSel.value = 'wgs84';
      if (wantTo && [...toSel.options].some((o) => o.value === wantTo)) toSel.value = wantTo;
      updateLabels();

      const conf = suggestion.confidence >= 0.8 ? 'ok' : 'warn';
      const crsLabel = suggestion.crs ? suggestion.crs.label : '—';
      setSuggestHint(
        'Détecté : ' + suggestion.countryName
          + ' · projection proposée « ' + crsLabel + ' »'
          + (suggestion.confidence < 0.7 ? ' (incertitude — vérifiez)' : '')
          + ' — modifiable.',
        conf
      );
      return suggestion;
    }

    function suggestFromCurrentInputs() {
      try {
        const inp = readCoordPairFromUi(fromSel.value, aIn.value, bIn.value);
        if (!inp) return;
        const wgs = coordsToWgs84(inp, fromSel.value);
        if (!wgs || !isFinite(wgs[0]) || !isFinite(wgs[1])) return;
        if (Math.abs(wgs[1]) > 90 || Math.abs(wgs[0]) > 180) return;
        applyLocationSuggestion(wgs[0], wgs[1], { forceFromWgs84: false });
      } catch (_) {}
    }

    if (ui._pendingPickResult) {
      const pending = ui._pendingPickResult;
      ui._pendingPickResult = null;
      userLockedCountry = false;
      if (pending.lng != null && pending.lat != null) {
        applyLocationSuggestion(pending.lng, pending.lat, {
          fromPick: true,
          forceFromWgs84: true,
          force: true,
        });
      }
      if (pending.fromCrs && [...fromSel.options].some((o) => o.value === pending.fromCrs)) {
        fromSel.value = pending.fromCrs;
      } else {
        fromSel.value = 'wgs84';
      }
      updateLabels();
      setTimeout(() => {
        if (aIn) aIn.value = pending.a || '';
        if (bIn) bIn.value = pending.b || '';
      }, 0);
    }

    function updateLabels() {
      const c = crsMeta(fromSel.value);
      if (!c) return;
      if (c.isGeographic) {
        aLbl.textContent = t('lat');
        bLbl.textContent = t('lon');
        const fmt = (fmtSel && fmtSel.value) || 'decimal';
        if (fmt === 'dms') {
          aIn.placeholder = t('fmt_ex_dms_lat');
          bIn.placeholder = t('fmt_ex_dms_lon');
        } else if (fmt === 'dm') {
          aIn.placeholder = t('fmt_ex_dm_lat');
          bIn.placeholder = t('fmt_ex_dm_lon');
        } else {
          aIn.placeholder = t('fmt_ex_decimal_lat');
          bIn.placeholder = t('fmt_ex_decimal_lon');
        }
      } else {
        aLbl.textContent = c.axes[0];
        bLbl.textContent = c.axes[1];
        aIn.placeholder = 'e.g. 500000.00';
        bIn.placeholder = 'e.g. 300000.00';
      }
      if (fmtSel) fmtSel.style.display = c.isGeographic ? 'block' : 'none';
    }
    updateLabels();
    fromSel.addEventListener('change', updateLabels);
    if (fmtSel) {
      fmtSel.addEventListener('change', updateLabels);
      // Localize format option labels
      [...fmtSel.options].forEach((o) => {
        if (o.value === 'decimal') o.textContent = t('format_decimal');
        if (o.value === 'dms') o.textContent = t('format_dms');
        if (o.value === 'dm') o.textContent = t('format_dm');
      });
    }

    if (countrySel) {
      countrySel.addEventListener('change', () => {
        userLockedCountry = true;
        preferredCrsCountry = countrySel.value;
        try { localStorage.setItem('hydraulic-gis:crs-country:v1', preferredCrsCountry); } catch (_) {}
        refillCrsSelects('wgs84', null, preferredCrsCountry);
        const name = (AtlasCRS.listCountries().find((c) => c.code === preferredCrsCountry) || {}).name
          || preferredCrsCountry;
        setSuggestHint('Pays choisi manuellement : ' + name + ' — un nouveau point sur la carte recalculera la suggestion.', 'warn');
      });
    }

    let suggestTimer = null;
    const scheduleSuggestFromInputs = () => {
      clearTimeout(suggestTimer);
      suggestTimer = setTimeout(suggestFromCurrentInputs, 350);
    };
    if (aIn) {
      aIn.addEventListener('blur', suggestFromCurrentInputs);
      aIn.addEventListener('change', scheduleSuggestFromInputs);
      aIn.addEventListener('input', scheduleSuggestFromInputs);
    }
    if (bIn) {
      bIn.addEventListener('blur', suggestFromCurrentInputs);
      bIn.addEventListener('change', scheduleSuggestFromInputs);
      bIn.addEventListener('input', scheduleSuggestFromInputs);
    }

    const utmBtn = root.querySelector('#cc-utm');
    if (utmBtn) {
      utmBtn.addEventListener('click', (e) => {
        e.preventDefault();
        let lng, lat;
        try {
          const c = map.getCenter();
          lng = c.lng; lat = c.lat;
        } catch (_) {}
        try {
          const wgs = resolveFlyWgs84();
          if (wgs) { lng = wgs[0]; lat = wgs[1]; }
        } catch (_) {}
        if (!isFinite(lng) || !isFinite(lat)) {
          errEl.textContent = 'Position indisponible pour calculer l’UTM.';
          return;
        }
        applyLocationSuggestion(lng, lat, { force: true });
        const utm = ensureUtmForLngLat(lng, lat);
        if (!utm) {
          errEl.textContent = 'Impossible de générer la zone UTM.';
          return;
        }
        [fromSel, toSel].forEach((sel) => {
          if (![...sel.options].some((o) => o.value === utm.id)) {
            const opt = document.createElement('option');
            opt.value = utm.id;
            opt.textContent = utm.label;
            sel.appendChild(opt);
          }
        });
        toSel.value = utm.id;
        errEl.textContent = '';
        const hint = root.querySelector('#cc-result');
        if (hint) {
          hint.style.display = 'block';
          hint.innerHTML = `<div style="font-size:12px;color:var(--ink-1);">Zone UTM ajoutée : <strong>${escapeHtml(utm.label)}</strong> (lon ${lng.toFixed(4)}, lat ${lat.toFixed(4)}).</div>`;
        }
      });
    }

    function parseInputs() {
      return readCoordPairFromUi(fromSel.value, aIn.value, bIn.value);
    }

    function resolveFlyWgs84() {
      if (lastCoordFlyTarget && lastCoordFlyTarget.length >= 2
          && isFinite(lastCoordFlyTarget[0]) && isFinite(lastCoordFlyTarget[1])) {
        return lastCoordFlyTarget.slice();
      }
      const resultEl = root.querySelector('#cc-result');
      if (ui._lastCoordConversion && resultEl && resultEl.style.display !== 'none') {
        const wgs = coordsToWgs84(ui._lastCoordConversion.out, ui._lastCoordConversion.to);
        if (wgs && wgs.length >= 2 && isFinite(wgs[0]) && isFinite(wgs[1])) return wgs;
      }
      const inp = parseInputs();
      if (!inp) return null;
      const wgs = coordsToWgs84(inp, fromSel.value);
      if (!wgs || wgs.length < 2 || !isFinite(wgs[0]) || !isFinite(wgs[1])) return null;
      return wgs;
    }

    pickBtn.addEventListener('click', () => {
      if (pickModeOff) { pickModeOff(); pickModeOff = null; pickLbl.textContent = 'Choisir sur la carte'; return; }
      pickLbl.textContent = 'Cliquez sur la carte…';
      const canvas = map.getCanvas();
      canvas.style.cursor = 'crosshair';
      // Put terra-draw into a no-op mode so it doesn't intercept our tap.
      // Otherwise, if the user had recently used a draw mode (or select),
      // terra-draw is still listening on pointerdown via its capture-phase
      // adapter, and our map.once('click') never fires.
      let prevMode = null;
      try {
        const td = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
        if (td && typeof td.getMode === 'function' && typeof td.setMode === 'function') {
          prevMode = td.getMode();
          if (prevMode !== 'static') td.setMode('static');
        }
      } catch (_) {}
      // On mobile, the bottom-sheet panel covers most of the map, making it
      // impossible to tap on the visible area. We hide the sheet during the
      // pick gesture and reopen it once a coordinate has been chosen.
      const wasMobileSheetOpen = ui.isMobile()
        && document.getElementById('sheet').classList.contains('visible');
      if (wasMobileSheetOpen) {
        document.getElementById('scrim').classList.remove('visible');
        document.getElementById('sheet').classList.remove('visible');
      }
      // Show a top-screen banner so the user knows pick is active and has
      // a way to cancel without finding the original button.
      const banner = ensurePickBanner();
      banner.textContent = t('pick_banner');
      banner.classList.add('visible');
      const restoreMode = () => {
        try {
          const td = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
          if (td && prevMode && prevMode !== 'static' && typeof td.setMode === 'function') {
            td.setMode(prevMode);
          }
        } catch (_) {}
      };
      const reopenSheet = () => {
        if (wasMobileSheetOpen) {
          // Reopen the sheet on the same panel (coordinates) so the user
          // sees their newly-filled input.
          ui.openSheet('coordinates');
        }
      };
      const cleanup = () => {
        canvas.style.cursor = '';
        banner.classList.remove('visible');
        pickLbl.textContent = 'Choisir sur la carte';
        restoreMode();
      };
      const onClick = (e) => {
        const { lng, lat } = e.lngLat;
        // Map pick is always WGS84; country/CRS are suggested when the panel reopens.
        const fields = formatCoordFieldsForCrs('wgs84', [lng, lat]);
        ui._pendingPickResult = {
          a: fields.a,
          b: fields.b,
          fromCrs: 'wgs84',
          lng,
          lat,
        };
        lastCoordFlyTarget = [lng, lat];
        pickModeOff = null;
        pickModeAbort = null;
        cleanup();
        reopenSheet();
      };
      map.once('click', onClick);
      // Banner cancel handler
      banner.onclick = () => {
        if (pickModeOff) { pickModeOff(); pickModeOff = null; }
      };
      pickModeOff = () => {
        map.off('click', onClick);
        cleanup();
        reopenSheet();
      };
      // Teardown without reopening the sheet, for when the panel is closed or
      // re-rendered while pick mode is still armed. Without it the stale
      // map.once('click') survived and the next tap anywhere on the map
      // re-opened the Coordonnées sheet out of nowhere.
      pickModeAbort = () => {
        map.off('click', onClick);
        try { cleanup(); } catch (_) {}
      };
    });

    root.querySelector('#cc-swap').addEventListener('click', () => {
      const a = fromSel.value, b = toSel.value;
      fromSel.value = b; toSel.value = a;
      aIn.value = ''; bIn.value = '';
      ui._lastCoordConversion = null;
      lastCoordFlyTarget = null;
      const resultEl = root.querySelector('#cc-result');
      if (resultEl) resultEl.style.display = 'none';
      updateLabels();
    });

    function showConvertResult(out, fromId, toId) {
      const resultEl = root.querySelector('#cc-result');
      if (!resultEl) return;
      const outCrs = CRS_BY_ID[toId] || AtlasCRS.getCRS(toId);
      if (!outCrs) return;
      const [lng, lat] = coordsToWgs84(out, toId);
      const fmt = (fmtSel && fmtSel.value) || 'decimal';
      const labelA = outCrs.isGeographic ? t('lat') : outCrs.axes[0];
      const labelB = outCrs.isGeographic ? t('lon') : outCrs.axes[1];
      let outDispA, outDispB, copyLine;
      if (outCrs.isGeographic) {
        if (fmt === 'dms') {
          outDispA = formatDMS(lat, 'lat');
          outDispB = formatDMS(lng, 'lon');
        } else if (fmt === 'dm') {
          outDispA = formatDM(lat, 'lat');
          outDispB = formatDM(lng, 'lon');
        } else {
          outDispA = formatDecimal(lat, 6);
          outDispB = formatDecimal(lng, 6);
        }
        copyLine = fmt === 'decimal'
          ? formatWgsPairCopy(lng, lat, 8)
          : `${outDispA}, ${outDispB}`;
      } else {
        outDispA = formatProjected(out[0], 3);
        outDispB = formatProjected(out[1], 3);
        copyLine = `${out[0].toFixed(3)}, ${out[1].toFixed(3)}`;
      }
      const wgsCopy = formatWgsPairCopy(lng, lat, 8);
      const gmaps = googleMapsUrl(lat, lng);
      resultEl.style.display = 'block';
      resultEl.innerHTML = `
        <div class="field-label" style="margin-bottom:6px;">Résultat — ${escapeHtml(outCrs.label)}</div>
        <div style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; color:var(--ink-1); margin-bottom:4px;">
          <div><span style="color:var(--ink-2)">${escapeHtml(labelA)} :</span> ${outDispA}</div>
          <div><span style="color:var(--ink-2)">${escapeHtml(labelB)} :</span> ${outDispB}</div>
          <div style="margin-top:6px; font-size:11px; color:var(--ink-2);">WGS84 (lat, lon) : ${formatWgsPairDisplay(lng, lat, 6)}</div>
        </div>
        <div class="row" style="gap:6px; flex-wrap:wrap; margin-top:8px;">
          <button type="button" class="btn btn-ghost" id="cc-copy-result" style="flex:1; min-width:120px;">Copier résultat</button>
          <button type="button" class="btn btn-ghost" id="cc-copy-wgs" style="flex:1; min-width:120px;">Copier WGS84</button>
          <a class="btn btn-subtle" id="cc-gmaps" href="${gmaps}" target="_blank" rel="noopener noreferrer" style="flex:1; min-width:120px; text-decoration:none; justify-content:center;">Ouvrir dans Google Maps</a>
        </div>`;
      root.querySelector('#cc-copy-result')?.addEventListener('click', () => {
        copyTextToClipboard(copyLine).then((ok) => {
          const b = root.querySelector('#cc-copy-result');
          if (b) { const p = b.textContent; b.textContent = ok ? 'Copié ✓' : 'Échec'; setTimeout(() => { b.textContent = p; }, 1400); }
        });
      });
      root.querySelector('#cc-copy-wgs')?.addEventListener('click', () => {
        copyTextToClipboard(wgsCopy).then((ok) => {
          const b = root.querySelector('#cc-copy-wgs');
          if (b) { const p = b.textContent; b.textContent = ok ? 'Copié ✓' : 'Échec'; setTimeout(() => { b.textContent = p; }, 1400); }
        });
      });
    }

    root.querySelector('#cc-convert').addEventListener('click', () => {
      errEl.textContent = '';
      // If the typed point is elsewhere (e.g. Spain while lists still say Morocco),
      // refresh country/CRS suggestions first — unless the user locked the country.
      suggestFromCurrentInputs();
      const inp = parseInputs();
      if (!inp) { errEl.textContent = 'Coordonnées invalides — vérifiez le format.'; return; }
      const out = reproject(inp, fromSel.value, toSel.value);
      ui._lastCoordConversion = { from: fromSel.value, to: toSel.value, in: inp, out };
      lastCoordFlyTarget = coordsToWgs84(out, toSel.value);
      if (!lastCoordFlyTarget || !isFinite(lastCoordFlyTarget[0]) || !isFinite(lastCoordFlyTarget[1])) {
        lastCoordFlyTarget = coordsToWgs84(inp, fromSel.value);
      }
      coordHistory.unshift({ from: fromSel.value, to: toSel.value, in: inp, out, ts: Date.now() });
      coordHistory = coordHistory.slice(0, 20);
      showConvertResult(out, fromSel.value, toSel.value);
      // CRITICAL: do NOT call ui.render() here — it re-renders the whole
      // panel, which DESTROYS the cc-x and cc-y input DOM nodes and
      // RECREATES them empty. That was the cause of "Aller à" failing
      // after a successful convert: the inputs looked the same to the user
      // but were actually empty <input> elements with no value.
      // Instead, surgically refresh just the history section.
      refreshHistory();
    });

    // Re-render only the history block (without rebuilding the input fields).
    // Also wires click handlers so tapping a history row flies to that point.
    function refreshHistory() {
      let histWrap = root.querySelector('#cc-history');
      if (!histWrap) {
        // The history wrapper didn't exist (first conversion of the session).
        // We need to create the surrounding label/wrapper. Easiest: append.
        const errBlock = root.querySelector('#cc-error');
        const block = document.createElement('div');
        block.innerHTML = `<label class="field-label">Historique</label>
                           <div id="cc-history"></div>`;
        errBlock.parentNode.insertBefore(block, errBlock.nextSibling);
        histWrap = root.querySelector('#cc-history');
      }
      histWrap.innerHTML = coordHistory.map(renderHist).join('');
      // Make each row clickable: tap → fly to the converted point. We use
      // the WGS84 form for fly-to. If neither side is WGS84 we project the
      // input through it (Lambert is in metres, not lng/lat).
      histWrap.querySelectorAll('.hist-item').forEach((el, i) => {
        el.style.cursor = 'pointer';
        el.title = 'Touchez pour aller à ce point';
        el.addEventListener('click', () => {
          const h = coordHistory[i];
          if (!h) return;
          let lng, lat;
          if (h.from === 'wgs84') { [lng, lat] = h.in; }
          else if (h.to === 'wgs84') { [lng, lat] = h.out; }
          else { [lng, lat] = reproject(h.in, h.from, 'wgs84'); }
          map.flyTo({ center: [lng, lat], zoom: Math.min(13, map.getMaxZoom()), essential: true });
          createNavPoint(lng, lat);
        });
      });
    }
    // Wire history rows that were rendered server-side (i.e. on initial
    // render of an already-populated history).
    refreshHistory();

    root.querySelector('#cc-fly').addEventListener('click', () => {
      errEl.textContent = '';
      const wgs = resolveFlyWgs84();
      if (!wgs) { errEl.textContent = 'Coordonnées invalides — saisissez ou convertissez d\'abord.'; return; }
      const [lng, lat] = wgs;
      if (!flyToWgsPoint(lng, lat)) {
        errEl.textContent = 'Coordonnées hors limites.';
      }
    });
  }

  function renderSearch() {

          </button>
        </div>

        <div id="sr-error" style="color:var(--danger); font-size:12px;"></div>

        <div class="surface" style="font-size:12px;">
          <div style="font-weight:500; margin-bottom:6px;">Exemples :</div>
          <div style="font-family:'JetBrains Mono',ui-monospace,monospace; color:var(--ink-1); line-height:1.6;">
            • Marrakech : <span style="color:var(--brand); cursor:pointer;" data-fill="31.6295, -8.0083">31.6295, -8.0083</span><br/>
            • Casablanca : <span style="color:var(--brand); cursor:pointer;" data-fill="33.5731, -7.5898">33.5731, -7.5898</span><br/>
            • Rabat : <span style="color:var(--brand); cursor:pointer;" data-fill="34.0209, -6.8326">34.0209, -6.8326</span>
          </div>
        </div>

        ${searchHistory.length > 0 ? `
          <div>
            <label class="field-label">Historique récent</label>
            <div id="sr-history" class="stack-tight">
              ${searchHistory.map(h => `
                <button class="surface" style="display:flex; flex-direction:column; align-items:flex-start; gap:2px; cursor:pointer; text-align:left; width:100%; padding:8px 12px; border:1px solid var(--line); background:var(--bg-2); color:var(--ink-0);" data-recall="${escapeHtml(h.input)}">
                  <span style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px;">${escapeHtml(h.input)}</span>
                  <span style="font-size:10px; color:var(--ink-2);">${escapeHtml(h.crs)}</span>
