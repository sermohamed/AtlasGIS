  function attachSearchEvents(root) {
    const inp = root.querySelector('#sr-input');
    const crsSel = root.querySelector('#sr-crs');
    const errEl = root.querySelector('#sr-error');

    function go() {
      errEl.textContent = '';
      let raw = inp.value.trim();
      if (!raw) { errEl.textContent = 'Saisissez une coordonnée.'; return; }
      // Be lenient: strip parentheses/brackets and collapse whitespace.
      raw = raw.replace(/[()[\]{}]/g, '').trim();
      const parts = raw.split(/[,;\s]+/).filter(Boolean);
      if (parts.length < 2) { errEl.textContent = 'Format attendu : deux nombres séparés par une virgule, un espace ou un point-virgule.'; return; }
      let a = parseCoord(parts[0]); if (a === null) a = parseFloat(parts[0].replace(',', '.'));
      let b = parseCoord(parts[1]); if (b === null) b = parseFloat(parts[1].replace(',', '.'));
      if (isNaN(a)) { errEl.textContent = `« ${parts[0]} » n'est pas un nombre valide.`; return; }
      if (isNaN(b)) { errEl.textContent = `« ${parts[1]} » n'est pas un nombre valide.`; return; }

      let lng, lat;
      if (crsIsGeographic(crsSel.value)) {
        const parsed = parseWgsInputPair(a, b);
        if (!parsed) { errEl.textContent = 'Coordonnées invalides.'; return; }
        lng = parsed.lng;
        lat = parsed.lat;
      } else {
        const wgs = reproject([a, b], crsSel.value, 'wgs84');
        lng = wgs[0]; lat = wgs[1];
      }

      if (isNaN(lng) || isNaN(lat) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
        errEl.textContent = 'Coordonnées hors limites.'; return;
      }

      // Register as a deletable point object in Calques.
      createNavPoint(lng, lat, raw || `Point (${formatWgsPairDisplay(lng, lat, 5)})`);
      map.flyTo({ center: [lng, lat], zoom: Math.min(13, map.getMaxZoom()), essential: true });

      // Add to history
      const crsLabel = (CRS_BY_ID[crsSel.value] || AtlasCRS.getCRS(crsSel.value) || {}).label || crsSel.value;
      searchHistory.unshift({ input: raw, crs: crsLabel, ts: Date.now() });
      searchHistory = searchHistory.slice(0, 8);
      // renderSearch is the only reader, so without this the new entry stayed
      // invisible until the user switched panels and came back.
      ui.render();
    }

    root.querySelector('#sr-go').addEventListener('click', go);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    root.querySelector('#sr-clear').addEventListener('click', () => {
      clearEphemeralMarkers();
      inp.value = '';
      errEl.textContent = '';
    });
    root.querySelectorAll('[data-fill]').forEach(el => {
      el.addEventListener('click', () => { inp.value = el.dataset.fill; go(); });
    });
    root.querySelectorAll('[data-recall]').forEach(el => {
      el.addEventListener('click', () => { inp.value = el.dataset.recall; go(); });
    });
  }

  function renderElevation() {
    const sel = state.features.filter(f => state.selectedIds.includes(f.id) && f.kind === 'line');
    if (sel.length === 0) {
      return `<div class="empty-state">

    }
    if (sel.length > 1) {
      return `<div class="empty-state">Sélectionnez une seule ligne à la fois pour le profil d'élévation.</div>`;
    }
    const f = sel[0];
    const cached = elevationCache.get(f.id);
    return `
      <div class="stack">
        <div style="font-size:12px; color:var(--ink-2);">
          Ligne sélectionnée : <span style="color:var(--ink-0)">${escapeHtml(f.name)}</span>

          <button class="btn btn-solid" id="el-fetch" style="width:100%;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 18l5-9 4 5 4-7 5 11H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>

          <p style="font-size:11px; color:var(--ink-2); margin:0;">

            Une connexion internet est requise.
          </p>
        `}

        <div id="el-status" style="font-size:12px;"></div>
      </div>`;
  }

  function renderElevationChart(data) {
    // data = { samples: [{distM, elev, lng, lat}, ...], stats: {min, max, ascent, descent} }
    const W = 320, H = 180, PAD_L = 36, PAD_R = 8, PAD_T = 8, PAD_B = 22;
    const innerW = W - PAD_L - PAD_R;
    const innerH = H - PAD_T - PAD_B;
    const xs = data.samples.map(s => s.distM);
    const ys = data.samples.map(s => s.elev);
    const xMax = Math.max(...xs);
    const yMin = Math.min(...ys);
    const yMax = Math.max(...ys);
    const yPad = Math.max(2, (yMax - yMin) * 0.1);
    const yLo = yMin - yPad, yHi = yMax + yPad;
    const px = (d) => PAD_L + (xMax > 0 ? d / xMax : 0) * innerW;
    const py = (z) => PAD_T + innerH - ((z - yLo) / (yHi - yLo)) * innerH;

    // Build path
    const points = data.samples.map(s => `${px(s.distM).toFixed(1)},${py(s.elev).toFixed(1)}`).join(' L ');
    const areaPoints = `${PAD_L},${PAD_T + innerH} L ${points} L ${PAD_L + innerW},${PAD_T + innerH} Z`;

    // Axis labels
    const yTicks = 4;
    const yTickEls = [];
    for (let i = 0; i <= yTicks; i++) {
      const z = yLo + (yHi - yLo) * (i / yTicks);
      const yPos = py(z);
      yTickEls.push(`<text x="${PAD_L - 4}" y="${yPos + 3}" text-anchor="end" font-size="9" fill="#aab4c2" font-family="monospace">${z.toFixed(0)}</text>`);
      yTickEls.push(`<line x1="${PAD_L}" y1="${yPos}" x2="${PAD_L + innerW}" y2="${yPos}" stroke="#232c38" stroke-width="0.5"/>`);
    }
    const totalDistM = data.samples.length ? data.samples[data.samples.length - 1].distM : 0;
    const acc = estimateElevationAccuracy(data.samples, data.stats);
    const xTicks = 4;
    const xTickEls = [];
    for (let i = 0; i <= xTicks; i++) {
      const d = (xMax * i) / xTicks;
      const xPos = px(d);
      xTickEls.push(`<text x="${xPos}" y="${H - 6}" text-anchor="middle" font-size="9" fill="#aab4c2" font-family="monospace">${d < 1000 ? d.toFixed(0) + 'm' : (d / 1000).toFixed(1) + 'km'}</text>`);
    }

    return `
      <div>
        <svg id="el-svg" viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; background:var(--bg-2); border:1px solid var(--line); border-radius:6px; display:block;">
          ${yTickEls.join('')}
          ${xTickEls.join('')}
          <path d="M ${areaPoints}" fill="rgba(58,160,255,0.15)"/>
          <path d="M ${points}" fill="none" stroke="#3aa0ff" stroke-width="1.5"/>
          <line id="el-cursor" x1="-10" y1="${PAD_T}" x2="-10" y2="${PAD_T + innerH}" stroke="#f7b955" stroke-width="1" stroke-dasharray="2,2"/>
          <circle id="el-cursor-dot" cx="-10" cy="-10" r="3" fill="#f7b955"/>
          <text id="el-cursor-text" x="0" y="0" font-size="10" fill="#f7b955" font-family="monospace" visibility="hidden"></text>
          <rect id="el-hit" x="${PAD_L}" y="${PAD_T}" width="${innerW}" height="${innerH}" fill="transparent"/>
        </svg>

        <div class="surface" style="margin-top:10px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; padding:10px;">
          <div class="row" style="justify-content:space-between;">
            <span><span style="color:var(--ink-2)">Min :</span> ${data.stats.min.toFixed(0)} m</span>
            <span><span style="color:var(--ink-2)">Max :</span> ${data.stats.max.toFixed(0)} m</span>
          </div>
          <div class="row" style="justify-content:space-between; margin-top:4px;">
            <span style="color:#3ecf8e;"><span style="color:var(--ink-2)">▲ Montée :</span> ${data.stats.ascent.toFixed(0)} m</span>
            <span style="color:#ef5a5a;"><span style="color:var(--ink-2)">▼ Descente :</span> ${data.stats.descent.toFixed(0)} m</span>
          </div>
          <div style="margin-top:4px;">
            <span style="color:var(--ink-2)">Pente moyenne :</span> ${totalDistM > 0 ? (data.stats.ascent / totalDistM * 100).toFixed(1) : '0.0'} %
          </div>
          <div style="margin-top:6px; padding-top:6px; border-top:1px solid var(--line);">
            <span style="color:var(--ink-2)">Marge d'erreur :</span>
            <span style="color:#f7b955;">± ${acc.absM.toFixed(1)} m (≈ ± ${acc.pct.toFixed(1)} %)</span>
          </div>
        </div>
        <p style="font-size:10.5px; color:var(--ink-2); margin:6px 0 0; line-height:1.45;">
          Estimation basée sur le MNT Copernicus GLO-90 (maille ≈ 90 m, erreur verticale ≈ ± 4 m),
          majorée par la pente locale. Le pourcentage est rapporté au dénivelé total du profil
          (${(data.stats.max - data.stats.min).toFixed(0)} m). Les valeurs de montée et de descente
          sont surestimées par le bruit du MNT ; ce profil ne remplace pas un levé topographique.
        </p>

        <button class="btn btn-subtle" id="el-recompute" style="width:100%; margin-top:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5 M4 9a8 8 0 0114-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 20v-5h-5 M20 15a8 8 0 01-14 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Recalculer

  }

  function attachElevationEvents(root) {
    const fetchBtn = root.querySelector('#el-fetch');
    const recompute = root.querySelector('#el-recompute');
    const status = root.querySelector('#el-status');
    const sel = state.features.filter(f => state.selectedIds.includes(f.id) && f.kind === 'line');
    if (sel.length !== 1) return;
    const f = sel[0];

    async function fetchProfile() {
      if (status) { status.className = 'notice'; status.textContent = 'Échantillonnage de la ligne…'; }
      try {
        const samples = sampleLine(f.geojson, 100);
        if (status) status.textContent = `Récupération de ${samples.length} élévations…`;
        const elevs = await fetchElevations(samples.map(s => [s.lng, s.lat]));
        const enriched = samples.map((s, i) => ({ ...s, elev: elevs[i] }));
        const stats = computeElevationStats(enriched);
        elevationCache.set(f.id, { samples: enriched, stats });
        if (status) { status.className = 'notice notice-success'; status.textContent = 'Profil calculé.'; }
        ui.render();
      } catch (err) {
        if (status) {
          status.className = 'notice notice-error';
          status.textContent = `Erreur : ${err.message}`;
        }
      }
    }
    if (fetchBtn) fetchBtn.addEventListener('click', fetchProfile);
    if (recompute) recompute.addEventListener('click', () => { elevationCache.delete(f.id); ui.render(); });

    // Hover sync between chart and map
    const svg = root.querySelector('#el-svg');
    const hit = root.querySelector('#el-hit');
    if (svg && hit && elevationCache.has(f.id)) {
      const data = elevationCache.get(f.id);
      const cursor = svg.querySelector('#el-cursor');
      const cursorDot = svg.querySelector('#el-cursor-dot');
      const cursorText = svg.querySelector('#el-cursor-text');

      const W = 320, PAD_L = 36, PAD_R = 8, PAD_T = 8, PAD_B = 22, H = 180;
      const innerW = W - PAD_L - PAD_R;
      const innerH = H - PAD_T - PAD_B;
      const xs = data.samples.map(s => s.distM);
      const ys = data.samples.map(s => s.elev);
      const xMax = Math.max(...xs);
      const yMin = Math.min(...ys), yMax = Math.max(...ys);
      const yPad = Math.max(2, (yMax - yMin) * 0.1);
      const yLo = yMin - yPad, yHi = yMax + yPad;

      function onMove(e) {
        const rect = hit.getBoundingClientRect();
        const cx = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
        const ratio = (cx - rect.left) / rect.width;
        if (ratio < 0 || ratio > 1) return;
        const dist = ratio * xMax;
        // Find nearest sample
        let bestI = 0, bestD = Infinity;
        for (let i = 0; i < data.samples.length; i++) {
          const d = Math.abs(data.samples[i].distM - dist);
          if (d < bestD) { bestD = d; bestI = i; }
        }
        const s = data.samples[bestI];
        const px = PAD_L + (s.distM / xMax) * innerW;
        const py = PAD_T + innerH - ((s.elev - yLo) / (yHi - yLo)) * innerH;
        cursor.setAttribute('x1', px); cursor.setAttribute('x2', px);
        cursorDot.setAttribute('cx', px); cursorDot.setAttribute('cy', py);
        cursorText.setAttribute('x', Math.min(px + 4, W - 60));
        cursorText.setAttribute('y', Math.max(py - 4, 12));
        cursorText.textContent = `${s.elev.toFixed(0)}m · ${formatDistance(s.distM)}`;
        cursorText.setAttribute('visibility', 'visible');

        // Show map hover marker
        if (!elevationHoverMarker) {
          const dot = document.createElement('div');
          dot.style.cssText = 'width:14px;height:14px;border-radius:50%;background:#f7b955;border:2px solid #fff;box-shadow:0 0 8px rgba(247,185,85,0.6);';
          elevationHoverMarker = new maplibregl.Marker({ element: dot }).setLngLat([s.lng, s.lat]).addTo(map);
        } else {
          elevationHoverMarker.setLngLat([s.lng, s.lat]);
        }
      }
      function onLeave() {
        cursor.setAttribute('x1', -10); cursor.setAttribute('x2', -10);
        cursorDot.setAttribute('cx', -10); cursorDot.setAttribute('cy', -10);
        cursorText.setAttribute('visibility', 'hidden');
        if (elevationHoverMarker) { elevationHoverMarker.remove(); elevationHoverMarker = null; }
      }
      hit.addEventListener('mousemove', onMove);
      hit.addEventListener('mouseleave', onLeave);
      hit.addEventListener('touchmove', onMove, { passive: true });
      hit.addEventListener('touchend', onLeave);
    }
  }

  // Sample a LineString into N points with distance-along values.
  function sampleLine(feature, n) {
    const coords = feature.geometry.coordinates;
    if (!coords || coords.length < 2) throw new Error('Ligne invalide.');
    // Total length using turf
    const totalKm = turf.length(feature, { units: 'kilometers' });
    // A zero-length line (two taps on the same spot) would make every sample
    // sit at distance 0, and the chart's d / xMax became NaN: the stats card
    // rendered but the curve silently vanished.
    if (!(totalKm > 0)) throw new Error('Ligne de longueur nulle : impossible de tracer un profil.');
    const step = totalKm / (n - 1);
    const samples = [];
    for (let i = 0; i < n; i++) {
      const distKm = i * step;
      const pt = turf.along(feature, distKm, { units: 'kilometers' });
      const c = pt.geometry.coordinates;
      samples.push({ lng: c[0], lat: c[1], distM: distKm * 1000 });
    }
    return samples;
  }

  async function fetchElevations(lngLats) {
    // Open-Meteo elevation API: https://api.open-meteo.com/v1/elevation
    // Limit: 100 points per request, &latitude=...&longitude=... (comma-sep).
    const all = [];
    const CHUNK = 100;
    for (let i = 0; i < lngLats.length; i += CHUNK) {
      const chunk = lngLats.slice(i, i + CHUNK);
      const lats = chunk.map(c => c[1].toFixed(6)).join(',');
      const lons = chunk.map(c => c[0].toFixed(6)).join(',');
      const url = `https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Open-Meteo HTTP ${resp.status}`);
      const data = await resp.json();
      if (!data.elevation) throw new Error('Réponse Open-Meteo invalide.');
      all.push(...data.elevation);
    }
    // The API returns null over water / on tile gaps. A single null turns the
    // whole SVG path into "NaN" and the chart silently disappears, so carry
    // the last known value forward (and backward for a leading null).
    let firstGood = null, lastGood = null;
    for (let i = 0; i < all.length; i++) {
      const v = Number(all[i]);
      if (Number.isFinite(v)) {
        all[i] = v;
        lastGood = v;
        if (firstGood === null) firstGood = v;
      } else {
        all[i] = lastGood;
      }
    }
    if (firstGood === null) throw new Error('Aucune altitude disponible sur cette ligne.');
    for (let i = 0; i < all.length && all[i] === null; i++) all[i] = firstGood;
    return all;
  }

  // Open-Meteo serves Copernicus DEM GLO-90: ~90 m posting, vertical accuracy
  // around ±4 m (LE90) on open terrain. On a slope, the horizontal sampling
  // error (~half a cell) turns into extra vertical error, so the margin grows
  // with the terrain gradient.
  const DEM_VERTICAL_RMSE_M = 4;
  const DEM_POSTING_M = 90;

  function estimateElevationAccuracy(samples, stats) {
    let slopeSum = 0, slopeN = 0;
    for (let i = 1; i < samples.length; i++) {
      const dd = samples[i].distM - samples[i - 1].distM;
      if (!(dd > 0)) continue;
      slopeSum += Math.abs(samples[i].elev - samples[i - 1].elev) / dd;
      slopeN++;
    }
    const meanSlope = slopeN ? slopeSum / slopeN : 0;
    const slopeTerm = (DEM_POSTING_M / 2) * meanSlope;
    const absM = Math.sqrt(DEM_VERTICAL_RMSE_M * DEM_VERTICAL_RMSE_M + slopeTerm * slopeTerm);
    const amplitude = Math.max(1, stats.max - stats.min);
    const pct = Math.min(100, (absM / amplitude) * 100);
    return { absM, pct, meanSlope };
  }

  function computeElevationStats(samples) {
    let min = Infinity, max = -Infinity, ascent = 0, descent = 0;
    for (let i = 0; i < samples.length; i++) {
      if (samples[i].elev < min) min = samples[i].elev;
      if (samples[i].elev > max) max = samples[i].elev;
      if (i > 0) {
        const d = samples[i].elev - samples[i - 1].elev;
        if (d > 0) ascent += d; else descent += -d;
      }
    }
    return { min, max, ascent, descent };
  }

  /* ═══ 12quater. PANEL CONTENT — COORDINATE GRID ════════════════════════════ */

  function attachGridEvents(root) {
    const onCb = root.querySelector('#gr-on');
    const crsSel = root.querySelector('#gr-crs');
    const spacingSel = root.querySelector('#gr-spacing');
    const labelsCb = root.querySelector('#gr-labels');
    const fields = root.querySelector('#gr-fields');

    function refreshSpacingOptions() {
      // Hide options that don't match the chosen CRS.
      Array.from(spacingSel.options).forEach(opt => {
        if (opt.dataset.crs && opt.dataset.crs !== crsSel.value) opt.style.display = 'none';
        else opt.style.display = '';
      });
      // Reset to auto when switching CRS to avoid mismatched units.
      const cur = spacingSel.options[spacingSel.selectedIndex];
      if (cur.dataset.crs && cur.dataset.crs !== crsSel.value) spacingSel.value = '0';
    }
    refreshSpacingOptions();

    function syncFromUI() {
      gridState.enabled = onCb.checked;
      gridState.crs = crsSel.value;
      gridState.spacing = parseFloat(spacingSel.value);
      gridState.showLabels = labelsCb.checked;
      fields.style.opacity = gridState.enabled ? '' : '0.5';
      crsSel.disabled = !gridState.enabled;
      spacingSel.disabled = !gridState.enabled;
      labelsCb.disabled = !gridState.enabled;
      updateGrid();
      saveState();
    }

    onCb.addEventListener('change', syncFromUI);
    crsSel.addEventListener('change', () => { refreshSpacingOptions(); syncFromUI(); });
    spacingSel.addEventListener('change', syncFromUI);
    labelsCb.addEventListener('change', syncFromUI);
  }

  function gridStackBeforeId() {
    for (const id of ['app-derived-fill', 'app-contours-line', 'td-point', 'td-linestring', 'td-polygon', 'td-polygon-outline']) {
      if (map.getLayer(id)) return id;
    }
    if (map.getLayer('app-selection-fill')) return 'app-selection-fill';
    if (map.getLayer('app-label')) return 'app-label';
    return undefined;
  }

  function raiseGridLayers() {
    if (!map.isStyleLoaded()) return;
    const beforeId = gridStackBeforeId();
    try {
      if (map.getLayer('app-grid-lines')) {
        if (beforeId) map.moveLayer('app-grid-lines', beforeId);
        else map.moveLayer('app-grid-lines');
      }
      if (map.getLayer('app-grid-text')) {
        if (beforeId) map.moveLayer('app-grid-text', beforeId);
        else map.moveLayer('app-grid-text');
      }
    } catch (_) {}
  }

  function updateGrid() {
    if (!map.isStyleLoaded()) return;
    const SRC = 'app-grid', SRC_LBL = 'app-grid-labels';
    if (!map.getSource(SRC)) {
      map.addSource(SRC, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addSource(SRC_LBL, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      const beforeId = gridStackBeforeId();
      map.addLayer({
        id: 'app-grid-lines', type: 'line', source: SRC,
        paint: {
          'line-color': '#aab4c2',
          'line-width': 0.6,
          'line-opacity': 0.45,
          'line-dasharray': [2, 3],
        },
      }, beforeId);
      map.addLayer({
        id: 'app-grid-text', type: 'symbol', source: SRC_LBL,
        layout: {
          'text-field': ['get', 'label'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 8, 9, 12, 10, 16, 12, 20, 14],
          'text-allow-overlap': true,
          'text-ignore-placement': true,
          'text-optional': false,
          'text-anchor': ['coalesce', ['get', 'anchor'], 'bottom-left'],
          'text-offset': [0.1, 0.05],
        },
        paint: {
          'text-color': '#aab4c2',
          'text-halo-color': '#0b0f14',
          'text-halo-width': 1.4,
        },
      }, beforeId);
    }
    const linesSrc = map.getSource(SRC);
    const lblSrc = map.getSource(SRC_LBL);
    if (!gridState.enabled) {
      linesSrc.setData({ type: 'FeatureCollection', features: [] });
      lblSrc.setData({ type: 'FeatureCollection', features: [] });
      return;
    }
    try {
      const { lines, labels } = buildGrid();
      linesSrc.setData({ type: 'FeatureCollection', features: lines });
      lblSrc.setData({ type: 'FeatureCollection', features: gridState.showLabels ? labels : [] });
      raiseGridLayers();
    } catch (err) {
      log.warn('[HydraulicGIS] updateGrid failed:', err);
    }
  }

  function buildGrid() {
    const b = map.getBounds();
    const minLng = b.getWest(), maxLng = b.getEast();
    const minLat = b.getSouth(), maxLat = b.getNorth();
    const lines = [], labels = [];
    const canvas = map.getCanvas();
    const viewW = canvas.clientWidth;
    const viewH = canvas.clientHeight;
    const southMargin = 14;
    const westMargin = 10;

    function labelOnSouthEdge(lng, latHint) {
      const px = map.project([lng, latHint != null ? latHint : (minLat + maxLat) / 2]);
      const ll = map.unproject([
        Math.max(0, Math.min(viewW, px.x)),
        Math.max(0, viewH - southMargin),
      ]);
      return [lng, ll.lat];
    }

    function labelOnWestEdge(lngHint, lat) {
      const px = map.project([lngHint != null ? lngHint : (minLng + maxLng) / 2, lat]);
      const ll = map.unproject([
        Math.max(0, westMargin),
        Math.max(0, Math.min(viewH, px.y)),
      ]);
      return [ll.lng, lat];
    }

    function labelOnSouthFromSeg(seg) {
      let best = seg[0];
      let bestY = -Infinity;
      for (const c of seg) {
        const p = map.project(c);
        if (p.x < -40 || p.x > viewW + 40) continue;
        if (p.y > bestY) { bestY = p.y; best = c; }
      }
      const px = map.project(best);
      const ll = map.unproject([Math.max(0, Math.min(viewW, px.x)), Math.max(0, viewH - southMargin)]);
      return [ll.lng, ll.lat];
    }

    function labelOnWestFromSeg(seg) {
      let best = seg[0];
      let bestX = Infinity;
      for (const c of seg) {
        const p = map.project(c);
        if (p.y < -40 || p.y > viewH + 40) continue;
        if (p.x < bestX) { bestX = p.x; best = c; }
      }
      const px = map.project(best);
      const ll = map.unproject([Math.max(0, westMargin), Math.max(0, Math.min(viewH, px.y))]);
      return [ll.lng, ll.lat];
    }

    if (gridState.crs === 'wgs84') {
      // Spacing in degrees
      let dx = gridState.spacing;
      if (!dx) {
        const span = Math.max(maxLng - minLng, maxLat - minLat);
        if (span > 20) dx = 5;
        else if (span > 8) dx = 1;
        else if (span > 3) dx = 0.5;
        else if (span > 1) dx = 0.1;
        else if (span > 0.3) dx = 0.05;
        else if (span > 0.1) dx = 0.01;
        else dx = 0.001;
      }
      const x0 = Math.floor(minLng / dx) * dx;
      const y0 = Math.floor(minLat / dx) * dx;
      const x1 = Math.ceil(maxLng / dx) * dx;
      const y1 = Math.ceil(maxLat / dx) * dx;
      // Vertical lines (constant lng)
      for (let x = x0; x <= x1 + 1e-9; x += dx) {
        const xc = +x.toFixed(8);
        lines.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[xc, minLat], [xc, maxLat]] } });
        labels.push({
          type: 'Feature',
          properties: { label: gridLabelDeg(xc, 'lon'), anchor: 'top' },
          geometry: { type: 'Point', coordinates: labelOnSouthEdge(xc, minLat) },
        });
      }
      // Horizontal lines (constant lat)
      for (let y = y0; y <= y1 + 1e-9; y += dx) {
        const yc = +y.toFixed(8);
        lines.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[minLng, yc], [maxLng, yc]] } });
        labels.push({
          type: 'Feature',
          properties: { label: gridLabelDeg(yc, 'lat'), anchor: 'left' },
          geometry: { type: 'Point', coordinates: labelOnWestEdge(minLng, yc) },
        });
      }
    } else {
      // Lambert grid: convert visible bbox corners to Lambert, find rounded grid lines, convert back.
      const corners = [
        reproject([minLng, minLat], 'wgs84', 'lambert-maroc-1'),
        reproject([maxLng, minLat], 'wgs84', 'lambert-maroc-1'),
        reproject([maxLng, maxLat], 'wgs84', 'lambert-maroc-1'),
        reproject([minLng, maxLat], 'wgs84', 'lambert-maroc-1'),
      ];
      const xs = corners.map(c => c[0]), ys = corners.map(c => c[1]);
      const xMin = Math.min(...xs), xMax = Math.max(...xs);
      const yMin = Math.min(...ys), yMax = Math.max(...ys);
      let dx = gridState.spacing;
      if (!dx) {
        const span = Math.max(xMax - xMin, yMax - yMin);
        if (span > 200000) dx = 50000;
        else if (span > 50000) dx = 10000;
        else if (span > 10000) dx = 5000;
        else if (span > 3000) dx = 1000;
        else if (span > 1000) dx = 500;
        else if (span > 300) dx = 100;
        else if (span > 100) dx = 50;
        else dx = 10;
      }
      const x0 = Math.floor(xMin / dx) * dx;
      const y0 = Math.floor(yMin / dx) * dx;
      const x1 = Math.ceil(xMax / dx) * dx;
      const y1 = Math.ceil(yMax / dx) * dx;
      // Sample each grid line as 16 points across the bbox in Lambert space, then convert back to WGS84.
      const N = 16;
      for (let x = x0; x <= x1 + 1; x += dx) {
        const seg = [];
        for (let k = 0; k <= N; k++) {
          const yk = yMin + (yMax - yMin) * (k / N);
          const wgs = reproject([x, yk], 'lambert-maroc-1', 'wgs84');
          seg.push(wgs);
        }
        lines.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: seg } });
        labels.push({
          type: 'Feature',
          properties: { label: 'X ' + gridLabelMeters(x), anchor: 'top' },
          geometry: { type: 'Point', coordinates: labelOnSouthFromSeg(seg) },
        });
      }
      for (let y = y0; y <= y1 + 1; y += dx) {
        const seg = [];
        for (let k = 0; k <= N; k++) {
          const xk = xMin + (xMax - xMin) * (k / N);
          const wgs = reproject([xk, y], 'lambert-maroc-1', 'wgs84');
          seg.push(wgs);
        }
        lines.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: seg } });
        labels.push({
          type: 'Feature',
          properties: { label: 'Y ' + gridLabelMeters(y), anchor: 'left' },
          geometry: { type: 'Point', coordinates: labelOnWestFromSeg(seg) },
        });
      }
    }
    return { lines, labels };
  }

  function gridLabelDeg(v, axis) {
    const abs = Math.abs(v);
    const hemi = axis === 'lat' ? (v >= 0 ? 'N' : 'S') : (v >= 0 ? 'E' : 'W');
    if (abs >= 1) return `${v.toFixed(abs >= 10 ? 1 : 2)}° ${hemi}`;
    // Sub-degree: show as min/sec for readability
    const deg = Math.floor(abs);
    const min = (abs - deg) * 60;
    if (min >= 1) return `${deg}°${min.toFixed(0)}' ${hemi}`;
    const sec = min * 60;
    return `${deg}°${Math.floor(min)}'${sec.toFixed(0)}" ${hemi}`;
  }
  function gridLabelMeters(v) {
    if (Math.abs(v) >= 1000) return (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + ' km';
    return v.toFixed(0) + ' m';
  }


  document.getElementById('file-input').addEventListener('change', async (e) => {
    const status = document.getElementById('files-status');
    if (!e.target.files.length) return;
    let total = 0; let err = null;
    for (const file of Array.from(e.target.files)) {
      try {
        const imported = await importFile(file);
        for (const f of imported) {
          state.features.push(f);
          // Lines and polygons are rendered by terra-draw, not by an app
          // layer: without this the import listed correctly in Calques but
          // drew nothing until the page was reloaded.
          pushFeatureToTerraDraw(f);
        }
        total += imported.length;
      } catch (er) { err = er.message; }
    }
    notifyFeatures();
    try { syncDerivedLayer(); } catch (_) {}
    e.target.value = '';
    if (status) {
      status.className = err ? 'notice notice-error' : 'notice notice-success';
      status.textContent = err || `${total} objet${total > 1 ? 's' : ''} importé${total > 1 ? 's' : ''}.`;
      setTimeout(() => { status.textContent = ''; status.className = ''; }, 4000);

  async function importFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    const text = await file.text();
    if (ext === 'geojson' || ext === 'json') return parseGeoJSON(text);
    if (ext === 'csv') return parseCSV(text);
    throw new Error(`Format non supporté : .${ext}`);
  }

  function parseGeoJSON(text) {
    const data = JSON.parse(text);
    const features = data.type === 'FeatureCollection' ? data.features
                  : data.type === 'Feature' ? [data] : [];
    const out = [];
    for (const f of features) {
      if (!f.geometry) continue;
      const props = f.properties || {};
      const kind = props.kind || kindFromGeom(f.geometry);
      const geo = { type: 'Feature', geometry: f.geometry, properties: {} };
      out.push({
        id: props.id || newId('f'),
        name: props.name || `Importé ${out.length + 1}`,
        kind,
        geojson: geo,
        style: { ...DEFAULT_STYLE, ...(props.style || {}) },
        metrics: computeMetrics(geo, kind),
        createdAt: props.createdAt || Date.now(),
        updatedAt: Date.now(),
      });
    }
    return out;
  }

  function splitCsv(line) {
    const out = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur); return out;
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    const header = splitCsv(lines[0]).map(h => h.toLowerCase().trim());
    const lonI = header.findIndex(h => /^(lon|longitude|x)$/.test(h));
    const latI = header.findIndex(h => /^(lat|latitude|y)$/.test(h));
    const nameI = header.findIndex(h => /^(name|nom)$/.test(h));
    if (lonI < 0 || latI < 0) throw new Error("Le CSV doit contenir des colonnes 'longitude' et 'latitude'.");
    const out = [];
    for (let i = 1; i < lines.length; i++) {
      const row = splitCsv(lines[i]);
      const lon = parseFloat(row[lonI]), lat = parseFloat(row[latI]);
      if (isNaN(lon) || isNaN(lat)) continue;
      const name = nameI >= 0 ? row[nameI] : `Point ${i}`;
      const geo = { type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] }, properties: {} };
      out.push({
        id: newId('f'), name, kind: 'point',
        geojson: geo, style: { ...DEFAULT_STYLE }, metrics: {},
        createdAt: Date.now(), updatedAt: Date.now(),
      });
    }
    return out;
  }

  function doExport(format) {
    // Export all features whose visibility (eye icon) is currently ON.
    // The user explicitly asked for this — they want to control export
    // contents from the Calques panel by toggling visibility, not by
    // selecting layers. Hidden features are omitted.
    const features = state.features.filter(f => f.style && f.style.visible);
    if (features.length === 0) {
      log.warn('[HydraulicGIS] export: no visible features');
      return;
    }
    log.info('[HydraulicGIS] exporting', features.length, 'visible feature(s) as', format);
    const fc = {
      type: 'FeatureCollection',
      features: features.map(f => ({
        type: 'Feature',
        geometry: f.geojson.geometry,
        properties: {
          id: f.id, name: f.name, kind: f.kind,
          style: f.style, metrics: f.metrics,
          createdAt: f.createdAt, updatedAt: f.updatedAt,
        },
      })),
    };
    if (format === 'geojson') {
      saveAs(new Blob([JSON.stringify(fc, null, 2)], { type: 'application/geo+json' }), 'projet.geojson');
    } else if (format === 'kml') {
      const kml = featuresToKML(fc);
      saveAs(new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' }), 'projet.kml');
    } else if (format === 'csv') {
      const rows = ['id,name,kind,vertex,latitude,longitude,x_lambert,y_lambert'];
      for (const f of features) {
        const verts = featureVertices(f);
        verts.forEach((c, i) => {
          let xL = '', yL = '';
          try {
            const [x, y] = reproject([c[0], c[1]], 'wgs84', 'lambert-maroc-1');
            xL = x.toFixed(3);
            yL = y.toFixed(3);
          } catch (_) {}
          rows.push([
            escapeCsv(f.id),
            escapeCsv(f.name),
            f.kind,
            i + 1,
            c[1].toFixed(8),
            c[0].toFixed(8),
            xL,
            yL,
          ].join(','));
        });
      }
      saveAs(new Blob([rows.join('\n')], { type: 'text/csv' }), 'projet.csv');
    } else if (format === 'txt') {
      const lines = [`Atlas GIS — Export ${new Date().toISOString()}`, `Objets : ${features.length}`, '─'.repeat(60)];
      for (const f of features) {
        lines.push(`[${f.kind}] ${f.name}`);
        if (f.metrics.lengthMeters !== undefined) lines.push(`  Longueur : ${formatDistance(f.metrics.lengthMeters)}`);
        if (f.metrics.areaSquareMeters !== undefined) lines.push(`  Surface  : ${formatArea(f.metrics.areaSquareMeters)}`);
        const verts = featureVertices(f);
        if (verts.length) {
          lines.push(`  Sommets (${verts.length}) — lat, lon | X, Y Lambert :`);
          verts.forEach((c, i) => {
            let lambert = '';
            try {
              const [x, y] = reproject([c[0], c[1]], 'wgs84', 'lambert-maroc-1');
              lambert = ` | ${formatProjected(x, 3)} ; ${formatProjected(y, 3)}`;
            } catch (_) {}
            lines.push(`    ${String(i + 1).padStart(3, ' ')}. ${formatWgsPairDisplay(c[0], c[1], 8)}${lambert}`);
          });
        }
        lines.push('');
      }
      saveAs(new Blob([lines.join('\n')], { type: 'text/plain' }), 'projet.txt');
    }
  }

  function featuresToKML(fc) {
    // Minimal but standards-compliant GeoJSON → KML serializer.
    // Handles Point, LineString and Polygon. Names + descriptions are taken
    // from feature.properties.name / .description if present.
    const xml = ['<?xml version="1.0" encoding="UTF-8"?>'];
    xml.push('<kml xmlns="http://www.opengis.net/kml/2.2">');
    xml.push('<Document>');
    xml.push('<name>Atlas GIS export</name>');
    for (const feat of (fc.features || [])) {
      const props = feat.properties || {};
      const name = props.name ? `<name>${escXml(props.name)}</name>` : '';
      const desc = props.description ? `<description>${escXml(props.description)}</description>` : '';
      const geom = feat.geometry;
      if (!geom) continue;
      let body = '';
      if (geom.type === 'Point') {
        body = `<Point><coordinates>${coordPair(geom.coordinates)}</coordinates></Point>`;
      } else if (geom.type === 'LineString') {
        body = `<LineString><coordinates>${geom.coordinates.map(coordPair).join(' ')}</coordinates></LineString>`;
      } else if (geom.type === 'Polygon') {
        const rings = geom.coordinates.map((ring, i) => {
          const tag = i === 0 ? 'outerBoundaryIs' : 'innerBoundaryIs';
          return `<${tag}><LinearRing><coordinates>${ring.map(coordPair).join(' ')}</coordinates></LinearRing></${tag}>`;
        }).join('');
        body = `<Polygon>${rings}</Polygon>`;
      } else {
        continue; // Skip unsupported geometry types
      }
      xml.push(`<Placemark>${name}${desc}${body}</Placemark>`);
    }
    xml.push('</Document></kml>');
    return xml.join('\n');
  }
  function coordPair(c) {
    // KML expects lon,lat[,alt] — same order as GeoJSON.
    return c.length >= 3 ? `${c[0]},${c[1]},${c[2]}` : `${c[0]},${c[1]},0`;
  }
  function escXml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  function pointCoord(f) {
    const g = f.geojson.geometry;
    if (g.type === 'Point') return g.coordinates;
    if (g.type === 'LineString' && g.coordinates.length) return g.coordinates[0];
    if (g.type === 'Polygon' && g.coordinates[0]?.length) {
      const ring = g.coordinates[0];
      let x = 0, y = 0;
      for (const c of ring) { x += c[0]; y += c[1]; }
      return [x / ring.length, y / ring.length];
    }
    return null;
  }

  /** All vertices of a feature as [lng, lat] (polygon closing point skipped). */
  function featureVertices(f) {
    const g = f && f.geojson && f.geojson.geometry;
    if (!g) return [];
    if (g.type === 'Point') return [g.coordinates.slice()];
    if (g.type === 'LineString') {
      return (g.coordinates || []).map(c => c.slice());
    }
    if (g.type === 'MultiLineString') {
      const out = [];
      for (const line of (g.coordinates || [])) {
        for (const c of line) out.push(c.slice());
      }
      return out;
    }
    if (g.type === 'Polygon') {
      const ring = (g.coordinates && g.coordinates[0]) || [];
      if (ring.length < 2) return ring.map(c => c.slice());
      // Skip duplicate closing coordinate.
      const last = ring[ring.length - 1];
      const first = ring[0];
      const closed = first && last && first[0] === last[0] && first[1] === last[1];
      return (closed ? ring.slice(0, -1) : ring).map(c => c.slice());
    }
    if (g.type === 'MultiPolygon') {
      const out = [];
      for (const poly of (g.coordinates || [])) {
        const ring = poly[0] || [];
        if (ring.length < 2) {
          ring.forEach(c => out.push(c.slice()));
          continue;
        }
        const last = ring[ring.length - 1];
        const first = ring[0];
        const closed = first && last && first[0] === last[0] && first[1] === last[1];
        (closed ? ring.slice(0, -1) : ring).forEach(c => out.push(c.slice()));
      }
      return out;
    }
    return [];
  }

  function escapeCsv(s) {
    if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
    return s;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ═══ Route A → B (OSRM) ═══════════════════════════════════════════════════ */
  let _routePick = null;
  function cancelRoutePickMode() {
    if (!_routePick) return;
    try { _routePick.abort({ silent: true }); } catch (_) {}
    _routePick = null;
  }
  function _makeRoutePickMarker(letter, isB) {
    const el = document.createElement('div');
    el.className = 'route-pick-marker' + (isB ? ' b' : '');
    el.textContent = letter;
    return new maplibregl.Marker({ element: el, anchor: 'center' });
  }
  function _applyRouteMsg(el, text, kind) {
    if (!el) return;
    el.textContent = text || '';
    el.style.color = kind === 'err' ? 'var(--danger)' : kind === 'ok' ? 'var(--success)' : 'var(--ink-1)';
  }
  function startRoutePick(msgEl, btn) {
    if (_routePick) {
      try { _routePick.abort({ silent: true }); } catch (_) {}
      _routePick = null;
    }
    _routeLastMsg = null;
    const setMsg = (s, kind) => {
      _routeLastMsg = s ? { text: s, kind: kind || '' } : null;
      _applyRouteMsg(msgEl, s, kind);
    };
    if (btn) btn.disabled = true;

    // Free the map: hide tools sheet + collapse draw drawer (same pattern as coord pick).
    const wasMobileSheetOpen = ui.isMobile()
      && document.getElementById('sheet')?.classList.contains('visible');
    if (wasMobileSheetOpen) {
      document.getElementById('scrim')?.classList.remove('visible');
      document.getElementById('sheet')?.classList.remove('visible');
    }
    try {
      const drawer = document.getElementById('draw-drawer');
      const drawToggle = document.getElementById('draw-toggle-btn');
      if (drawer) drawer.classList.add('collapsed');
      if (drawToggle) drawToggle.classList.remove('active');
    } catch (_) {}

    const banner = ensurePickBanner();
    banner.textContent = t('route_banner_a');
    banner.classList.add('visible');

    let pointA = null;
    let markerA = null;
    let markerB = null;
    const canvas = map.getCanvas();
    canvas.style.cursor = 'crosshair';
    let prevMode = null;
    try {
      const td = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
      if (td) { prevMode = td.getMode(); td.setMode('static'); }
    } catch (_) {}

    const clearMarkers = () => {
      try { if (markerA) markerA.remove(); } catch (_) {}
      try { if (markerB) markerB.remove(); } catch (_) {}
      markerA = markerB = null;
    };
    const restoreMode = () => {
      try {
        const td = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
        if (td && prevMode && prevMode !== 'static') td.setMode(prevMode);
      } catch (_) {}
    };
    const reopenSheet = () => {
      if (wasMobileSheetOpen) {
        try { ui.openSheet('tools'); } catch (_) {}
      }
      // Re-apply status into the freshly rendered tools panel.
      setTimeout(() => {
        if (!_routeLastMsg) return;
        _applyRouteMsg(document.getElementById('rt-msg'), _routeLastMsg.text, _routeLastMsg.kind);
      }, 80);
    };
    let finished = false;
    const cleanupUi = () => {
      if (finished) return;
      finished = true;
      canvas.style.cursor = '';
      banner.classList.remove('visible');
      banner.onclick = null;
      map.off('click', onClick);
      restoreMode();
      if (btn) btn.disabled = false;
      _routePick = null;
    };
    const abort = (opts) => {
      cleanupUi();
      clearMarkers();
      _routeLastMsg = null;
      if (!(opts && opts.silent)) reopenSheet();
    };
    _routePick = { abort };

    banner.onclick = () => abort();

    async function onClick(e) {
      const { lng, lat } = e.lngLat;
      if (!pointA) {
        pointA = [lng, lat];
        try {
          markerA = _makeRoutePickMarker('A', false).setLngLat([lng, lat]).addTo(map);
        } catch (_) {}
        banner.textContent = t('route_banner_b');
        setMsg(t('route_pick_b'));
        return;
      }
      try {
        markerB = _makeRoutePickMarker('B', true).setLngLat([lng, lat]).addTo(map);
      } catch (_) {}
      map.off('click', onClick);
      canvas.style.cursor = '';
      banner.textContent = t('route_computing');
      setMsg(t('route_computing'));
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${pointA[0]},${pointA[1]};${lng},${lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const route = data && data.routes && data.routes[0];
        if (!route || !route.geometry) throw new Error('no route');
        const km = (route.distance || 0) / 1000;
        const newF = addFeature(
          { type: 'Feature', geometry: route.geometry, properties: { _derived: true, _derivedKind: 'route' } },
          'line',
          { name: `Route (${km.toFixed(1)} km)`, style: { stroke: '#3aa0ff', strokeWidth: 3.5, fill: '#3aa0ff', fillOpacity: 0 } }
        );
        pushFeatureToTerraDraw(newF);
        notifyFeatures();
        setMsg(t('route_ok') + ` · ${km.toFixed(1)} km`, 'ok');
        try {
          const bb = turf.bbox(route.geometry);
          map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: 60, duration: 600 });
        } catch (_) {}
        setTimeout(clearMarkers, 4000);
        cleanupUi();
        reopenSheet();
      } catch (err) {
        log.warn('[route]', err);
        clearMarkers();
        setMsg(t('route_err'), 'err');
        cleanupUi();
        reopenSheet();
      }
    }
    map.on('click', onClick);
    setMsg(t('route_pick_a'));
  }

  // Wire options UI once the draw toolbar (and #app-options) exist.
  setTimeout(initAppOptionsUi, 600);
  setTimeout(initAppOptionsUi, 1600);

  /* ═══ 13. SHEET SWIPE-DOWN ══════════════════════════════════════════════════ */
  (function () {
    const handle = document.getElementById('sheet-handle');
    const sheet = document.getElementById('sheet');
    let startY = 0, dy = 0, tracking = false;

    handle.addEventListener('touchstart', (e) => {
      tracking = true;
      startY = e.touches[0].clientY;
      sheet.style.transition = 'none';
    }, { passive: true });

    handle.addEventListener('touchmove', (e) => {
      if (!tracking) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      sheet.style.transform = `translateY(${dy}px)`;
    }, { passive: true });

    handle.addEventListener('touchend', () => {
      if (!tracking) return;
      tracking = false;
      sheet.style.transition = '';
      sheet.style.transform = '';
      if (dy > 60) ui.closeSheet();
      dy = 0;
    });
  })();

  /* ═══ 13b. FLOATING MENU BUTTON ═════════════════════════════════════════════
     The menu button is draggable so it never sits on top of whatever the user
     is working on. Its position is remembered; a press that doesn't move opens
     the menu as before. */
  (function makeFabDraggable() {
    const fab = document.getElementById('fab');
    if (!fab) return;
    const KEY = 'hydraulic-gis:fab-pos:v1';
    const MARGIN = 8;
    const DRAG_SLOP = 6;
    let pointerId = null, grabX = 0, grabY = 0, moved = false;

    const place = (left, top) => {
      const w = fab.offsetWidth || 56;
      const h = fab.offsetHeight || 56;
      const maxL = Math.max(MARGIN, window.innerWidth - w - MARGIN);
      const maxT = Math.max(MARGIN, window.innerHeight - h - MARGIN);
      const l = Math.min(Math.max(left, MARGIN), maxL);
      const t = Math.min(Math.max(top, MARGIN), maxT);
      fab.style.left = l + 'px';
      fab.style.top = t + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
      return { left: l, top: t };
    };

    const restore = () => {
      // offsetWidth is 0 while the button is hidden (desktop): leave the CSS
      // default in place, we re-run this when the viewport grows a button.
      if (!fab.offsetWidth) return;
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (saved && isFinite(saved.left) && isFinite(saved.top)) place(saved.left, saved.top);
      } catch (_) {}
    };

    fab.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      pointerId = e.pointerId;
      moved = false;
      const r = fab.getBoundingClientRect();
      grabX = e.clientX - r.left;
      grabY = e.clientY - r.top;
      try { fab.setPointerCapture(pointerId); } catch (_) {}
    });

    fab.addEventListener('pointermove', (e) => {
      if (pointerId === null || e.pointerId !== pointerId) return;
      const r = fab.getBoundingClientRect();
      if (!moved
          && Math.abs(e.clientX - r.left - grabX) < DRAG_SLOP
          && Math.abs(e.clientY - r.top - grabY) < DRAG_SLOP) return;
      moved = true;
      fab.classList.add('is-dragging');
      place(e.clientX - grabX, e.clientY - grabY);
      e.preventDefault();
    });

    const release = (e) => {
      if (pointerId === null || (e && e.pointerId !== undefined && e.pointerId !== pointerId)) return;
      try { fab.releasePointerCapture(pointerId); } catch (_) {}
      pointerId = null;
      fab.classList.remove('is-dragging');
      if (moved) {
        const r = fab.getBoundingClientRect();
        try { localStorage.setItem(KEY, JSON.stringify({ left: r.left, top: r.top })); } catch (_) {}
      }
    };
    fab.addEventListener('pointerup', release);
    fab.addEventListener('pointercancel', release);

    // A drag must not also open the menu.
    fab.addEventListener('click', (e) => {
      if (moved) { moved = false; e.preventDefault(); e.stopPropagation(); return; }
      ui.openMenu();
    });

    // Keep the button reachable when the viewport changes (rotation, keyboard).
    const reclamp = () => {
      if (!fab.offsetWidth) return;
      if (fab.style.left) place(parseFloat(fab.style.left), parseFloat(fab.style.top));
      else restore();
    };
    window.addEventListener('resize', reclamp);
    window.addEventListener('orientationchange', reclamp);
    restore();
  })();

  /* ═══ 14. EVENT LISTENERS ═══════════════════════════════════════════════════ */
  document.querySelectorAll('.rail-btn').forEach(btn => {
    btn.addEventListener('click', () => ui.setPanel(btn.dataset.panel));
  });
  // ═══ View controls — north arrow + zoom-to-features ═══════════════════════
  (function installNorthArrow() {
    const btn = document.getElementById('vc-north-arrow');
    if (!btn) return;
    const needle = btn.querySelector('.north-needle');
    const syncNeedle = () => {
      if (!needle) return;
      const bearing = map.getBearing();
      needle.style.transform = `rotate(${-bearing}deg)`;
    };
    map.on('rotate', syncNeedle);
    map.on('pitch', syncNeedle);
    map.on('move', syncNeedle);
    syncNeedle();
    btn.addEventListener('click', () => {
      map.easeTo({ bearing: 0, pitch: 0, duration: 400 });
    });
  })();

  // "Zoom étendu" (Zoom Extents): center the map on the bounding box of
  // all current features, like the AutoCAD command. Useful after the user
  // has drawn a few objects and panned away. Falls back to the default
  // Morocco view if there are no features.
  document.getElementById('vc-zoom-extents')?.addEventListener('click', () => {
    try {
      const visible = state.features.filter(f => f.style && f.style.visible);
      const list = visible.length > 0 ? visible : state.features;
      if (list.length === 0) {
        map.flyTo({ center: [-5.0, 33.5], zoom: 5, essential: true });
        return;
      }
      const fc = { type: 'FeatureCollection', features: list.map(f => f.geojson) };
      const [minX, minY, maxX, maxY] = turf.bbox(fc);
      // Guard against degenerate bbox (single point feature). In that
      // case, just fly to it at a reasonable zoom.
      if (minX === maxX && minY === maxY) {
        map.flyTo({ center: [minX, minY], zoom: 16, essential: true });
        return;
      }
      map.fitBounds([[minX, minY], [maxX, maxY]], {
        padding: { top: 60, bottom: 60, left: 60, right: 60 },
        maxZoom: 18,
        duration: 600,
      });
    } catch (err) {
      log.warn('[HydraulicGIS] zoom-extents failed:', err);
    }
  });

  // Close sheet on resize across breakpoint
  window.addEventListener('resize', () => ui.render());

  // ═══ Keyboard shortcuts ════════════════════════════════════════════════════
  window.addEventListener('keydown', (e) => {
    // Don't intercept while typing in inputs
    const tag = e.target?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    if (e.key === 'Escape') {
      // Close any open panel / sheet / confirm modal
      if (document.getElementById('confirm-bg').classList.contains('visible')) {
        ui.closeConfirm();
      } else if (state.activePanel) {
        if (ui.isMobile()) ui.closeSheet();
        else ui.setPanel(null);
      }
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      // In geometry edit mode, let terra-draw delete the selected vertex.
      if (isEditModeActive()) return;
      if (state.selectedIds.length > 0) {
        e.preventDefault();
        const n = state.selectedIds.length;
        ui.confirm('Supprimer ?', `Supprimer ${n} objet${n > 1 ? 's' : ''} ?`, () => {
          state.selectedIds.forEach(id => removeFeature(id));
        });
      }
    }
  });

  /* ═══ 15. INIT ══════════════════════════════════════════════════════════════ */
  initBasemapUi();
  ui.render();
  </script>
</body>
</html>
