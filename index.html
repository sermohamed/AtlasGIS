  <script>
  /* ════════════════════════════════════════════════════════════════════════════
     HYDRAULIC GIS — Application monofichier
     Version: 2026-07-03-v12
     Stack : MapLibre GL 5 · terra-draw · proj4 · Turf · file-saver

     ARCHITECTURE NOTE: terra-draw is the SOLE renderer of drawn features.
     We don't maintain duplicate `app-poly-fill` / `app-line` / `app-point`
     layers anymore — they were causing visibility bugs on mobile and a
     complex filter/double-render dance. Our store is kept in sync with
     terra-draw via events, used for the Calques panel, exports, metrics,
     and labels.
     ════════════════════════════════════════════════════════════════════════════ */

  /* SAFE LOGGER
     Some corporate environments (antivirus, browser extensions) replace
     window.console with a partial implementation that lacks .info or .warn.
     Calling a missing method throws, killing the surrounding function. We
     wrap every method call so logging is best-effort and never throws. */
  const log = (function () {
    function safe(method) {
      return function () {
        try {
          if (window.console && typeof window.console[method] === 'function') {
            window.console[method].apply(window.console, arguments);
          } else if (window.console && typeof window.console.log === 'function') {
            window.console.log.apply(window.console, arguments);
          }
        } catch (_) { /* ignore */ }
      };
    }
    return { info: safe('info'), warn: safe('warn'), error: safe('error'), log: safe('log') };
  })();

  log.info('%c[AtlasGIS] v12 — 2026-07-03', 'color:#3aa0ff;font-weight:bold;font-size:12px');

  /* ─── iOS Safari pinch-zoom prevention ─────────────────────────────────
     Apple ignores `user-scalable=no` in viewport meta since iOS 10. A user
     who pinches anywhere on the page will zoom the entire UI, scrolling
     the toolbar/buttons off-screen. The map element has `touch-action:none`
     so MapLibre catches its own pinches, but the chrome around it (sidebar,
     buttons, panels) is still vulnerable.
     We block iOS-specific gesture* events at document level. These events
     only exist on Safari/WebKit — they don't fire on the map canvas because
     touch-action:none stops them — and they don't conflict with normal
     touch handling (taps, scroll, drag), only with the OS-level pinch.
     We also listen for ctrl-wheel (desktop pinch trackpad) just in case.
  ──────────────────────────────────────────────────────────────────────── */
  (function preventUiPinchZoom() {
    // iOS Safari WebKit gesture events
    const blockGesture = (e) => {
      // Allow gestures on the map canvas — MapLibre handles those
      if (e.target && e.target.closest && e.target.closest('#map')) return;
      e.preventDefault();
    };
    document.addEventListener('gesturestart', blockGesture, { passive: false });
    document.addEventListener('gesturechange', blockGesture, { passive: false });
    document.addEventListener('gestureend', blockGesture, { passive: false });
    // Belt-and-braces double-tap-to-zoom prevention on iOS — the meta tag
    // covers most cases, but UI chrome elements with click handlers can
    // still trigger it. We swallow the synthesized 300ms-delayed click
    // by tracking touchend timestamps.
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 350) {
        // Double-tap: prevent zoom but only if NOT on the map or inside a modal
        const target = e.target;
        const inMap = target && target.closest && target.closest('#map');
        const inModal = target && target.closest && (target.closest('#confirm-bg') || target.closest('#prompt-bg'));
        if (!inMap && !inModal) {
          e.preventDefault();
        }
      }
      lastTouchEnd = now;
    }, { passive: false });
    // Reset the OS-level zoom level if a previous pinch slipped through
    // (e.g. user reloaded a tab that had been zoomed). visualViewport.scale
    // > 1 means the page is currently zoomed.
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        // No direct API to reset scale, but the gesturestart blocker should
        // prevent further zooming. We just log if we detect it.
        if (window.visualViewport.scale > 1.05) {
          log.warn('[HydraulicGIS] page zoom detected (scale=' + window.visualViewport.scale + '). Pinch-zoom on UI should be blocked.');
        }
      });
    }
  })();

  /* ═══ 0. EARLY STATE INIT ═══════════════════════════════════════════════════
     These transient state values are referenced by panel render functions.
     We initialize them here at the very top so that even if a later line
     throws, panels can still render without "Cannot access X before
     initialization" errors. Real values are still assigned later — these
     are just safe defaults. */
  var coordHistory = [];
  /** Last WGS84 [lng, lat] from coordinate converter — used by « Aller à ». */
  var lastCoordFlyTarget = null;
  var searchHistory = [];
  var searchMarker = null;
  var flyToMarker = null;
  var elevationCache = new Map();
  var elevationHoverMarker = null;
  var gridState = { enabled: false, crs: 'wgs84', spacing: 0, showLabels: true };
  var labelHandleMarkers = new Map();
  var _routeLastMsg = null; // last route status for tools panel after pick

  // Drop a visible pin at the given lng/lat, replacing any previous fly-to
  // marker. Used by both the Coordinates "Aller à" button and tapping a
  // history item. The marker disappears after 30s so it doesn't clutter
  // the map permanently.
  function placeFlyToMarker(lng, lat) {
    try {
      if (flyToMarker) flyToMarker.remove();
      const dot = document.createElement('div');
      dot.style.cssText = `
        width:20px; height:20px; border-radius:50%;
        background:#3aa0ff; border:3px solid #fff;
        box-shadow:0 0 0 2px rgba(58,160,255,0.4),0 2px 8px rgba(0,0,0,0.5);
        cursor:pointer;
      `;
      flyToMarker = new maplibregl.Marker({ element: dot }).setLngLat([lng, lat]).addTo(map);
      // Auto-clear after 30 seconds.
      setTimeout(() => {
        if (flyToMarker) { flyToMarker.remove(); flyToMarker = null; }
      }, 30000);
    } catch (e) { console.warn('placeFlyToMarker failed:', e); }
  }

  /* ═══ 1. PROJECTIONS (via AtlasCRS) ═════════════════════════════════════════
     All CRS lookups and transforms go through AtlasCRS. Definitions live in
     crs/data/*.json (embedded by tools/embed-crs-data.js). Do not add proj4
     defs or EPSG switches in UI code. */
  if (!window.AtlasCRS || !AtlasCRS.isReady()) {
    try {
      AtlasCRS.bootstrap(window.__ATLAS_CRS_DATA__, window.proj4);
    } catch (err) {
      console.error('[AtlasCRS] bootstrap failed:', err);
    }
  }

  // Preferred country for CRS pickers (persisted lightly on state later).
  let preferredCrsCountry = 'MA';
  try {
    const saved = localStorage.getItem('hydraulic-gis:crs-country:v1');
    if (saved) preferredCrsCountry = saved;
  } catch (_) {}

  /** Rebuild the legacy CRS_LIST / CRS_BY_ID views from the registry. */
  const CRS_LIST = [];
  const CRS_BY_ID = {};
  function rebuildCrsCompat(country) {
    CRS_LIST.length = 0;
    Object.keys(CRS_BY_ID).forEach((k) => { delete CRS_BY_ID[k]; });
    const list = AtlasCRS.listForUi({ country: country || null });
    for (const c of list) {
      CRS_LIST.push(c);
      CRS_BY_ID[c.id] = c;
    }
  }
  rebuildCrsCompat(null);

  function crsOptionsHtml(selectedId, country) {
    const list = country
      ? AtlasCRS.listForUi({ country })
      : CRS_LIST;
    return list.map((c) =>
      `<option value="${c.id}"${c.id === selectedId ? ' selected' : ''}>${c.label}</option>`
    ).join('');
  }

  function countryOptionsHtml(selected) {
    return AtlasCRS.listCountries().map((c) =>
      `<option value="${c.code}"${c.code === selected ? ' selected' : ''}>${c.name}</option>`
    ).join('');
  }

  function crsIsGeographic(crsId) {
    const c = CRS_BY_ID[crsId] || AtlasCRS.getCRS(crsId);
    return !!(c && c.isGeographic);
  }

  function ensureUtmForLngLat(lng, lat) {
    try {
      const utm = AtlasCRS.generateUTM(lat, lng);
      if (utm && !CRS_BY_ID[utm.id]) {
        CRS_LIST.push({
          id: utm.id, epsg: utm.epsg, label: utm.label, name: utm.name,
          isGeographic: false, axes: utm.axes.slice(), unit: utm.unit, axis_order: utm.axis_order,
        });
        CRS_BY_ID[utm.id] = CRS_LIST[CRS_LIST.length - 1];
      }
      return utm;
    } catch (_) {
      return null;
    }
  }

  function copyTextToClipboard(text) {
    const s = String(text);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(s).then(() => true).catch(() => false);
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = s;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return Promise.resolve(ok);
    } catch (_) {
      return Promise.resolve(false);
    }
  }

  function googleMapsUrl(lat, lng) {
    return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  }

  function coordsToWgs84(xy, crsId) {
    if (crsId === 'wgs84') return xy.slice();
    return reproject(xy, crsId, 'wgs84');
  }

  function normCoordNumberString(s) {
    if (s == null) return '';
    return String(s)
      .replace(/[\s\u00A0\u202F\u2007]/g, '')
      .replace(/,/g, '.');
  }

  /** Read two UI fields → [x,y] in CRS convention ([lng,lat] for WGS84, [X,Y] for Lambert). */
  function readCoordPairFromUi(crsId, fieldAVal, fieldBVal) {
    let c = CRS_BY_ID[crsId];
    if (!c) {
      const d = AtlasCRS.getCRS(crsId);
      if (d) c = { id: d.id, isGeographic: d.isGeographic, axes: d.axes };
    }
    if (!c) return null;
    if (c.isGeographic) {
      const lat = parseCoord(fieldAVal);
      const lon = parseCoord(fieldBVal);
      if (lat === null || lon === null) return null;
      const pair = parseWgsInputPair(lat, lon);
      if (!pair) return null;
      return [pair.lng, pair.lat];
    }
    const x = parseFloat(normCoordNumberString(fieldAVal));
    const y = parseFloat(normCoordNumberString(fieldBVal));
    if (isNaN(x) || isNaN(y)) return null;
    return [x, y];
  }

  function formatCoordFieldsForCrs(crsId, xy) {
    let c = CRS_BY_ID[crsId];
    if (!c) {
      const d = AtlasCRS.getCRS(crsId);
      if (d) c = { id: d.id, isGeographic: d.isGeographic, axes: d.axes };
    }
    if (!c || !xy) return { a: '', b: '' };
    if (c.isGeographic) {
      return { a: xy[1].toFixed(8), b: xy[0].toFixed(8) };
    }
    return { a: xy[0].toFixed(3), b: xy[1].toFixed(3) };
  }

  function flyToWgsPoint(lng, lat, nameHint) {
    if (!isFinite(lng) || !isFinite(lat) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
      return false;
    }
    const targetZoom = Math.min(13, map.getMaxZoom());
    map.flyTo({ center: [lng, lat], zoom: targetZoom, essential: true });
    createNavPoint(lng, lat, nameHint || `Point (${formatWgsPairDisplay(lng, lat, 5)})`);
    return true;
  }

  function getFeaturePointCoords(f) {
    const g = f && f.geojson && f.geojson.geometry;
    if (!g || g.type !== 'Point' || !g.coordinates || g.coordinates.length < 2) return null;
    return { lng: g.coordinates[0], lat: g.coordinates[1] };
  }

  function parseWgsInputPair(a, b) {
    if (!isFinite(a) || !isFinite(b)) return null;
    // One value clearly out of latitude range → longitude.
    if (Math.abs(a) > 90 && Math.abs(b) <= 90) return { lng: a, lat: b };
    if (Math.abs(b) > 90 && Math.abs(a) <= 90) return { lng: b, lat: a };
    // Google Maps order: lat, lng (Morocco: lat ~20–36 positive, lng negative).
    if (a > 0 && a <= 90 && b < 0 && b >= -180) return { lat: a, lng: b };
    // Classic GIS order: lon, lat.
    if (a < 0 && b > 0 && b <= 90) return { lng: a, lat: b };
    // Ambiguous decimals — prefer lat, lng (Google Maps convention).
    if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return { lat: a, lng: b };
    return { lng: a, lat: b };
  }

  function formatWgsPairCopy(lng, lat, decimals = 8) {
    return `${lat.toFixed(decimals)}, ${lng.toFixed(decimals)}`;
  }

  function formatWgsPairDisplay(lng, lat, decimals = 6) {
    return `${lat.toFixed(decimals)}, ${lng.toFixed(decimals)}`;
  }

  function formatWgsLabeled(lng, lat, decimals = 6) {
    return `Lat ${lat.toFixed(decimals)}°, Lon ${lng.toFixed(decimals)}°`;
  }

  function formatCoordPairWgs(lng, lat, decimals = 8) {
    return formatWgsPairCopy(lng, lat, decimals);
  }

  // Terra IDs we intentionally removed from terra-draw (points render on
  // app-derived-point). Ignore matching change/delete events so the store
  // row is not wiped right after creation.
  const detachedTerraIds = new Set();

  function detachPointFromTerraDraw(f) {
    if (!f || f.kind !== 'point') return;
    const tid = f.geojson && f.geojson.properties && f.geojson.properties._terraId;
    if (!tid || !drawControl) return;
    // Ban the id first so the change/delete handler cannot match this store
    // row and delete the point we just created. Drop _terraId only once the
    // removal actually succeeded: clearing it up front meant a failed removal
    // left a terra-draw copy that nothing could ever remove again.
    try { detachedTerraIds.add(String(tid)); } catch (_) {}
    let removed = false;
    try {
      const td = drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
      if (td && typeof td.removeFeatures === 'function') {
        td.removeFeatures([tid]);
        removed = true;
      }
    } catch (err) {
      log.warn('[HydraulicGIS] detachPointFromTerraDraw removal failed:', err);
    }
    if (removed) {
      try { delete f.geojson.properties._terraId; } catch (_) {}
    }
    // Keep the ban for a short window in case delete events arrive late.
    setTimeout(() => { try { detachedTerraIds.delete(String(tid)); } catch (_) {} }, 2000);
  }

  function reproject([x, y], from, to) {
    return AtlasCRS.convert([x, y], from, to);
  }

  /* ═══ 2. FORMATTERS ═════════════════════════════════════════════════════════ */
  function formatDecimal(v, d = 6) { return v.toFixed(d) + '°'; }
  function formatDMS(v, axis) {
    const abs = Math.abs(v);
    const deg = Math.floor(abs);
    const minF = (abs - deg) * 60;
    const min = Math.floor(minF);
    const sec = (minF - min) * 60;
    const hemi = axis === 'lat' ? (v >= 0 ? 'N' : 'S') : v >= 0 ? 'E' : 'W';
    return `${deg}° ${min}' ${sec.toFixed(2)}" ${hemi}`;
  }
  function formatDM(v, axis) {
    const abs = Math.abs(v);
    const deg = Math.floor(abs);
    const min = (abs - deg) * 60;
    const hemi = axis === 'lat' ? (v >= 0 ? 'N' : 'S') : v >= 0 ? 'E' : 'W';
    return `${deg}° ${min.toFixed(4)}' ${hemi}`;
  }
  function formatProjected(v, d = 2) {
    return v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function parseCoord(s) {
    if (!s) return null;
    // Normalise whitespace: collapse all whitespace (including NBSP, thin
    // space, figure space) so a pasted "500 000,00" becomes "500000.00".
    s = String(s).trim().replace(/[\u00A0\u202F\u2007]/g, ' ').replace(/,/g, '.');
    // For pure decimal: also strip internal whitespace (thousand separators)
    const decM = s.replace(/\s+/g, '').match(/^(-?\d+(\.\d+)?)°?$/);
    if (decM) return parseFloat(decM[1]);
    const re = /^(-?\d+(?:\.\d+)?)\s*°\s*(?:(\d+(?:\.\d+)?)\s*['′]\s*(?:(\d+(?:\.\d+)?)\s*["″]?\s*)?)?\s*([NSEW])?$/i;
    const m = s.match(re);
    if (!m) return null;
    let deg = parseFloat(m[1]);
    const min = m[2] ? parseFloat(m[2]) : 0;
    const sec = m[3] ? parseFloat(m[3]) : 0;
    const sign = deg < 0 ? -1 : 1;
    let result = sign * (Math.abs(deg) + min / 60 + sec / 3600);
    if (m[4] && (m[4].toUpperCase() === 'S' || m[4].toUpperCase() === 'W')) {
      result = -Math.abs(result);
    }
    return result;
  }
  function formatDistance(m) {
    if (m < 1000) return m.toFixed(1) + ' m';
    return (m / 1000).toFixed(3) + ' km';
  }
  function formatArea(m2) {
    if (m2 < 10000) return m2.toFixed(1) + ' m²';
    if (m2 < 1000000) return (m2 / 10000).toFixed(3) + ' ha';
    return (m2 / 1000000).toFixed(3) + ' km²';
  }

  /* ═══ 3. STATE STORE ════════════════════════════════════════════════════════ */
  const state = {
    features: [],         // tableau d'objets MapFeature
    groups: [],           // couches: { id, name, collapsed } — chaque objet peut avoir un groupId
    selectedIds: [],
    selectedGroupIds: [], // couches sélectionnées dans Calques (style en masse)
    multiSelectMode: false,  // when true, map taps add to selection instead of replacing it
    activePanel: null,
    basemap: 'hybrid',  // default: satellite + labels/roads (previous satellite behaviour)
    drawDefaults: {
      groupId: null,
      style: { stroke: '#3aa0ff', strokeWidth: 2.5, fill: '#3aa0ff', fillOpacity: 0.30, visible: true, showLabel: true },
    },
    listeners: { features: [], ui: [] },
  };
  const DRAW_ENGINE = (() => {
    // Keep TerraDraw as the stable default. Geoman is available only when
    // explicitly requested via URL query (for controlled testing).
    try {
      const params = new URLSearchParams(window.location.search || '');
      const fromQuery = (params.get('drawEngine') || '').trim().toLowerCase();
      if (fromQuery === 'geoman' || fromQuery === 'terradraw') return fromQuery;
    } catch (_) {}
    return 'terradraw';
  })();

  // Persistance localStorage
  const STORAGE_KEY = 'hydraulic-gis:features:v1';
  const GROUPS_KEY = 'hydraulic-gis:groups:v1';
  const DRAW_DEFAULTS_KEY = 'hydraulic-gis:draw-defaults:v1';
  const LEGEND_KEY = 'hydraulic-gis:legend:v1';
  const GRID_KEY = 'hydraulic-gis:grid:v1';
  const VALID_BASEMAP_IDS = ['satellite', 'hybrid', 'terrain', 'dark', 'light'];
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state.features = normalizeLoadedFeatures(JSON.parse(raw));
    } catch (e) { log.warn('Échec de chargement :', e); }
    // Restore layer groups.
    try {
      const g = localStorage.getItem(GROUPS_KEY);
      if (g) {
        const parsed = JSON.parse(g);
        if (Array.isArray(parsed)) state.groups = parsed.filter(x => x && x.id);
      }
    } catch (e) {}
    // Restore draw defaults (style + target layer for new objects).
    try {
      const dd = localStorage.getItem(DRAW_DEFAULTS_KEY);
      if (dd) {
        const parsed = JSON.parse(dd);
        if (parsed && typeof parsed === 'object') {
          if (parsed.groupId !== undefined) state.drawDefaults.groupId = parsed.groupId || null;
          if (parsed.style && typeof parsed.style === 'object') {
            state.drawDefaults.style = { ...state.drawDefaults.style, ...parsed.style };
          }
        }
      }
    } catch (e) {}
    // Legend and grid settings: both were documented as persistent but were
    // only ever held in memory, so every reload wiped the user's setup.
    try {
      const lg = localStorage.getItem(LEGEND_KEY);
      if (lg) {
        const parsed = JSON.parse(lg);
        if (parsed && typeof parsed === 'object') state._legend = parsed;
      }
    } catch (e) {}
    try {
      const gr = localStorage.getItem(GRID_KEY);
      if (gr) {
        const parsed = JSON.parse(gr);
        if (parsed && typeof parsed === 'object') Object.assign(gridState, parsed);
      }
    } catch (e) {}
  }
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.features));
    } catch (e) { log.warn('Échec de sauvegarde :', e); }
    try {
      localStorage.setItem(GROUPS_KEY, JSON.stringify(state.groups));
    } catch (e) {}
    try {
      localStorage.setItem(DRAW_DEFAULTS_KEY, JSON.stringify(state.drawDefaults));
    } catch (e) {}
    try {
      if (state._legend) localStorage.setItem(LEGEND_KEY, JSON.stringify(state._legend));
    } catch (e) {}
    try {
      if (typeof gridState !== 'undefined') localStorage.setItem(GRID_KEY, JSON.stringify(gridState));
    } catch (e) {}
  }

  function notifyFeatures() {
    saveState();
    state.listeners.features.forEach(fn => fn());
    // Redundant live sync for mobile browsers where listener timing can lag.
    try { if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap(); } catch (_) {}
  }
  /* Like notifyFeatures, but doesn't trigger UI re-render. Used for style
     changes from active inputs (sliders, color pickers) where re-rendering
     would destroy the input element mid-drag. The map is still updated. */
  function notifyFeaturesMapOnly() {
    saveState();
    if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap();
  }
  function notifyUi() {
    state.listeners.ui.forEach(fn => fn());
    // Also push the selection highlight, so when only selectedIds changes
    // (no feature mutation) the yellow halo updates immediately.
    try {
      if (typeof syncSelectionHighlight === 'function') syncSelectionHighlight();
    } catch (_) {}
    // Also sync visibility/map state so toggling eye icon or selecting from
    // calques triggers an immediate map repaint.
    try {
      if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap();
    } catch (_) {}
  }
  // Lightweight wrapper that just refreshes the selection highlight source.
  // We keep it separate from syncFeaturesToMap so a selection change doesn't
  // pay the cost of recomputing labels for every feature.
  function syncSelectionHighlight() {
    try {
      if (!map.isStyleLoaded()) return;
      if (!map.getSource('app-selection')) {
        if (typeof hudLog === 'function') hudLog('halo: src missing');
        return;
      }
      const selFeatures = state.features
        .filter(f => state.selectedIds.includes(f.id))
        .map(f => f.geojson);
      map.getSource('app-selection').setData({
        type: 'FeatureCollection', features: selFeatures
      });
      if (typeof hudLog === 'function') hudLog('halo: ' + selFeatures.length + ' feat');
      // Keep the halo above td-* in case a redraw moved it.
      if (map.getLayer('app-selection-fill')) map.moveLayer('app-selection-fill');
      if (map.getLayer('app-selection-line')) map.moveLayer('app-selection-line');
      if (map.getLayer('app-selection-point')) map.moveLayer('app-selection-point');
      raiseLabelLayers();
    } catch (err) {
      // Silently dropping this made the yellow halo just stop updating, which
      // reads to the user as "selection is broken" with nothing in the console.
      log.warn('[HydraulicGIS] syncSelectionHighlight failed:', err);
    }
  }
  // Labels must always sit on top of the terra-draw layers, which get
  // (re)created at the top of the stack while drawing.
  function raiseLabelLayers() {
    try {
      if (map.getLayer('app-label')) map.moveLayer('app-label');
    } catch (_) {}
  }

  function onFeatures(fn) { state.listeners.features.push(fn); }
  function onUi(fn) { state.listeners.ui.push(fn); }

  /* ═══ 4. FEATURE OPERATIONS ═════════════════════════════════════════════════ */
  const DEFAULT_STYLE = {
    stroke: '#3aa0ff', strokeWidth: 2.5,
    fill: '#3aa0ff', fillOpacity: 0.30,
    visible: true, showLabel: true,
  };

  function normalizeLoadedFeatures(items) {
    if (!Array.isArray(items)) return [];
    const now = Date.now();
    return items.map((f) => {
      if (!f || !f.geojson || !f.geojson.geometry) return null;
      const kind = f.kind || kindFromGeom(f.geojson.geometry, f.geojson && f.geojson.properties && f.geojson.properties.mode);
      const style = { ...DEFAULT_STYLE, ...(f.style || {}) };
      if (typeof style.showLabel !== 'boolean') style.showLabel = true;
      if (typeof style.visible !== 'boolean') style.visible = true;
      const name = (typeof f.name === 'string' && f.name.trim()) ? f.name : null;
      const geojson = {
        type: 'Feature',
        geometry: f.geojson.geometry,
        properties: { ...(f.geojson.properties || {}) },
      };
      return {
        ...f,
        id: f.id || newId('f'),
        name: name || nameForKind(kind),
        kind,
        geojson,
        style,
        labelAnchor: (f.labelAnchor && Array.isArray(f.labelAnchor) && f.labelAnchor.length === 2)
          ? f.labelAnchor.slice() : null,
        labelOffset: (f.labelOffset && isFinite(f.labelOffset.distM) && isFinite(f.labelOffset.bearing))
          ? { distM: f.labelOffset.distM, bearing: f.labelOffset.bearing } : null,
        labelRotation: isFinite(f.labelRotation) ? Number(f.labelRotation) : 0,
        metrics: f.metrics || computeMetrics(geojson, kind),
        createdAt: f.createdAt || now,
        updatedAt: f.updatedAt || now,
      };
    }).filter(Boolean);
  }

  function newId(prefix = 'f') {
    const ts = Date.now().toString(36);
    let rand;
    if (window.crypto && crypto.randomUUID) {
      rand = crypto.randomUUID().replace(/-/g, '').slice(0, 8);
    } else {
      rand = Math.random().toString(36).slice(2, 10);
    }
    return `${prefix}_${ts}_${rand}`;
  }

  function kindFromGeom(geom, mode) {
    if (mode === 'rectangle') return 'rectangle';
    if (mode === 'circle') return 'circle';
    if (geom.type === 'Point') return 'point';
    if (geom.type === 'LineString') return 'line';
    return 'polygon';
  }

  const KIND_LABEL = {
    point: 'Point', line: 'Ligne', polygon: 'Polygone',
    rectangle: 'Rectangle', circle: 'Cercle',
  };

  function computeMetrics(geojson, kind) {
    const m = {};
    try {
      if (kind === 'line') {
        m.lengthMeters = turf.length(geojson, { units: 'meters' });
      } else if (kind === 'polygon' || kind === 'rectangle' || kind === 'circle') {
        m.areaSquareMeters = turf.area(geojson);
        const ring = geojson.geometry.coordinates[0];
        m.lengthMeters = turf.length(turf.lineString(ring), { units: 'meters' });
      }
    } catch (e) { /* ignore */ }
    return m;
  }

  function nameForKind(kind) {
    const n = state.features.filter(f => f.kind === kind).length + 1;
    return `${KIND_LABEL[kind]} ${n}`;
  }

  function isDerivedFeature(f) {
    return !!(f && f.geojson && f.geojson.properties && f.geojson.properties._derived);
  }

  function isFeatureVisible(f) {
    return !!(f && f.style && f.style.visible !== false);
  }

  // terra-draw rejects any coordinate carrying more decimals than its
  // configured coordinatePrecision (9 by default) with a plain
  // "Feature has invalid coordinates" — and addFeatures reports it in the
  // return value instead of throwing. Turf output routinely has 13+ decimals,
  // so features were being dropped without a trace: they stayed in our store
  // and rendered, but terra-draw never knew about them, which made select and
  // vertex editing do nothing at all.
  function terraCoordinatePrecision() {
    try {
      const td = drawControl?.getTerraDrawInstance?.();
      for (const name of ['polygon', 'linestring', 'point']) {
        const p = td && td._modes && td._modes[name] && td._modes[name].coordinatePrecision;
        if (Number.isFinite(p)) return p;
      }
    } catch (_) {}
    return 9;
  }

  function roundGeometryPrecision(geom, precision) {
    const p = Number.isFinite(precision) ? precision : 9;
    const walk = (v) => {
      if (Array.isArray(v)) return v.map(walk);
      return typeof v === 'number' ? Number(v.toFixed(p)) : v;
    };
    return { ...geom, coordinates: walk(geom.coordinates) };
  }

  function pushFeatureToTerraDraw(f) {
    if (!f || !f.geojson || !f.geojson.geometry || isDerivedFeature(f)) return false;
    // Points render on app-derived-point (terra-draw td-point is unreliable on mobile).
    if (f.kind === 'point') return false;
    // Nav points render on app-derived-point (always visible, no terra-draw sync needed).
    if (f.geojson.properties && f.geojson.properties._navPoint) return false;
    try {
      const td = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
      if (!td || typeof td.addFeatures !== 'function') return false;
      let tid = f.geojson.properties && f.geojson.properties._terraId;
      if (!tid) {
        tid = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'restored-' + f.id;
        f.geojson.properties = { ...(f.geojson.properties || {}), _terraId: tid };
      }
      const tdMode = ({ point: 'point', line: 'linestring', polygon: 'polygon',
                        rectangle: 'rectangle', circle: 'circle', freehand: 'freehand' })[f.kind] || 'polygon';
      const geom = roundGeometryPrecision(f.geojson.geometry, terraCoordinatePrecision());
      // Keep our copy identical to terra-draw's, otherwise the next edit
      // round-trip reintroduces the rejected precision.
      f.geojson.geometry = geom;
      const res = td.addFeatures([{
        id: tid,
        type: 'Feature',
        geometry: geom,
        properties: { ...(f.geojson.properties || {}), mode: tdMode },
      }]);
      const rejected = Array.isArray(res) ? res.filter(r => r && r.valid === false) : [];
      if (rejected.length) {
        log.warn('[HydraulicGIS] terra-draw rejected feature', f.id, rejected[0].reason);
        return false;
      }
      return true;
    } catch (err) {
      log.warn('[HydraulicGIS] pushFeatureToTerraDraw failed:', err);
      return false;
    }
  }

  function restoreFeaturesToTerraDraw() {
    let count = 0;
    for (const f of state.features) {
      if (f.kind === 'point') detachPointFromTerraDraw(f);
    }
    for (const f of state.features) {
      if (isDerivedFeature(f) || !isFeatureVisible(f)) continue;
      if (pushFeatureToTerraDraw(f)) count++;
    }
    if (count) log.info('[HydraulicGIS] restored', count, 'feature(s) into terra-draw');
    return count;
  }

  function restorePersistedMapState() {
    try {
      installAppLayers();
      ensureDerivedLayers();
      syncDerivedLayer();
      syncFeaturesToMap();
      restoreFeaturesToTerraDraw();
      syncFeaturesToMap();
    } catch (err) {
      log.warn('[HydraulicGIS] restorePersistedMapState failed:', err);
    }
  }

  function clearEphemeralMarkers() {
    try {
      if (flyToMarker) { flyToMarker.remove(); flyToMarker = null; }
      if (searchMarker) { searchMarker.remove(); searchMarker = null; }
    } catch (_) {}
  }

  function createNavPoint(lng, lat, nameHint) {
    clearEphemeralMarkers();
    const nm = nameHint || `Point (${formatWgsPairDisplay(lng, lat, 5)})`;
    const f = addFeature({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [lng, lat] },
      properties: { _navPoint: true },
    }, 'point', {
      name: nm,
      applyDrawDefaults: false,
      style: {
        stroke: '#ff6b35',
        fill: '#ff6b35',
        strokeWidth: 3,
        fillOpacity: 1,
        visible: true,
        showLabel: true,
      },
    });
    selectFeature(f.id, { additive: false });
    try { syncDerivedLayer(); } catch (_) {}
    try { syncFeaturesToMap(); } catch (_) {}
    try { map.triggerRepaint(); } catch (_) {}
    return f;
  }

  function syncContourLabelsFromStore() {
    try {
      ensureContourLabelsLayer();
      const elabSrc = map.getSource('app-contour-labels');
      if (!elabSrc) return;
      const allLabels = [];
      for (const f of state.features) {
        if (!f.geojson || !f.geojson.properties || f.geojson.properties._derivedKind !== 'contours') continue;
        // Hiding the contour feature must hide its elevation labels too.
        try { if (typeof isFeatureVisible === 'function' && !isFeatureVisible(f)) continue; } catch (_) {}
        const stored = f.geojson.properties._elevationLabels;
        if (!Array.isArray(stored)) continue;
        for (const lab of stored) {
          if (lab && lab.properties) {
            allLabels.push({
              ...lab,
              properties: { ...lab.properties, contourOwnerId: f.id },
            });
          }
        }
      }
      elabSrc.setData({ type: 'FeatureCollection', features: allLabels });
    } catch (e) {
      log.warn('[HydraulicGIS] syncContourLabelsFromStore failed:', e);
    }
  }

  function parseBornageTable(text) {
    const lines = String(text || '').trim().split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) return { error: 'Fichier vide.' };
    const splitRow = (line, sep) => {
      if (sep === '\t') return line.split('\t').map(c => c.trim().replace(/^"|"$/g, ''));
      const out = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; continue; }
        if (!inQ && ch === sep) { out.push(cur.trim()); cur = ''; continue; }
        cur += ch;
      }
      out.push(cur.trim());
      return out.map(c => c.replace(/^"|"$/g, ''));
    };
    const headerLine = lines[0];
    const sep = headerLine.includes(';') ? ';' : headerLine.includes('\t') ? '\t' : ',';
    const headers = splitRow(headerLine, sep).map(h => h.toLowerCase().replace(/^\ufeff/, ''));
    const borneIdx = headers.findIndex(h => h === 'borne' || h.includes('borne'));
    const xIdx = headers.findIndex(h => h === 'x' || h === 'longitude' || h === 'lon' || h === 'lng');
    const yIdx = headers.findIndex(h => h === 'y' || h === 'latitude' || h === 'lat');
    if (xIdx < 0 || yIdx < 0) return { error: 'Colonnes « borne », « X » et « Y » requises (ligne d\'en-tête).' };
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = splitRow(lines[i], sep);
      if (!cols.length || cols.every(c => !c)) continue;
      const borne = borneIdx >= 0 ? cols[borneIdx] : `B${String(i).padStart(2, '0')}`;
      const xRaw = cols[xIdx], yRaw = cols[yIdx];
      if (!xRaw || !yRaw) continue;
      let x = parseCoord(xRaw);
      if (x === null) x = parseFloat(String(xRaw).replace(/[\s\u00A0\u202F\u2007]/g, '').replace(',', '.'));
      let y = parseCoord(yRaw);
      if (y === null) y = parseFloat(String(yRaw).replace(/[\s\u00A0\u202F\u2007]/g, '').replace(',', '.'));
      if (!isFinite(x) || !isFinite(y)) continue;
      rows.push({ borne, x, y });
    }
    if (!rows.length) return { error: 'Aucune ligne de coordonnées valide trouvée.' };
    return { rows };
  }

  function importBornageRows(rows, crs, replace) {
    if (!state._bornage) state._bornage = { crs: 'wgs84', points: [] };
    if (replace) state._bornage.points = [];
    const pts = state._bornage.points;
    let added = 0, skipped = 0;
    for (const row of rows) {
      let lng, lat;
      try {
        if (crsIsGeographic(crs)) { lng = row.x; lat = row.y; }
        else { const r = reproject([row.x, row.y], crs, 'wgs84'); lng = r[0]; lat = r[1]; }
      } catch (_) { skipped++; continue; }
      if (!isFinite(lng) || !isFinite(lat) || Math.abs(lat) > 90 || Math.abs(lng) > 180) { skipped++; continue; }
      if (pts.length) {
        const prev = pts[pts.length - 1];
        let dkm = Infinity;
        try { dkm = turf.distance([prev.lng, prev.lat], [lng, lat], { units: 'kilometers' }); } catch (_) {}
        if (dkm > 100) { skipped++; continue; }
      }
      const coordTxt = crsIsGeographic(crs)
        ? formatWgsPairDisplay(lng, lat, 6)
        : `${formatProjected(row.x, 1)} ; ${formatProjected(row.y, 1)}`;
      const label = row.borne ? `${row.borne} (${coordTxt})` : coordTxt;
      pts.push({ lng, lat, x: row.x, y: row.y, crs, label, borne: row.borne });
      added++;
    }
    return { added, skipped };
  }

  function addFeature(geojson, kind, overrides = {}) {
    // ─── Defensive de-duplication ───────────────────────────────────
    // If geojson.properties._terraId is set AND we already have a row
    // with that terraId, this is NOT a new feature — it's terra-draw
    // re-firing 'finish' for an edit operation. We just update the
    // existing row instead of creating a duplicate.
    //
    // This is a belt-and-braces guard: the finish handler already tries
    // to detect this case, but if any code path slips past it (e.g. a
    // future terra-draw bundle changing the action labels), we still
    // won't end up with two rows for the same on-map shape.
    const incomingTerraId = geojson && geojson.properties && geojson.properties._terraId;
    if (incomingTerraId) {
      const existing = state.features.find(x =>
        x.geojson && x.geojson.properties && terraIdMatch(x.geojson.properties._terraId, incomingTerraId));
      if (existing) {
        log.warn('[HydraulicGIS] addFeature: duplicate _terraId=' + incomingTerraId
                 + ' — updating existing feature ' + existing.id + ' instead of creating new row.');
        existing.geojson.geometry = geojson.geometry;
        existing.metrics = computeMetrics(existing.geojson, existing.kind);
        existing.updatedAt = Date.now();
        notifyFeatures();
        return existing;
      }
    }

    const f = {
      id: newId('f'),
      name: nameForKind(kind),
      kind,
      geojson: { type: 'Feature', geometry: geojson.geometry, properties: geojson.properties || {} },
      style: { ...DEFAULT_STYLE },
      metrics: computeMetrics(geojson, kind),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      ...overrides,
    };
    state.features.push(f);
    const props = geojson && geojson.properties;
    const skipDefaults = props && (props._derived || props._navPoint);
    if (!skipDefaults && overrides.applyDrawDefaults !== false) applyDrawDefaultsToFeature(f);
    notifyFeatures();
    return f;
  }

  function removeFeature(id) {
    const f = state.features.find(x => x.id === id);
    if (!f) return;
    // If this feature was drawn in terra-draw, remove it from there too
    // (terra-draw is the renderer; if it stays, the shape stays on the map).
    if (f.geojson.properties && f.geojson.properties._terraId && drawControl) {
      try {
        const td = drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
        if (td && typeof td.removeFeatures === 'function') {
          td.removeFeatures([f.geojson.properties._terraId]);
        }
      } catch (err) { log.warn('[HydraulicGIS] removeFeatures failed:', err); }
    }
    if (labelHandleMarkers.has(id)) {
      try { labelHandleMarkers.get(id).remove(); } catch (_) {}
      labelHandleMarkers.delete(id);
    }
    state.features = state.features.filter(f2 => f2.id !== id);
    state.selectedIds = state.selectedIds.filter(x => x !== id);
    for (const [hid, marker] of Array.from(labelHandleMarkers.entries())) {
      if (!state.features.some(f2 => f2.id === hid)) {
        try { marker.remove(); } catch (_) {}
        labelHandleMarkers.delete(hid);
      }
    }
    // Immediate hard wipe, then rebuild from remaining features only.
    try { purgeAllLabelOverlays(); } catch (_) {}
    try { applyLabelFeatures(buildLabelFeatures()); } catch (_) {}
    // Prune elevation labels and derived overlays tied to deleted features.
    try { syncContourLabelsFromStore(); } catch (_) {}
    try {
      const ctrSrc = map.getSource('app-contours');
      if (ctrSrc) {
        const contourFeats = state.features.filter(f2 =>
          f2.geojson && f2.geojson.properties && f2.geojson.properties._derivedKind === 'contours');
        ctrSrc.setData({
          type: 'FeatureCollection',
          features: contourFeats.map(f2 => ({
            type: 'Feature', id: f2.id, geometry: f2.geojson.geometry, properties: { id: f2.id },
          })),
        });
      }
    } catch (_) {}
    notifyFeatures();
    notifyUi();
    try { if (map.getSource('app-selection')) map.getSource('app-selection').setData({ type: 'FeatureCollection', features: [] }); } catch (_) {}
    // Ensure renderer-derived overlays cannot remain as ghosts after deletion.
    try { if (typeof syncDerivedLayer === 'function') syncDerivedLayer(); } catch (_) {}
    try { if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap(); } catch (_) {}
    try { syncLabelHandles(); } catch (_) {}
    // Late flush: some MapLibre mobile builds repaint symbols one frame late.
    setTimeout(() => {
      try { purgeAllLabelOverlays(); } catch (_) {}
      try { applyLabelFeatures(buildLabelFeatures()); } catch (_) {}
      try { syncLabelHandles(); } catch (_) {}
    }, 40);
    setTimeout(() => {
      try { applyLabelFeatures(buildLabelFeatures()); } catch (_) {}
    }, 160);
  }

  function clearAllFeatures() {
    // Collect every renderer id BEFORE we empty the store.
    let uniqueIds = [];
    try {
      const td = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
      if (td) {
        const ids = state.features
          .map(f => f.geojson && f.geojson.properties && f.geojson.properties._terraId)
          .filter(Boolean)
          .map(String);
        if (typeof td.getSnapshot === 'function') {
          try {
            (td.getSnapshot() || []).forEach(sf => { if (sf && sf.id != null) ids.push(String(sf.id)); });
          } catch (_) {}
        }
        uniqueIds = Array.from(new Set(ids));
      }
    } catch (_) {}

    // 1) Empty the app store FIRST so any re-render (syncDerivedLayer /
    //    syncFeaturesToMap) cannot re-spawn a feature it still sees in state.
    //    This was the root cause of contour "ghosts" surviving Tout effacer.
    state.features = [];
    state.selectedIds = [];
    state.selectedGroupIds = [];
    state.selectActive = false;

    // 2) Remove from TerraDraw after leaving select/edit so nothing is locked.
    try {
      const td = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
      if (td) {
        try { if (typeof td.setMode === 'function') td.setMode('static'); } catch (_) {}
        try { if (typeof td.deselect === 'function') td.deselect(); } catch (_) {}
        if (uniqueIds.length && typeof td.removeFeatures === 'function') {
          try { td.removeFeatures(uniqueIds); } catch (_) {}
          requestAnimationFrame(() => { try { td.removeFeatures(uniqueIds); } catch (_) {} });
        }
        // The store is already empty, so anything left in terra-draw can no
        // longer be reached from the UI. Verify and wipe it outright.
        requestAnimationFrame(() => {
          try {
            const left = typeof td.getSnapshot === 'function' ? (td.getSnapshot() || []).length : 0;
            if (left && typeof td.clear === 'function') {
              log.warn('[HydraulicGIS] clearAll:', left, 'shape(s) left in terra-draw, forcing clear()');
              td.clear();
            }
          } catch (err) { log.warn('[HydraulicGIS] clearAll verification failed:', err); }
        });
      }
    } catch (err) { log.warn('[HydraulicGIS] removeFeatures failed:', err); }

    // 3) Empty every app-owned source so no overlay can linger as a ghost.
    try { purgeAllLabelOverlays(); } catch (_) {}
    for (const srcId of [SRC_LABELS, 'app-selection', 'app-derived', 'app-contour-labels', 'app-contours']) {
      try { const s = map.getSource(srcId); if (s) s.setData({ type: 'FeatureCollection', features: [] }); } catch (_) {}
    }
    try { if (typeof syncDerivedLayer === 'function') syncDerivedLayer(); } catch (_) {}

    // 4) Reset toolbar visual state so the menu can't stay stuck.
    try {
      if (typeof window.__hgisSetSelectActive === 'function') window.__hgisSetSelectActive(false);
    } catch (_) {}
    try { const eb = document.getElementById('hgis-edit-btn'); if (eb) eb.classList.remove('active'); } catch (_) {}

    notifyFeatures();
    notifyUi();
  }

  function renameFeature(id, name) {
    const f = state.features.find(x => x.id === id);
    if (f) {
      f.name = name; f.updatedAt = Date.now();
      notifyFeatures();
    }
  }

  /* ─── Layer groups ──────────────────────────────────────────────────────
     A group is an organizational layer in Calques. Each feature may carry a
     groupId; features without one appear under "Sans groupe". Group actions
     cascade to member features (visibility) but never change geometry. */
  function createGroupObj(name) {
    const g = { id: newId('g'), name: name || ('Couche ' + (state.groups.length + 1)), collapsed: false };
    state.groups.push(g);
    return g;
  }
  function createGroup(name) {
    const g = createGroupObj(name);
    notifyFeatures(); notifyUi();
    return g;
  }
  function renameGroup(id, name) {
    const g = state.groups.find(x => x.id === id);
    if (g && name && name.trim()) { g.name = name.trim(); notifyFeatures(); notifyUi(); }
    else ui.render();
  }
  function deleteGroup(id) {
    state.groups = state.groups.filter(g => g.id !== id);
    state.selectedGroupIds = state.selectedGroupIds.filter(gid => gid !== id);
    // Members become ungrouped (features are kept).
    state.features.forEach(f => { if (f.groupId === id) f.groupId = null; });
    notifyFeatures(); notifyUi();
  }
  function toggleGroupCollapsed(id) {
    const g = state.groups.find(x => x.id === id);
    if (g) { g.collapsed = !g.collapsed; notifyFeatures(); notifyUi(); }
  }
  function setGroupVisibility(id, visible) {
    let touched = false;
    state.features.forEach(f => {
      if (f.groupId === id) { f.style.visible = visible; f.updatedAt = Date.now(); touched = true; }
    });
    if (touched) { notifyFeatures(); notifyUi(); }
  }
  function assignFeatureToGroup(featureId, groupId) {
    const f = state.features.find(x => x.id === featureId);
    if (!f) return;
    f.groupId = groupId || null;
    f.updatedAt = Date.now();
    notifyFeatures(); notifyUi();
  }
  function groupSelectedIntoNewGroup() {
    if (!state.selectedIds.length) return;
    const g = createGroupObj();
    state.selectedIds.forEach(id => {
      const f = state.features.find(x => x.id === id);
      if (f) f.groupId = g.id;
    });
    notifyFeatures(); notifyUi();
  }
  window.layerCreateGroup = function () { createGroup(); };
  window.layerGroupSelected = function () { groupSelectedIntoNewGroup(); };

  // Show the rename modal for a freshly-created feature. Default value is
  // the auto-generated name. If the user types something different, we
  // rename. If they hit Cancel or Escape, we keep the default. Either way,
  // the feature stays — the modal is just a naming opportunity.
  function promptFeatureName(id) {
    const f = state.features.find(x => x.id === id);
    if (!f) return;
    const kindLabel = ({
      point: 'point',
      line: 'ligne',
      polygon: 'polygone',
      rectangle: 'rectangle',
      circle: 'cercle',
      freehand: 'forme libre',
    })[f.kind] || 'objet';
    ui.prompt(
      `Nommer le ${kindLabel}`,
      `Choisissez un nom ou validez avec « ${f.name} ».`,
      f.name,
      (newName) => {
        if (newName && newName !== f.name) renameFeature(id, newName);
      }
    );
  }

  let setStyle = function (id, patch) {
    const f = state.features.find(x => x.id === id);
    if (f) {
      f.style = { ...f.style, ...patch }; f.updatedAt = Date.now();
      // Use map-only update so we don't re-render the Style panel mid-drag
      // (which would destroy the input element being interacted with).
      notifyFeaturesMapOnly();
    }
  };

  function toggleVisibility(id) {
    const f = state.features.find(x => x.id === id);
    if (!f) return;
    f.style.visible = !f.style.visible;
    f.updatedAt = Date.now();
    // Hidden features are skipped by restoreFeaturesToTerraDraw, so after a
    // reload they are absent from terra-draw entirely and toggling the eye
    // back on used to show nothing. Re-add them on the way back in.
    if (f.style.visible) {
      try {
        const td = drawControl?.getTerraDrawInstance?.();
        const tid = f.geojson?.properties?._terraId;
        const known = !!(td && tid && typeof td.hasFeature === 'function' && td.hasFeature(tid));
        if (!known) pushFeatureToTerraDraw(f);
      } catch (_) {}
    }
    notifyFeatures();
  }

  function getFeatureIdsInGroup(gid) {
    return state.features.filter(f => f.groupId === gid).map(f => f.id);
  }

  function getAllStyleTargetIds() {
    const ids = new Set(state.selectedIds);
    state.selectedGroupIds.forEach(gid => {
      getFeatureIdsInGroup(gid).forEach(id => ids.add(id));
    });
    return Array.from(ids);
  }

  function describeStyleTargets() {
    const featIds = getAllStyleTargetIds();
    const parts = [];
    if (state.selectedGroupIds.length) {
      parts.push(`${state.selectedGroupIds.length} couche${state.selectedGroupIds.length > 1 ? 's' : ''}`);
    }
    if (featIds.length) {
      parts.push(`${featIds.length} objet${featIds.length > 1 ? 's' : ''}`);
    }
    return { featIds, label: parts.join(', ') || '0 objet' };
  }

  function getSelectedFeaturesForStyle() {
    const { featIds } = describeStyleTargets();
    return state.features.filter(f => featIds.includes(f.id));
  }

  function summarizeStyles(features) {
    if (!features.length) return {};
    const pick = (key) => {
      const vals = features.map(f => f.style[key]);
      const first = vals[0];
      return vals.every(v => v === first) ? first : undefined;
    };
    return {
      stroke: pick('stroke'),
      strokeWidth: pick('strokeWidth'),
      fill: pick('fill'),
      fillOpacity: pick('fillOpacity'),
      showLabel: pick('showLabel'),
    };
  }

  let refreshTerraDrawStylesHook = null;

  function toggleGroupSelection(gid) {
    const isSelected = state.selectedGroupIds.includes(gid);
    const featIds = getFeatureIdsInGroup(gid);
    if (isSelected) {
      state.selectedGroupIds = state.selectedGroupIds.filter(x => x !== gid);
      state.selectedIds = state.selectedIds.filter(id => !featIds.includes(id));
    } else {
      if (!state.selectedGroupIds.includes(gid)) state.selectedGroupIds.push(gid);
      featIds.forEach(id => { if (!state.selectedIds.includes(id)) state.selectedIds.push(id); });
      const g = state.groups.find(x => x.id === gid);
      if (g && g.collapsed) {
        g.collapsed = false;
        saveState();
      }
    }
    notifyUi();
  }

  function applyDrawDefaultsToFeature(f) {
    if (!f || !state.drawDefaults) return;
    if (state.drawDefaults.groupId) f.groupId = state.drawDefaults.groupId;
    if (state.drawDefaults.style) {
      f.style = { ...f.style, ...state.drawDefaults.style };
    }
  }

  function applyStyleToTargets(patch) {
    const ids = getAllStyleTargetIds();
    if (!ids.length) return;
    let touched = false;
    ids.forEach(id => {
      const f = state.features.find(x => x.id === id);
      if (f) {
        f.style = { ...f.style, ...patch };
        f.updatedAt = Date.now();
        touched = true;
      }
    });
    if (!touched) return;
    saveState();
    try { if (typeof refreshTerraDrawStylesHook === 'function') refreshTerraDrawStylesHook(); } catch (_) {}
    try { if (typeof syncDerivedLayer === 'function') syncDerivedLayer(); } catch (_) {}
    try { if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap(); } catch (_) {}
    try { map.triggerRepaint(); } catch (_) {}
  }

  function toggleSelect(id) {
    const f = state.features.find(x => x.id === id);
    if (state.selectedIds.includes(id)) {
      state.selectedIds = state.selectedIds.filter(x => x !== id);
      if (f && f.groupId) {
        const stillSelected = getFeatureIdsInGroup(f.groupId).some(fid => state.selectedIds.includes(fid));
        if (!stillSelected) state.selectedGroupIds = state.selectedGroupIds.filter(g => g !== f.groupId);
      }
    } else {
      state.selectedIds = [...state.selectedIds, id];
      if (f && f.groupId) {
        const featIds = getFeatureIdsInGroup(f.groupId);
        if (featIds.length && featIds.every(fid => state.selectedIds.includes(fid))) {
          if (!state.selectedGroupIds.includes(f.groupId)) state.selectedGroupIds.push(f.groupId);
        }
      }
    }
    notifyUi();
  }
  function selectFeature(id, options = {}) {
    const additive = options.additive === true;
    if (additive) {
      toggleSelect(id);
      return;
    }
    state.selectedIds = [id];
    state.selectedGroupIds = [];
    notifyUi();
  }
  function terraIdMatch(a, b) {
    if (a == null || b == null) return false;
    return String(a) === String(b);
  }

  /* ═══ 5. MAP & DRAWING ══════════════════════════════════════════════════════ */
  const RASTER_GLYPHS = 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf';

  const BASEMAPS = {
    dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    satellite: {
      version: 8,
      glyphs: RASTER_GLYPHS,
      sources: {
        esri: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 18,
          attribution: 'Tiles © Esri — World Imagery',
        },
      },
      layers: [
        { id: 'esri-imagery', type: 'raster', source: 'esri', minzoom: 0, maxzoom: 22 },
      ],
    },
    hybrid: {
      version: 8,
      glyphs: RASTER_GLYPHS,
      sources: {
        esri: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 18,
          attribution: 'Tiles © Esri — World Imagery',
        },
        'esri-labels': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 18,
          attribution: 'Labels © Esri',
        },
        'esri-transportation': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 18,
          attribution: 'Roads © Esri',
        },
      },
      layers: [
        { id: 'esri-imagery', type: 'raster', source: 'esri', minzoom: 0, maxzoom: 22 },
        { id: 'esri-roads', type: 'raster', source: 'esri-transportation', minzoom: 0, maxzoom: 22 },
        { id: 'esri-labels', type: 'raster', source: 'esri-labels', minzoom: 0, maxzoom: 22 },
      ],
    },
    terrain: {
      version: 8,
      glyphs: RASTER_GLYPHS,
      sources: {
        // OpenTopoMap first: Esri World_Topo often returns empty tiles
        // ("Map data not yet available") past ~z15 in many regions.
        'opentopo': {
          type: 'raster',
          tiles: [
            'https://a.tile.opentopomap.org/{z}/{x}/{y}.png',
            'https://b.tile.opentopomap.org/{z}/{x}/{y}.png',
            'https://c.tile.opentopomap.org/{z}/{x}/{y}.png',
          ],
          tileSize: 256,
          maxzoom: 17,
          attribution: '© OpenStreetMap contributors, © OpenTopoMap (CC-BY-SA)',
        },
        'esri-hillshade': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 16,
          attribution: 'Hillshade © Esri',
        },
      },
      layers: [
        { id: 'esri-hillshade', type: 'raster', source: 'esri-hillshade', minzoom: 0, maxzoom: 22, paint: { 'raster-opacity': 0.55 } },
        { id: 'opentopo', type: 'raster', source: 'opentopo', minzoom: 0, maxzoom: 22 },
      ],
    },
  };

  function isEsriRasterBasemap(id) {
    return id === 'satellite' || id === 'hybrid' || id === 'terrain';
  }

  function restoreBasemapPreference() {
    try {
      const bm = localStorage.getItem('hydraulic-gis:basemap');
      if (bm === 'satellite' && !localStorage.getItem('hydraulic-gis:basemap-v2')) {
        state.basemap = 'hybrid';
        localStorage.setItem('hydraulic-gis:basemap', 'hybrid');
        localStorage.setItem('hydraulic-gis:basemap-v2', '1');
      } else if (bm && VALID_BASEMAP_IDS.includes(bm) && BASEMAPS[bm]) {
        state.basemap = bm;
      }
    } catch (e) {}
    if (!BASEMAPS[state.basemap]) state.basemap = 'hybrid';
  }

  const SRC_POINTS = 'app-points', SRC_LINES = 'app-lines', SRC_POLYS = 'app-polys', SRC_LABELS = 'app-labels';

  // Load persisted state before map creation so the saved basemap takes effect.
  loadState();
  restoreBasemapPreference();

  const SATELLITE_MAX_ZOOM = 20; // allow pinch-zoom past native z18 via overzoom
  const initialBasemap = BASEMAPS[state.basemap] ? state.basemap : 'hybrid';
  state.basemap = initialBasemap;

  const map = new maplibregl.Map({
    container: 'map',
    style: BASEMAPS[initialBasemap],
    center: [-5.0, 33.5],
    zoom: 5,
    // Satellite: native imagery capped at z18 (see BASEMAPS); map can zoom to 20
    // with upscaled tiles. Carto basemaps top out around z19.
    minZoom: 2,
    maxZoom: isEsriRasterBasemap(initialBasemap) ? SATELLITE_MAX_ZOOM : 19,
    attributionControl: { compact: true },

    // ─── Gesture configuration to avoid conflicts with terra-draw ───
    // 2D-only: no pitch, no rotation. Removes touchpad/two-finger gestures
    // that can be misinterpreted as drawing taps on phones.
    pitchWithRotate: false,
    dragRotate: false,
    touchPitch: false,
    maxPitch: 0,
    bearingSnap: 0,

    // ─── WebGL stability ───
    // antialias=false reduces GPU memory pressure on mobile (less likely
    // to lose context), and preserveDrawingBuffer=false lets the GPU
    // recycle buffers between frames.
    antialias: false,
    preserveDrawingBuffer: false,

    // Lower fadeDuration so freshly-drawn features paint immediately
    // (default 300ms can make in-progress lines look invisible).
    fadeDuration: 0,
  });

  // doubleClickZoom collides with the second tap of "click-move" rectangle/
  // circle drawing on phones — the same tap zooms the map AND finishes the
  // shape. We disable it when terra-draw is in any draw mode (not select).
  // It stays enabled in select mode so users can still double-tap to zoom.
  function setDoubleClickZoom(enable) {
    try {
      if (enable) map.doubleClickZoom.enable();
      else map.doubleClickZoom.disable();
    } catch (_) {}
  }

  // Lazy-create a top-of-screen banner used during "pick on map" mode.

  map.getCanvas().addEventListener('webglcontextlost', (e) => {

    e.preventDefault();
  }, false);
  map.getCanvas().addEventListener('webglcontextrestored', () => {
    log.info('[HydraulicGIS] WebGL context restored — reinstalling app layers.');

  // Terra-draw control
  let drawControl = null;
  let _originalSelectFlags = null;
  function setSelectEditFlags(td, enabled) {
    if (!td || !td._modes) return false;
    const selectModeName = td._instanceSelectMode || 'select';
    const selMode = td._modes[selectModeName];
    if (!selMode || !selMode.flags) {
      log.warn('[HydraulicGIS] select mode not found or has no flags');
      return false;
    }
    if (!_originalSelectFlags) {
      _originalSelectFlags = JSON.parse(JSON.stringify(selMode.flags));
    }
    if (enabled) {
      selMode.flags = JSON.parse(JSON.stringify(_originalSelectFlags));
      // Guarantee draggable vertices. Midpoints stay OFF: users confused the
      // half-way handles with real vertices. Adding a vertex is done with a
      // long press on the segment instead.
      for (const modeName of Object.keys(selMode.flags)) {
        const entry = selMode.flags[modeName];
        if (!entry || !entry.feature) continue;
        const c = entry.feature.coordinates;
        if (c === true || c == null) {
          entry.feature.coordinates = { midpoints: false, draggable: true, deletable: true };
        } else if (typeof c === 'object') {
          entry.feature.coordinates.midpoints = false;
          entry.feature.coordinates.draggable = true;
          entry.feature.coordinates.deletable = true;
        }
      }
    } else {
      const noEditFlags = {};
      for (const modeName of Object.keys(_originalSelectFlags)) {
        noEditFlags[modeName] = {
          feature: { draggable: false, rotateable: false, scaleable: false, coordinates: false },
        };
      }
      selMode.flags = noEditFlags;
    }
    return true;
  }
  let _geomanModule = null;
  let _geomanInstance = null;

  let _appLayersInstallQueued = false;
  function installAppLayers() {
    if (!map.isStyleLoaded()) {
      // Guarded: a burst of early calls would otherwise queue N one-shot
      // callbacks that all run the same install on the first idle.
      if (!_appLayersInstallQueued) {
        _appLayersInstallQueued = true;
        onStyleReady(() => {
          _appLayersInstallQueued = false;
          try { installAppLayers(); syncFeaturesToMap(); } catch (_) {}
        });
      }
      return;
    }
    // Idempotent: already installed?
    if (map.getSource(SRC_LABELS) && map.getLayer('app-label')
        && map.getSource('app-selection') && map.getLayer('app-selection-line')) return;

    // Clean partial state. app-label-leader is a layer from older builds: it
    // has to stay in this list so a stale style never keeps it alive.
    for (const id of ['app-label', 'app-label-leader']) {
      if (map.getLayer(id)) { try { map.removeLayer(id); } catch (_) {} }
    }
    if (map.getSource(SRC_LABELS)) { try { map.removeSource(SRC_LABELS); } catch (_) {} }
    for (const id of ['app-selection-line', 'app-selection-fill', 'app-selection-point', 'app-selection-poly-fill']) {
      if (map.getLayer(id)) { try { map.removeLayer(id); } catch (_) {} }
    }
    if (map.getSource('app-selection')) { try { map.removeSource('app-selection'); } catch (_) {} }

    const empty = { type: 'FeatureCollection', features: [] };
    // Do NOT use promoteId here — MapLibre can leave ghost symbols after
    // feature removal when promoteId is set (stale feature-id index).
    map.addSource(SRC_LABELS, { type: 'geojson', data: empty });
    // Selection highlight source: holds the geometries of every feature in
    // state.selectedIds. Used so the user can see ALL selected items
    // simultaneously when in multi-select mode (terra-draw's own select
    // visual only highlights the one feature being edited).
    map.addSource('app-selection', { type: 'geojson', data: empty });

    // Selection halo for points (filled circle, larger and brighter).
    map.addLayer({
      id: 'app-selection-point', type: 'circle', source: 'app-selection',
      filter: ['==', ['geometry-type'], 'Point'],
      paint: {
        'circle-radius': 12,
        'circle-color': 'transparent',
        'circle-stroke-color': '#fbc412',
        'circle-stroke-width': 3,
      },
    });
    // Selection halo fill for polygons (semi-transparent yellow overlay).
    map.addLayer({
      id: 'app-selection-fill', type: 'fill', source: 'app-selection',
      filter: ['==', ['geometry-type'], 'Polygon'],
      paint: {
        'fill-color': '#fbc412',
        'fill-opacity': 0.18,
      },
    });
    // Selection halo for lines / polygon outlines.
    map.addLayer({
      id: 'app-selection-line', type: 'line', source: 'app-selection',
      filter: ['!=', ['geometry-type'], 'Point'],
      paint: {
        'line-color': '#fbc412',
        'line-width': 4,
        'line-opacity': 0.85,
      },
    });

    // We only render LABELS via our own layer. The shapes themselves are
    // rendered by terra-draw (td-point, td-linestring, td-polygon). This
    // keeps the mobile draw experience simple and bug-free: terra-draw is
    // the sole renderer and there's no double-buffering or filter dance.
    map.addLayer({
      id: 'app-label', type: 'symbol', source: SRC_LABELS,
      layout: {
        'text-field': ['get', 'name'],
        // Use a map glyph stack that is actually available across basemaps.
        'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular'],
        'text-size': 12,
        // Minimal offset: label sits very close to the geometry centroid.
        'text-offset': [0, 0.6],
        'text-anchor': 'top',
        // User-set orientation, kept in map space so a label stays aligned
        // with the ground (and with its object) when the map is rotated.
        'text-rotate': ['coalesce', ['get', 'rotation'], 0],
        'text-rotation-alignment': 'map',
        'text-pitch-alignment': 'viewport',
        // Separated anchor positions are computed in code; always show our labels.
        'text-allow-overlap': true,
        'text-ignore-placement': true,
        'text-optional': false,
        'text-padding': 2,
        // Higher priority value = drawn later = on top when placement allows.
        'symbol-sort-key': ['coalesce', ['get', 'priority'], 0],
      },
      paint: {
        'text-color': '#ffffff',
        'text-halo-color': '#0b0f14',
        'text-halo-width': 2,
        'text-halo-blur': 0.5,
      },
    });
  }

  function polyCentroid(f) {
    const geom = f.geojson && f.geojson.geometry;
    if (!geom) return null;
    if (geom.type === 'Polygon') {
      const full = geom.coordinates[0];
      if (!full || !full.length) return null;
      // Drop the closing coordinate: counting the first vertex twice skewed
      // the centroid by several percent on low-vertex shapes.
      const first = full[0];
      const last = full[full.length - 1];
      const closed = full.length > 1 && first && last
        && first[0] === last[0] && first[1] === last[1];
      const ring = closed ? full.slice(0, -1) : full;
      if (!ring.length) return null;
      let x = 0, y = 0;
      for (const [lng, lat] of ring) { x += lng; y += lat; }
      return [x / ring.length, y / ring.length];
    }
    if (geom.type === 'MultiPolygon' && geom.coordinates[0]?.[0]) {
      return polyCentroid({ geojson: { geometry: { type: 'Polygon', coordinates: geom.coordinates[0] } } });
    }
    return null;
  }

  function computeLabelPriority(f) {
    let priority = 0;
    if (f.metrics && f.metrics.lengthMeters) {
      priority = Math.round(Math.log10(Math.max(1, f.metrics.lengthMeters)) * 20);
    } else if (f.metrics && f.metrics.areaSquareMeters) {
      priority = Math.round(Math.log10(Math.max(1, f.metrics.areaSquareMeters)) * 15);
    }
    if (f.geojson && f.geojson.properties && f.geojson.properties._derivedKind === 'buffer') priority -= 5;
    return priority;
  }

  function ringExteriorPointAwayFrom(geojson, awayFromLngLat) {
    const geom = geojson.geometry;
    if (!geom || geom.type !== 'Polygon') return null;
    const ring = geom.coordinates[0];
    if (!ring || ring.length < 2) return null;
    let best = null, bestScore = -Infinity;
    const step = Math.max(1, Math.floor(ring.length / 48));
    for (let i = 0; i < ring.length; i += step) {
      const c = ring[i];
      try {
        const d = turf.distance(turf.point(awayFromLngLat), turf.point(c), { units: 'meters' });
        if (d > bestScore) { bestScore = d; best = c; }
      } catch (_) {}
    }
    return best;
  }

  function findEnclosedFeature(outerF, allFeatures) {
    let outerCenter;
    try { outerCenter = turf.centroid(outerF.geojson).geometry.coordinates; } catch (_) { return null; }
    try {
      if (!turf.booleanPointInPolygon(turf.point(outerCenter), outerF.geojson)) return null;
    } catch (_) { return null; }
    let best = null, bestArea = Infinity;
    for (const inner of allFeatures) {
      if (inner.id === outerF.id) continue;
      if (!inner.geojson || !inner.geojson.geometry) continue;
      if (inner.style && inner.style.visible === false) continue;
      try {
        const ic = turf.centroid(inner.geojson).geometry.coordinates;
        if (!turf.booleanPointInPolygon(turf.point(ic), outerF.geojson)) continue;
        const area = turf.area(inner.geojson);
        if (area < bestArea) { bestArea = area; best = inner; }
      } catch (_) {}
    }
    return best;
  }

  // A dragged label stores a *relative* offset (distance + bearing from the
  // object's natural anchor), never an absolute position. That way the label
  // follows the object when it is moved or reshaped, and the offset can be
  // clamped so the label can never drift off on its own.
  function labelMaxOffsetMeters(f) {
    try {
      const bb = turf.bbox(f.geojson);
      const diag = turf.distance([bb[0], bb[1]], [bb[2], bb[3]], { units: 'meters' });
      return Math.max(25, Math.min(diag * 0.9, 400));
    } catch (_) {
      return 120;
    }
  }

  function computeLabelBaseAnchor(f, allFeatures) {
    const g = f.geojson && f.geojson.geometry;
    if (!g) return null;
    const dk = f.geojson.properties && f.geojson.properties._derivedKind;

    if (g.type === 'Point') return g.coordinates.slice();

    if (g.type === 'LineString' || g.type === 'MultiLineString') {
      try {
        const totalKm = turf.length(f.geojson, { units: 'kilometers' });
        if (totalKm > 1e-6) {
          const mid = turf.along(f.geojson, totalKm / 2, { units: 'kilometers' });
          if (mid && mid.geometry && mid.geometry.coordinates) return mid.geometry.coordinates.slice();
        }
        const coords = g.type === 'LineString'
          ? g.coordinates
          : (g.coordinates[0] && g.coordinates[0].length ? g.coordinates[0] : null);
        if (coords && coords.length) return coords[Math.floor(coords.length / 2)].slice();
      } catch (_) {}
      return null;
    }

    if (g.type === 'Polygon' || g.type === 'MultiPolygon') {
      try {
        let inner = null;
        if (dk === 'buffer' && f.geojson.properties._bufferSourceId) {
          inner = allFeatures.find(x => x.id === f.geojson.properties._bufferSourceId) || null;
        }
        if (!inner) inner = findEnclosedFeature(f, allFeatures);
        if (inner) {
          const innerC = turf.centroid(inner.geojson).geometry.coordinates;
          if (dk === 'buffer' || turf.area(f.geojson) > turf.area(inner.geojson) * 1.05) {
            const exterior = ringExteriorPointAwayFrom(f.geojson, innerC);
            if (exterior) return exterior.slice();
          }
        }
        if (dk === 'buffer') {
          const c = turf.centroid(f.geojson).geometry.coordinates;
          const exterior = ringExteriorPointAwayFrom(f.geojson, c);
          if (exterior) return exterior.slice();
        }
        const pt = turf.pointOnFeature(f.geojson);
        if (pt && pt.geometry && pt.geometry.coordinates) return pt.geometry.coordinates.slice();
      } catch (_) {}
      const c = polyCentroid(f);
      return c ? c.slice() : null;
    }
    return null;
  }

  // Legacy states stored an absolute labelAnchor. Convert it once to a
  // relative offset so those labels start following their object too.
  function migrateLabelAnchor(f, base) {
    if (!base || !f.labelAnchor || !Array.isArray(f.labelAnchor) || f.labelAnchor.length !== 2) return;
    try {
      const from = turf.point(base), to = turf.point(f.labelAnchor);
      f.labelOffset = {
        distM: turf.distance(from, to, { units: 'meters' }),
        bearing: turf.bearing(from, to),
      };
    } catch (_) {}
    delete f.labelAnchor;
  }

  function computeLabelAnchor(f, allFeatures) {
    const base = computeLabelBaseAnchor(f, allFeatures);
    if (!base) return null;
    if (f.labelAnchor) migrateLabelAnchor(f, base);
    const off = f.labelOffset;
    if (!off || !(off.distM > 0.5)) return base;
    const distM = Math.min(off.distM, labelMaxOffsetMeters(f));
    try {
      return turf.destination(turf.point(base), distM, off.bearing, { units: 'meters' })
        .geometry.coordinates.slice();
    } catch (_) {
      return base;
    }
  }

  // Label orientation, in degrees clockwise, expressed in map space so the
  // label keeps its angle relative to the ground when the map is rotated.
  function normalizeLabelRotation(deg) {
    if (!isFinite(deg)) return 0;
    let d = deg % 360;
    if (d > 180) d -= 360;
    if (d <= -180) d += 360;
    return Math.round(d * 10) / 10;
  }

  function labelRotationOf(f) {
    return f && isFinite(f.labelRotation) ? normalizeLabelRotation(f.labelRotation) : 0;
  }

  function separateLabelAnchors(items, minMeters = 55) {
    if (items.length < 2) return;
    items.sort((a, b) => b.priority - a.priority);
    for (let iter = 0; iter < 16; iter++) {
      let moved = false;
      for (let i = 0; i < items.length; i++) {
        for (let j = i + 1; j < items.length; j++) {
          let dist = 0;
          try {
            dist = turf.distance(
              turf.point(items[i].anchor), turf.point(items[j].anchor),
              { units: 'meters' }
            );
          } catch (_) { continue; }
          if (dist >= minMeters) continue;
          const pushM = (minMeters - dist) / 2 + 8;
          const iManual = !!items[i].manual;
          const jManual = !!items[j].manual;
          if (iManual && jManual) continue;
          let moveIdx = j;
          if (iManual) moveIdx = j;
          else if (jManual) moveIdx = i;
          else moveIdx = items[i].priority >= items[j].priority ? j : i;
          if (dist < 0.5) {
            const hash = String(items[moveIdx].id || moveIdx).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
            const dest = turf.destination(
              turf.point(items[moveIdx].anchor), minMeters, (hash % 8) * 45,
              { units: 'meters' }
            );
            items[moveIdx].anchor = dest.geometry.coordinates.slice();
          } else {
            const brng = turf.bearing(
              turf.point(items[moveIdx === j ? i : j].anchor),
              turf.point(items[moveIdx].anchor)
            );
            const dest = turf.destination(turf.point(items[moveIdx].anchor), pushM, brng, { units: 'meters' });
            items[moveIdx].anchor = dest.geometry.coordinates.slice();
          }
          moved = true;
        }
      }
      if (!moved) break;
    }
  }

  function buildLabelFeatures() {
    const candidates = [];
    for (const f of state.features) {
      if (!isFeatureVisible(f)) continue;
      if (f.style && f.style.showLabel === false) continue;
      const base = computeLabelBaseAnchor(f, state.features);
      if (f.labelAnchor) migrateLabelAnchor(f, base);
      const anchor = computeLabelAnchor(f, state.features);
      if (!anchor || !base) continue;
      candidates.push({
        id: f.id,
        priority: computeLabelPriority(f),
        anchor,
        base,
        rotation: labelRotationOf(f),
        manual: !!(f.labelOffset && f.labelOffset.distM > 0.5),
        name: (f.name && String(f.name).trim()) ? f.name : nameForKind(f.kind),
      });
    }
    separateLabelAnchors(candidates, 55);
    return candidates.map(c => ({
      type: 'Feature',
      id: c.id,
      geometry: { type: 'Point', coordinates: c.anchor },
      properties: { id: c.id, name: c.name, priority: c.priority, rotation: c.rotation },
    }));
  }

  /**
   * Push the label collection to the map.
   * `opts.live` is for continuous gestures (dragging or rotating a label): it
   * skips the ghost-busting rewrite, which is only needed when labels appear
   * or disappear, and would otherwise cost four setData per pointer move.
   */
  function applyLabelFeatures(labelFeatures, opts) {
    const live = !!(opts && opts.live);
    // Only *creating* the layers needs a loaded style. Guarding the whole
    // function on isStyleLoaded() silently dropped updates, because setData
    // itself makes the style report "not loaded" for a moment — so during a
    // drag every frame after the first was thrown away.
    if (!map.getSource(SRC_LABELS) || !map.getLayer('app-label')) {
      if (!map.isStyleLoaded()) return false;
      try { installAppLayers(); } catch (_) { return false; }
    }
    try {
      const src = map.getSource(SRC_LABELS);
      if (!src) return false;
      const list = labelFeatures || [];
      if (live) {
        src.setData({ type: 'FeatureCollection', features: list });
        map.triggerRepaint();
        return true;
      }
      // Double-empty + next-frame rewrite: kills MapLibre symbol ghosts on
      // mobile after delete (especially when feature ids are reused).
      src.setData({ type: 'FeatureCollection', features: [] });
      src.setData({ type: 'FeatureCollection', features: list });
      try { raiseLabelLayers(); } catch (_) {}
      map.triggerRepaint();
      requestAnimationFrame(() => {
        try {
          const s2 = map.getSource(SRC_LABELS);
          if (!s2) return;
          // Reuse the list we were given: rebuilding here doubled the work
          // and, worse, buildLabelFeatures migrates legacy labelAnchor values,
          // so a render pass quietly mutated persisted state.
          s2.setData({ type: 'FeatureCollection', features: [] });
          s2.setData({ type: 'FeatureCollection', features: list });
          map.triggerRepaint();
        } catch (_) {}
      });
      return true;
    } catch (err) {
      log.warn('[HydraulicGIS] applyLabelFeatures failed:', err);
      return false;
    }
  }

  /** Hard wipe of every label overlay (symbol layer + move/rotate handles). */
  function purgeAllLabelOverlays() {
    clearLabelHandleMarkers();
    try {
      const hs = map.getSource('app-label-handles');
      if (hs) hs.setData({ type: 'FeatureCollection', features: [] });
    } catch (_) {}
    try {
      const src = map.getSource(SRC_LABELS);
      if (src) src.setData({ type: 'FeatureCollection', features: [] });
    } catch (_) {}
    try { map.triggerRepaint(); } catch (_) {}
  }

  /* ─── Label drag (edit mode) ─────────────────────────────────────────── */
  let _labelDrag = { active: false, featureId: null, pointerId: null };
  let _labelEditInstalled = false;

  function isEditModeActive() {
    const eb = document.getElementById('hgis-edit-btn');
    return !!(eb && eb.classList.contains('active'));
  }

  function ensureLabelHandleLayer() {
    if (!map.isStyleLoaded()) return;
    if (!map.getSource('app-label-handles')) {
      map.addSource('app-label-handles', {
        type: 'geojson', data: { type: 'FeatureCollection', features: [] },
      });
    }
    if (!map.getLayer('app-label-handles-circle')) {
      map.addLayer({
        id: 'app-label-handles-circle', type: 'circle', source: 'app-label-handles',
        paint: {
          'circle-radius': 8,
          'circle-color': '#fbc412',
          'circle-stroke-color': '#0b0f14',
          'circle-stroke-width': 2,
        },
      });
    }
  }

  function clearLabelHandleMarkers() {
    labelHandleMarkers.forEach(m => { try { m.remove(); } catch (_) {} });
    labelHandleMarkers.clear();
  }

  function restoreGeomEditAfterLabelDrag() {
    if (!isEditModeActive()) return;
    try {
      const td2 = drawControl && drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();
      if (!td2) return;
      const firstId = state.selectedIds[0];
      const ours = state.features.find(f => f.id === firstId);
      if (ours && ours.geojson && ours.geojson.properties && ours.geojson.properties._terraId
          && !isDerivedFeature(ours)) {
        setSelectEditFlags(td2, true);
        td2.setMode('select');
        try { td2.selectFeature(ours.geojson.properties._terraId); } catch (_) {}
      }
    } catch (_) {}
  }

  const LABEL_MOVE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
    + '<path d="M12 2v20M2 12h20M12 2L9 5m3-3l3 3M12 22l-3-3m3 3l3-3M2 12l3-3m-3 3l3 3M22 12l-3-3m3 3l-3 3"'
    + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
