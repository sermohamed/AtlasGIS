      // Boost vertex point size. Layers are 'td-point', 'td-linestring',
      // 'td-polygon', 'td-polygon-outline' (confirmed from the bundled UMD).
      // The default circle-radius reads ["get","pointWidth"] from properties,
      // so a constant override here is fine.
      function boostTerraDrawPointSize() {
        try {
          if (map.getLayer('td-point')) {
            map.setPaintProperty('td-point', 'circle-radius', 8);
          }
        } catch (_) {}
      }
      addDrawListener(map, 'styledata', () => requestAnimationFrame(boostTerraDrawPointSize));

      // Detect degenerate first-tap geometry from a terra-draw snapshot.
      // Returns the coordinate to mark, or null if no degenerate feature is
      // found (i.e. drawing has progressed past the first tap, or no draw
      // is in progress).
      function detectFirstVertexCoord(snapshot) {
        if (!snapshot || !snapshot.length) return null;
        const nearEq = (a, b) => !!(a && b
          && Math.abs(a[0] - b[0]) < 1e-9
          && Math.abs(a[1] - b[1]) < 1e-9);
        for (const f of snapshot) {
          if (!f || !f.geometry || !f.properties) continue;
          // Skip features already committed to our store.
          if (f.id != null && state.features.some(sf =>
            sf.geojson && sf.geojson.properties
            && terraIdMatch(sf.geojson.properties._terraId, f.id))) continue;
          const mode = f.properties.mode;
          const g = f.geometry;
          // Point mode: show the placed point immediately while finish runs.
          if ((mode === 'point' || g.type === 'Point') && g.type === 'Point'
              && g.coordinates && g.coordinates.length >= 2) {
            return g.coordinates.slice(0, 2);
          }
          // Linestring degenerate: 2 coords, both identical (or nearly)
          if (mode === 'linestring' && g.type === 'LineString'
              && g.coordinates && g.coordinates.length === 2) {
            const a = g.coordinates[0], b = g.coordinates[1];
            if (nearEq(a, b)) return a.slice();
          }
          // Also show first vertex while a short/in-progress line has only
          // one unique coordinate (some builds keep length > 2 with duplicates).
          if (mode === 'linestring' && g.type === 'LineString'
              && g.coordinates && g.coordinates.length >= 2) {
            const a = g.coordinates[0];
            const hasDistinct = g.coordinates.some(p => !nearEq(p, a));
            if (!hasDistinct && a) return a.slice();
          }
          // Polygon / rectangle degenerate: ring of identical coords
          if ((mode === 'polygon' || mode === 'rectangle') && g.type === 'Polygon'
              && g.coordinates && g.coordinates[0]
              && g.coordinates[0].length >= 3) {
            const ring = g.coordinates[0];
            const a = ring[0];
            if (a && ring.every(p => nearEq(p, a))) return a.slice();
          }
          // Circle: tiny seed circle at first tap
          if (mode === 'circle' && g.type === 'Polygon'
              && g.coordinates && g.coordinates[0]
              && g.coordinates[0].length > 2) {
            const ring = g.coordinates[0];
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const p of ring) {
              if (!p) continue;
              if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
              if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
            }
            if (maxX - minX < 1e-4 && maxY - minY < 1e-4) {
              return [(minX + maxX) / 2, (minY + maxY) / 2];
            }
          }
        }
        return null;
      }

      // ─── Rectangle/Circle 2nd-tap fix on mobile ────────────────────────
      //
      // Background: terra-draw's rectangle and circle modes both close the
      // shape on the second click but only stretch the geometry to the tap
      // location IF onMouseMove() was called between the two taps. On a
      // touch device there is no hover event between two taps, so the second
      // tap closes the shape with a degenerate (1cm) geometry — unusable.
      //
      // Fix: register a capture-phase pointerdown listener on the map canvas
      // that fires BEFORE terra-draw's own pointerdown handler. When a draw
      // is already in progress in rectangle/circle mode, we synthesise the
      // missing onMouseMove call by invoking td._mode.onMouseMove() with a
      // freshly-built draw event at the tap location. This convinces the
      // mode that the cursor moved to the tap point, so when terra-draw then
      // processes the click, the shape is closed at the correct geometry.
      //
      // We use private API (td._mode) because there is no public equivalent
      // in this version of the wrapper. If the bundle is upgraded and the
      // private field is renamed, the try/catch keeps things safe — worst
      // case the bug returns, but nothing crashes.
      function isDrawInProgress(modeName) {
        try {
          const snap = td.getSnapshot ? td.getSnapshot() : [];
          return snap.some(f => f && f.properties && f.properties.mode === modeName);
        } catch (_) { return false; }
      }
      function buildDrawEvent(lngLat, point) {
        return {
          lng: lngLat.lng,
          lat: lngLat.lat,
          containerX: point.x,
          containerY: point.y,
          button: 'left',
          heldKeys: []
        };
      }
      function injectSyntheticMouseMove(lngLat, point) {
        try {
          if (!td || !td._mode || typeof td._mode.onMouseMove !== 'function') return;
          const evt = buildDrawEvent(lngLat, point);
          td._mode.onMouseMove(evt);
        } catch (err) {
          log.warn('[HydraulicGIS] synthetic onMouseMove failed (private API):', err);
        }
      }

      const td = drawControl.getTerraDrawInstance && drawControl.getTerraDrawInstance();

      // Use map.on('click', ...) — fires AFTER MapLibre internal handling but
      // BEFORE the user actually sees the result, and we can call onMouseMove
      // synchronously before terra-draw's click handler runs through its own
      // path. However terra-draw listens to pointerdown directly on the canvas,
      // so map.on('click') is too late. We instead use a capture-phase
      // pointerdown on the canvas itself.
      const mapCanvas = map.getCanvas();
      addDrawListener(mapCanvas, 'pointerdown', (ev) => {
        try {
          if (!ev.isPrimary) return;
          const mode = td && td.getMode && td.getMode();
          const rect = mapCanvas.getBoundingClientRect();
          const cx = ev.clientX - rect.left;
          const cy = ev.clientY - rect.top;
          const lngLat = map.unproject([cx, cy]);
          // Immediate first-tap feedback for all draw modes (mobile has no
          // hover, and terra-draw's degenerate geometry is invisible).
          const drawModes = ['point', 'linestring', 'polygon', 'rectangle', 'circle'];
          if (drawModes.includes(mode) && !isDrawInProgress(mode)) {
            setFirstVertex([lngLat.lng, lngLat.lat]);
            try {
              ensureDrawPreviewLayers();
              const src = map.getSource(DRAW_PREVIEW_SRC);
              if (src) {
                src.setData({
                  type: 'FeatureCollection',
                  features: [{
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [lngLat.lng, lngLat.lat] },
                    properties: {},
                  }],
                });
                raiseDrawPreviewLayers();
              }
            } catch (_) {}
          }
          if (mode !== 'rectangle' && mode !== 'circle') return;
          if (!isDrawInProgress(mode)) return;  // 1st tap → let terra-draw create
          // 2nd tap during rectangle/circle: inject the missing pointermove.
          injectSyntheticMouseMove(lngLat, { x: cx, y: cy });
        } catch (_) {}
      }, true);  // capture phase — runs BEFORE terra-draw's own listener

      addDrawListener(map, 'mousemove', () => {
        try { syncDrawPreview(); } catch (_) {}
      });

      if (td && typeof td.on === 'function') {

        td.on('change', (ids, type) => {
          // Re-apply vertex size boost on every change — td-point may have
          // just been created by terra-draw's lazy layer-add.
          boostTerraDrawPointSize();
          syncDrawPreview();

          // ── Mobile first-vertex overlay logic ──
          // Inspect terra-draw's snapshot. If a degenerate (zero-size)
          // linestring/polygon is in progress, show our overlay marker.
          // Once the user taps a second time, terra-draw's own vertex point
          // appears in the snapshot → we remove our overlay.
          try {
            const snap = td.getSnapshot ? td.getSnapshot() : [];
            const firstVtx = detectFirstVertexCoord(snap);
            if (firstVtx) {
              setFirstVertex(firstVtx);
            } else {
              clearFirstVertex();
            }
          } catch (_) { clearFirstVertex(); }

          // Defensive repaint cascade (kept from previous attempt — harmless
          // and helps in tab-throttling scenarios on iOS Safari).
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              try { map.triggerRepaint(); } catch (_) {}
              boostTerraDrawPointSize();
            });
          });
          setTimeout(() => { try { map.triggerRepaint(); } catch (_) {} }, 50);

          try { drawControl.toggleButtonsWhenNoFeature(); } catch (_) {}
          updateHud(`change ${type} (${ids ? ids.length : 0})`);
        });

        const forceYellowHalo = () => {
          try { if (typeof syncSelectionHighlight === 'function') syncSelectionHighlight(); } catch (_) {}
          try {
            if (map.getLayer('app-selection-fill')) map.moveLayer('app-selection-fill');
            if (map.getLayer('app-selection-line')) map.moveLayer('app-selection-line');
            if (map.getLayer('app-selection-point')) map.moveLayer('app-selection-point');
            raiseLabelLayers();
          } catch (_) {}
          try { map.triggerRepaint(); } catch (_) {}
        };
        const refreshLabelsNow = () => {
          try { if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap(); } catch (_) {}
          requestAnimationFrame(() => { try { if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap(); } catch (_) {} });
          setTimeout(() => { try { if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap(); } catch (_) {} }, 0);
        };
        const suppressNativeBlueHalo = () => {
          try {
            // While Edit is active the feature MUST stay selected in TerraDraw so
            // its vertices remain interactive/draggable. Deselecting here is what
            // made vertices show but be un-draggable — so bail out during edit.
            const _eb = document.getElementById('hgis-edit-btn');
            if (_eb && _eb.classList.contains('active')) return;
            if (!td || typeof td.deselect !== 'function') return;
            try { td.deselect(); } catch (_) {}
            requestAnimationFrame(() => { try { td.deselect(); } catch (_) {} });
            setTimeout(() => { try { td.deselect(); } catch (_) {} }, 0);
            setTimeout(() => { try { td.deselect(); } catch (_) {} }, 32);
            setTimeout(() => { try { td.deselect(); } catch (_) {} }, 96);
            setTimeout(() => { try { td.deselect(); } catch (_) {} }, 180);
            setTimeout(() => { try { td.deselect(); } catch (_) {} }, 300);
          } catch (_) {}
        };
        const enforceYellowSelection = () => {
          // While Edit is active, do NOTHING: this function disables the
          // draggable-vertex flags and clears TerraDraw selection, which is
          // exactly what broke vertex dragging (every tap on a vertex fired it).
          const _eb = document.getElementById('hgis-edit-btn');
          if (_eb && _eb.classList.contains('active')) return;
          try { setSelectEditFlags(td, false); } catch (_) {}
          suppressNativeBlueHalo();
          forceYellowHalo();
        };

        let _promptedTerraIdsFallback = new Set();
        const findStoreFeatureByTerraIdFallback = (terraId) => state.features.find(f =>
          f.geojson && f.geojson.properties && terraIdMatch(f.geojson.properties._terraId, terraId));
        const findTdSnapshotFeatureFallback = (snapshot, terraId) =>
          (snapshot || []).find(x => terraIdMatch(x.id, terraId));
        const createStoreFeatureFromTdFallback = (terraId, tdFeature, ctxMode) => {
          const mode = (tdFeature.properties && tdFeature.properties.mode) || ctxMode || '';
          const kind = kindFromGeom(tdFeature.geometry, mode);
          const newF = addFeature({
            type: 'Feature',
            geometry: tdFeature.geometry,
            properties: { _terraId: terraId },
          }, kind);
          selectFeature(newF.id, { additive: false });
          if (kind === 'point') {
            detachPointFromTerraDraw(newF);
            try { syncDerivedLayer(); } catch (_) {}
            // Extra frames: ensure the circle is painted after detach + style settle.
            requestAnimationFrame(() => { try { syncDerivedLayer(); map.triggerRepaint(); } catch (_) {} });
            setTimeout(() => { try { syncDerivedLayer(); map.triggerRepaint(); } catch (_) {} }, 50);
          }
          const tidKey = (terraId == null) ? String(newF.id) : String(terraId);
          if (!_promptedTerraIdsFallback.has(tidKey)) {
            _promptedTerraIdsFallback.add(tidKey);
            promptFeatureName(newF.id);
          }
          refreshLabelsNow();
          forceYellowHalo();
          return newF;
        };
        const isCompletedTdFeatureFallback = (tdFeature) => {
          if (!tdFeature || !tdFeature.geometry) return false;
          const mode = (tdFeature.properties && tdFeature.properties.mode) || '';
          const g = tdFeature.geometry;
          if (mode === 'point') return g.type === 'Point';
          if (g.type === 'LineString') {
            if (!Array.isArray(g.coordinates) || g.coordinates.length < 2) return false;
            const a = g.coordinates[0];
            return g.coordinates.some(p => p && a && (p[0] !== a[0] || p[1] !== a[1]));
          }
          if (g.type === 'Polygon') {
            if (!Array.isArray(g.coordinates) || !Array.isArray(g.coordinates[0]) || g.coordinates[0].length < 4) return false;
            const ring = g.coordinates[0];
            const first = ring[0];
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const p of ring) {
              if (!p) continue;
              if (p[0] < minX) minX = p[0];
              if (p[1] < minY) minY = p[1];
              if (p[0] > maxX) maxX = p[0];
              if (p[1] > maxY) maxY = p[1];
            }
            // Circle mode starts with a tiny seed polygon after first tap.
            // Ignore that seed so the naming popup appears only after finish.
            if (mode === 'circle') {
              const areaSeed = Math.abs((maxX - minX) * (maxY - minY));
              if (areaSeed < 1e-8) return false;
            }
            const spreadOk = (maxX - minX) > 1e-10 || (maxY - minY) > 1e-10;
            const notAllSame = ring.some(p => p && first && (p[0] !== first[0] || p[1] !== first[1]));
            return spreadOk && notAllSame;
          }
          return false;
        };

        const USE_TD_ADAPTERS = false;
        try {
          if (USE_TD_ADAPTERS && typeof HGISWireTerraDrawAdapter === 'function') {
            HGISWireTerraDrawAdapter({
              td,
              state,
              log,
              hudLog,
              terraIdMatch,
              kindFromGeom,
              addFeature,
              removeFeature,
              selectFeature,
              promptFeatureName,
              computeMetrics,
              notifyFeatures,
              clearFirstVertex,
              triggerRepaint: () => { try { map.triggerRepaint(); } catch (_) {} },
              toggleButtonsWhenNoFeature: () => { try { drawControl.toggleButtonsWhenNoFeature(); } catch (_) {} },
              ensureStaticMode: () => { try { if (td && typeof td.setMode === 'function') td.setMode('static'); } catch (_) {} },
              forceYellowHalo,
              ignoreTdSelect: false,
              isMultiSelectMode: () => state.multiSelectMode === true,
              isEditActive: () => {
                const eb = document.getElementById('hgis-edit-btn');
                return !!(eb && eb.classList.contains('active'));
              },
            });
          } else {
            log.warn('[HydraulicGIS] HGISWireTerraDrawAdapter unavailable, fallback handlers active.');
          }
        } catch (err) {
          log.warn('[HydraulicGIS] adapter wiring failed, fallback handlers active:', err);
        }

        try {
          if (USE_TD_ADAPTERS && typeof HGISWireSelectionAdapter === 'function') {
            HGISWireSelectionAdapter({
              map,
              td,
              state,
              log,
              terraIdMatch,
              notifyUi,
              selectFeature,
              forceYellowHalo,
            });
          } else {
            log.warn('[HydraulicGIS] HGISWireSelectionAdapter unavailable, fallback handlers active.');
          }
        } catch (err) {
          log.warn('[HydraulicGIS] selection adapter wiring failed, fallback handlers active:', err);
        }

        // Fallback handlers (kept intentionally redundant for cross-device robustness).
        td.on('finish', (id, ctx) => {
          clearDrawPreview();
          clearFirstVertex();
          try {
            const snap = td.getSnapshot ? td.getSnapshot() : [];
            const tf = findTdSnapshotFeatureFallback(snap, id);
            if (!tf) return;
            const existing = findStoreFeatureByTerraIdFallback(id);
            if (existing) {
              existing.geojson.geometry = tf.geometry;
              existing.metrics = computeMetrics(existing.geojson, existing.kind);
              existing.updatedAt = Date.now();
              if (existing.kind === 'point') {
                detachPointFromTerraDraw(existing);
                try { syncDerivedLayer(); } catch (_) {}
              }
              notifyFeatures();
              // If a feature was created from a change event path before finish,
              // still ensure the naming prompt appears once at completion.
              const tidKey = String(id);
              if (!_promptedTerraIdsFallback.has(tidKey)) {
                _promptedTerraIdsFallback.add(tidKey);
                promptFeatureName(existing.id);
              }
              refreshLabelsNow();
              forceYellowHalo();
              return;
            }
            createStoreFeatureFromTdFallback(id, tf, ctx && ctx.mode);
          } catch (err) {
            // This is the only path that turns a finished terra-draw shape
            // into a store row. Swallowing it left the shape on screen while
            // it was absent from Calques, unnamed, unsaved and gone on reload.
            log.error('[HydraulicGIS] finish handler failed:', err);
            ui.confirm(
              'Objet non enregistré',
              "Le tracé n'a pas pu être enregistré. Réessayez ; si le problème persiste, rechargez la page.",
              () => {}
            );
          }
        });

        // Keep app selection state in sync with the native arrow select path,
        // then immediately suppress TerraDraw's blue highlight.
        td.on('select', (terraId) => {
          try {
            const ours = findStoreFeatureByTerraIdFallback(terraId);
            if (ours) {
              selectFeature(ours.id, { additive: state.multiSelectMode });
            }
            enforceYellowSelection();
          } catch (_) {}
        });

        td.on('change', (ids, type) => {
          try {
            if (type === 'delete') {
              const banTerraIds = new Set(
                (ids || [])
                  .map(String)
                  .filter(id => !detachedTerraIds.has(id))
              );
              if (!banTerraIds.size) return;
              const toRemove = state.features
                .filter(f => f.geojson && f.geojson.properties && banTerraIds.has(String(f.geojson.properties._terraId)))
                .map(f => f.id);
              toRemove.forEach(removeFeature);
              return;
            }
            if (type !== 'create' && type !== 'update') return;
            const snap = td.getSnapshot ? td.getSnapshot() : [];
            let touched = 0;
            for (const tid of (ids || [])) {
              const tf = findTdSnapshotFeatureFallback(snap, tid);
              if (!tf) continue;
              const ours = findStoreFeatureByTerraIdFallback(tid);
              if (ours) {
                // Per-feature guard: one malformed row must not abort the
                // whole batch and silently drop everyone else's edit.
                try {
                  ours.geojson.geometry = tf.geometry;
                  ours.metrics = computeMetrics({ type: 'Feature', geometry: tf.geometry }, ours.kind);
                  ours.updatedAt = Date.now();
                  // The cached elevation profile belongs to the old geometry.
                  elevationCache.delete(ours.id);
                  touched++;
                } catch (err) {
                  log.error('[HydraulicGIS] geometry sync failed for', ours.id, err);
                }
                continue;
              }
              // Do not create store rows from change/create. We only create on finish
              // so naming popup timing is stable across point/line/polygon/circle.
            }
            if (touched) {
              notifyFeatures();
              forceYellowHalo();
            }
          } catch (err) {
            log.error('[HydraulicGIS] change handler failed:', err);
          }
        });

        // Backup pointerup/click selection path for all device types.
        (function installSelectionFallback() {
          // Robust GEOMETRIC hit-test against our own feature store. This does
          // NOT rely on TerraDraw layer names or internal ids (which were not
          // matching, so map-tap selection never resolved). We project the
          // feature geometry to screen pixels and test proximity to the tap.
          const POINT_PX = 18;   // tap tolerance for points
          const LINE_PX = 12;    // tap tolerance for lines
          const pxDistToSegment = (p, a, b) => {
            const vx = b.x - a.x, vy = b.y - a.y;
            const wx = p.x - a.x, wy = p.y - a.y;
            const len2 = vx * vx + vy * vy;
            let t = len2 > 0 ? (wx * vx + wy * vy) / len2 : 0;
            t = Math.max(0, Math.min(1, t));
            const cx = a.x + t * vx, cy = a.y + t * vy;
            const dx = p.x - cx, dy = p.y - cy;
            return Math.sqrt(dx * dx + dy * dy);
          };
          const minPxDistToLine = (coordsArrays, tapPx) => {
            let best = Infinity;
            for (const line of coordsArrays) {
              for (let i = 0; i < line.length - 1; i++) {
                const a = map.project(line[i]);
                const b = map.project(line[i + 1]);
                const d = pxDistToSegment(tapPx, a, b);
                if (d < best) best = d;
              }
            }
            return best;
          };
          const resolveOurIds = (point) => {
            const tapPx = { x: point.x, y: point.y };
            let tapLngLat = null;
            try { const ll = map.unproject([point.x, point.y]); tapLngLat = [ll.lng, ll.lat]; } catch (_) {}
            const hits = [];
            for (const f of state.features) {
              if (!f || !f.geojson || !f.geojson.geometry) continue;
              if (f.style && f.style.visible === false) continue;
              const g = f.geojson.geometry;
              try {
                if (g.type === 'Polygon' || g.type === 'MultiPolygon') {
                  if (tapLngLat && turf.booleanPointInPolygon(turf.point(tapLngLat), f.geojson)) {
                    hits.push(f.id);
                  }
                } else if (g.type === 'LineString') {
                  if (minPxDistToLine([g.coordinates], tapPx) <= LINE_PX) hits.push(f.id);
                } else if (g.type === 'MultiLineString') {
                  if (minPxDistToLine(g.coordinates, tapPx) <= LINE_PX) hits.push(f.id);
                } else if (g.type === 'Point') {
                  const p = map.project(g.coordinates);
                  const dx = p.x - tapPx.x, dy = p.y - tapPx.y;
                  if (Math.sqrt(dx * dx + dy * dy) <= POINT_PX) hits.push(f.id);
                }
              } catch (_) {}
            }
            // Topmost first (features drawn later render on top).
            hits.reverse();
            return hits;
          };
          const applyPick = (point) => {
            let mode = 'static';
            try {
              if (td && typeof td.getMode === 'function') {
                const m = td.getMode();
                if (m) mode = m;
              }
            } catch (_) {}
            // Some TerraDraw builds report mode inconsistently on mobile.
            // Allow select picking when select button is visibly active.
            const selectBtnActive = !!document.querySelector('.maplibregl-terradraw-add-select-button.active');
            const drawingNow = !!mode && mode !== 'static' && mode !== 'select';
            const selectionModeLike = !drawingNow && (state.selectActive === true || mode === 'select' || selectBtnActive);
            if (!selectionModeLike) return;
            const ourIds = resolveOurIds(point);
            if (ourIds.length === 0) {
              if (!state.multiSelectMode && state.selectedIds.length > 0) {
                state.selectedIds = [];
                notifyUi();
                forceYellowHalo();
              }
              return;
            }
            selectFeature(ourIds[0], { additive: state.multiSelectMode });
            // Keep app yellow halo as the sole selection cue.
            enforceYellowSelection();
          };

          const canvas = map.getCanvas();
          let down = null;
          let suppressClick = false;
          addDrawListener(canvas, 'pointerdown', (ev) => {
            if (!ev.isPrimary) return;
            down = { x: ev.clientX, y: ev.clientY };
          }, true);
          addDrawListener(canvas, 'pointerup', (ev) => {
            if (!ev.isPrimary || !down) return;
            const dx = ev.clientX - down.x;
            const dy = ev.clientY - down.y;
            down = null;
            if (Math.sqrt(dx * dx + dy * dy) > 8) return;
            try {
              const rect = canvas.getBoundingClientRect();
              applyPick({ x: ev.clientX - rect.left, y: ev.clientY - rect.top });
              suppressClick = true;
              setTimeout(() => { suppressClick = false; }, 250);
            } catch (_) {}
          }, true);
          addDrawListener(map, 'click', (e) => {
            if (suppressClick) return;
            applyPick(e.point);
          });
        })();

        // Bridge native "delete-selection" button to the app's selectedIds,
        // because we intentionally suppress TerraDraw's native blue selection.
        if (!window.__hgisDeleteSelectionBridgeInstalled) {
          window.__hgisDeleteSelectionBridgeInstalled = true;
          document.addEventListener('click', (ev) => {
            const btn = ev.target && ev.target.closest && ev.target.closest('.maplibregl-terradraw-delete-selection-button');
            if (!btn) return;
            if (!state.selectedIds || state.selectedIds.length === 0) return;
            ev.preventDefault();
            ev.stopPropagation();
            const toDelete = state.selectedIds.slice();
            toDelete.forEach(removeFeature);
            state.selectedIds = [];
            notifyUi();
            enforceYellowSelection();
          }, true);
        }
        // Keep the yellow halo on top whenever selection is active.
        addDrawListener(map, 'click', () => {
          try {
            if (state.selectActive === true) enforceYellowSelection();
          } catch (_) {}
        });
      } else {
        log.warn('[HydraulicGIS] td.on is not a function — events disabled.');
      }

      HGISWireModeAdapter({
        td,
        hudLog,
        setDoubleClickZoom,
        clearFirstVertex,
        onModeChanged: (cb) => {
          if (typeof drawControl.on === 'function') drawControl.on('mode-changed', cb);
        },
        resetSelectEditFlags: () => {
          try { setSelectEditFlags(td, false); } catch (_) {}
          const eb = document.getElementById('hgis-edit-btn');
          if (eb) eb.classList.remove('active');
        },
      });
    } catch (e) {
      log.error('[HydraulicGIS] Échec d\'initialisation de terra-draw :', e);
      drawControl = null;
    }
  }

  function updateBasemapUi() {
    document.querySelectorAll('#basemap-menu .basemap-option[data-basemap]').forEach(b => {
      b.classList.toggle('active', b.dataset.basemap === state.basemap);
    });
    const toggle = document.getElementById('basemap-toggle');
    if (toggle) toggle.classList.toggle('active', state.basemap !== 'hybrid');
  }

  function initBasemapUi() {
    const picker = document.getElementById('basemap-picker');
    const toggle = document.getElementById('basemap-toggle');
    if (!picker || !toggle) return;

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = picker.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    document.addEventListener('click', () => {
      picker.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    });
    picker.addEventListener('click', (e) => e.stopPropagation());

    document.querySelectorAll('#basemap-menu .basemap-option[data-basemap]').forEach(btn => {
      btn.addEventListener('click', () => {
        setBasemap(btn.dataset.basemap);
        picker.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });

    updateBasemapUi();
  }

  function setBasemap(id) {
    if (!BASEMAPS[id] || state.basemap === id) return;
    state.basemap = id;
    try { localStorage.setItem('hydraulic-gis:basemap', id); } catch (e) {}

    resetDrawUi();

    map.setStyle(BASEMAPS[id]);
    // setStyle wipes every custom source and layer. 'idle' and 'style.load'
    // are unreliable here (raster basemaps can leave the map non-idle
    // indefinitely, and style.load only fires for the initial style), which
    // silently left the map with no overlays at all — drawings, labels,
    // buffers and contours all vanished until a reload. 'styledata' always
    // fires, so drive the rebuild from there.
    onStyleReady(() => {
      map.setMaxZoom(isEsriRasterBasemap(id) ? SATELLITE_MAX_ZOOM : 19);
      reinstallMapOverlays();
    });

    updateBasemapUi();
  }

  // Run cb once the current style is usable. Retries on every styledata
  // event and keeps a timer as a last resort.
  function onStyleReady(cb) {
    let done = false;
    const run = () => {
      if (done || !map.isStyleLoaded()) return;
      done = true;
      map.off('styledata', run);
      try { cb(); } catch (e) { log.error('[HydraulicGIS] onStyleReady failed:', e); }
    };
    map.on('styledata', run);
    const deadline = Date.now() + 15000;
    const poll = () => {
      if (done) return;
      run();
      if (!done && Date.now() < deadline) setTimeout(poll, 200);
    };
    setTimeout(poll, 50);
  }

  // Rebuild every app-owned source/layer plus terra-draw. Every step is
  // idempotent so this is safe to call more than once.
  function reinstallMapOverlays() {
    const steps = [
      installAppLayers,
      ensureDerivedLayers,
      ensureContourLabelsLayer,
      installDrawControl,
      mountDrawDefaultsInToolbar,
      restorePersistedMapState,
      syncDerivedLayer,
      syncContourLabelsFromStore,
      syncFeaturesToMap,
      syncSelectionHighlight,
      syncLabelHandles,
      updateGrid,
    ];
    for (const step of steps) {
      try { step(); } catch (e) { log.warn('[HydraulicGIS] reinstall step failed:', step.name, e); }
    }
    try { map.triggerRepaint(); } catch (_) {}
  }

  map.on('error', (e) => {
    log.error('[HydraulicGIS] MapLibre error:', e && e.error ? e.error : e);
  });

  map.once('load', () => {
    installAppLayers();
    installDrawControl();
    initDrawDefaultsUi();
    restorePersistedMapState();
    updateGrid();
    installLabelDragHandlers();
    requestAnimationFrame(() => restorePersistedMapState());
    setTimeout(() => restorePersistedMapState(), 300);
    map.once('idle', () => restorePersistedMapState());
  });

  onFeatures(syncFeaturesToMap);

  // Refresh grid (and any other view-bound layers) when the map moves.
  // Live grid update: listen to 'move' (fires continuously during pan/zoom,
  // including pinch-zoom on touch) instead of 'moveend' so the grid stays
  // glued to the current viewport. Throttled via rAF so we never run more
  // than once per frame, keeping perf smooth on mobile.
  let _gridUpdateRafQueued = false;
  function scheduleGridUpdate() {
    if (!gridState.enabled) return;
    if (_gridUpdateRafQueued) return;
    _gridUpdateRafQueued = true;
    requestAnimationFrame(() => {
      _gridUpdateRafQueued = false;
      try { updateGrid(); } catch (_) {}
    });
  }
  map.on('move', scheduleGridUpdate);
  map.on('zoom', scheduleGridUpdate);
  // Final precise update at the end of the gesture in case rAFs were
  // throttled (low-power mode) and the live updates were stale.
  map.on('moveend', () => { if (gridState.enabled) updateGrid(); });
  map.on('zoomend', () => { if (gridState.enabled) updateGrid(); });

  /* ═══ 6. UI / PANELS ════════════════════════════════════════════════════════ */
  const ui = window.ui = {
    _promptGuardUntil: 0,
    isMobile() {
      return window.matchMedia('(max-width: 1024px)').matches
          || (window.matchMedia('(pointer: coarse)').matches && window.innerWidth <= 1280);
    },
    setPanel(id) {
      if (id !== 'coordinates') { try { cancelCoordPickMode(); } catch (_) {} }
      if (id !== 'tools') { try { cancelRoutePickMode(); } catch (_) {} }
      if (state.activePanel === id) {
        state.activePanel = null;
      } else {
        state.activePanel = id;
      }
      this.render();
    },
    openMenu() {
      this.openSheet('menu');
    },
    openSheet(panelId) {
      if (panelId !== 'coordinates') { try { cancelCoordPickMode(); } catch (_) {} }
      if (panelId !== 'tools') { try { cancelRoutePickMode(); } catch (_) {} }
      state.activePanel = panelId;
      this.render();
      document.getElementById('scrim').classList.add('visible');
      document.getElementById('sheet').classList.add('visible');
    },
    closeSheet() {
      try { cancelCoordPickMode(); } catch (_) {}
      try { cancelRoutePickMode(); } catch (_) {}
      state.activePanel = null;
      document.getElementById('scrim').classList.remove('visible');
      document.getElementById('sheet').classList.remove('visible');
      this.render();
    },
    confirm(title, msg, onOk) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-msg').textContent = msg;
      const okBtn = document.getElementById('confirm-ok');
      okBtn.onclick = () => { this.closeConfirm(); onOk(); };
      document.getElementById('confirm-bg').classList.add('visible');
    },
    closeConfirm() {
      document.getElementById('confirm-bg').classList.remove('visible');
    },
    prompt(title, msg, defaultValue, onOk) {
      document.getElementById('prompt-title').textContent = title;
      document.getElementById('prompt-msg').textContent = msg;
      const input = document.getElementById('prompt-input');
      input.value = defaultValue || '';
      const okBtn = document.getElementById('prompt-ok');
      const onSubmit = () => {
        const v = input.value.trim();
        this.closePrompt(true);
        if (typeof onOk === 'function') onOk(v);
        // Keep labels/live map state synced immediately after naming.
        try { if (typeof syncFeaturesToMap === 'function') syncFeaturesToMap(); } catch (_) {}
        try { map.triggerRepaint(); } catch (_) {}
      };
      okBtn.onclick = onSubmit;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); onSubmit(); }
        else if (e.key === 'Escape') { this.closePrompt(true); }
      };
      // Guard against synthetic trailing taps right after drawing on mobile.
      this._promptGuardUntil = Date.now() + 320;
      document.getElementById('prompt-bg').classList.add('visible');
      // Defer focus + select-all so iOS shows the keyboard.
      // On iOS Safari, keyboard only opens from a direct user-gesture handler.
      // We use a short chain: make visible first, then focus with slight delay.
      setTimeout(() => {
        try {
          input.focus();
          input.select();
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (_) {}
      }, 80);
    },
    closePrompt(force = false) {
      if (!force && Date.now() < (this._promptGuardUntil || 0)) return;
      document.getElementById('prompt-bg').classList.remove('visible');
      const input = document.getElementById('prompt-input');
      if (input) input.onkeydown = null;
    },
    render() {
      // Update rail
      document.querySelectorAll('.rail-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.panel === state.activePanel);
      });

      // Layer count badge
      const count = state.features.length;
      const railBadge = document.getElementById('rail-badge-layers');
      const fabBadge = document.getElementById('fab-badge');
      if (count > 0) {
        railBadge.textContent = count; railBadge.style.display = 'flex';
        fabBadge.textContent = count; fabBadge.classList.add('visible');
      } else {
        railBadge.style.display = 'none';
        fabBadge.classList.remove('visible');
      }

      // If the user is actively typing in a TEXT input INSIDE the panel,
      // skip the panel innerHTML rewrite — it would destroy the focused
      // element mid-typing. For slider/color inputs (range, color), we
      // also skip while they're being dragged because the next mousemove
      // would land on the new (replaced) DOM and lose the gesture.
      // For all other cases (e.g. selection change while no input is
      // focused), we DO re-render so the panel reflects the new selection.
      const panelEl = document.getElementById('panel-body');
      const sheetEl = document.getElementById('sheet-body');
      const af = document.activeElement;
      const isLiveInput = af && /^(INPUT|SELECT|TEXTAREA)$/.test(af.tagName)
        && !af.matches('[type="checkbox"], [type="radio"]'); // checkboxes are fine to re-render
      const skipPanelBody = state.activePanel !== 'layers'
        && panelEl && af && panelEl.contains(af) && isLiveInput;
      const skipSheetBody = state.activePanel !== 'layers'
        && sheetEl && af && sheetEl.contains(af) && isLiveInput;

      // Only ONE of the two containers may hold the panel markup at a time.
      // Rendering into both duplicated every element id (#cc-a, #files-status,
      // #cn-result…), so getElementById resolved to whichever copy came first
      // in the DOM — often the hidden one, and the user saw no feedback.
      const mobile = this.isMobile();

      // Render desktop panel
      if (mobile) {
        document.getElementById('sidebar-panel').classList.remove('visible');
        if (panelEl) panelEl.innerHTML = '';
      } else {
        if (state.activePanel && state.activePanel !== 'menu') {
          document.getElementById('sidebar-panel').classList.add('visible');
          document.getElementById('panel-title').textContent = PANEL_TITLES[state.activePanel] || '';
          if (!skipPanelBody) renderPanel('panel-body', state.activePanel);
        } else {
          document.getElementById('sidebar-panel').classList.remove('visible');
          if (panelEl) panelEl.innerHTML = '';
        }
      }

      // Render mobile sheet
      if (state.activePanel && (mobile || state.activePanel === 'menu')) {
        const title = state.activePanel === 'menu' ? t('panel_menu') : panelTitle(state.activePanel);
        document.getElementById('sheet-title').textContent = title;
        if (!skipSheetBody) renderPanel('sheet-body', state.activePanel);
        if (mobile) {
          document.getElementById('scrim').classList.add('visible');
          document.getElementById('sheet').classList.add('visible');
        }
      } else {
        if (sheetEl) sheetEl.innerHTML = '';
        document.getElementById('scrim').classList.remove('visible');
        document.getElementById('sheet').classList.remove('visible');
      }
    },
  };
  onFeatures(() => ui.render());
  onUi(() => ui.render());

  function panelTitle(id) {
    const map = {
      layers: 'panel_layers',
      style: 'panel_style',
      measure: 'panel_measure',
      tools: 'panel_tools',
      legend: 'panel_legend',
      coordinates: 'panel_coordinates',
      search: 'panel_search',
      elevation: 'panel_elevation',
      grid: 'panel_grid',
      files: 'panel_files',
      options: 'panel_options',
      menu: 'panel_menu',
    };
    return t(map[id] || id);
  }
  // Back-compat alias used by older call sites.
  const PANEL_TITLES = new Proxy({}, { get: (_, k) => panelTitle(k) });

  function renderPanel(containerId, panelId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (panelId === 'menu') el.innerHTML = renderMenu();
    else if (panelId === 'layers') el.innerHTML = renderLayers();
    else if (panelId === 'style') el.innerHTML = renderStyle();
    else if (panelId === 'measure') { el.innerHTML = renderMeasure(); attachMeasureEvents(el); }
    else if (panelId === 'tools') el.innerHTML = renderTools();
    else if (panelId === 'legend') el.innerHTML = renderLegend();
    else if (panelId === 'coordinates') el.innerHTML = renderCoordinates();
    else if (panelId === 'search') el.innerHTML = renderSearch();
    else if (panelId === 'elevation') el.innerHTML = renderElevation();
    else if (panelId === 'grid') el.innerHTML = renderGrid();
    else if (panelId === 'files') el.innerHTML = renderFiles();
    else if (panelId === 'options') el.innerHTML = renderOptionsPanel();
    // After innerHTML, attach event listeners
    if (panelId === 'coordinates') attachCoordinatesEvents(el);
    if (panelId === 'search') attachSearchEvents(el);
    if (panelId === 'elevation') attachElevationEvents(el);
    if (panelId === 'grid') attachGridEvents(el);
    if (panelId === 'style') attachStyleEvents(el);
    if (panelId === 'layers') attachLayersEvents(el);
    if (panelId === 'files') attachFilesEvents(el);
    if (panelId === 'tools') attachToolsEvents(el);
    if (panelId === 'legend') attachLegendEvents(el);
    if (panelId === 'options') attachOptionsPanelEvents(el);
  }

  /* ═══ 7. PANEL CONTENT — MENU (mobile) ══════════════════════════════════════ */

    const items = [
      { id: 'layers', label: t('panel_layers'), icon: 'M12 3l9 5-9 5-9-5 9-5z M3 13l9 5 9-5 M3 17l9 5 9-5' },

  /* ═══ 8. PANEL CONTENT — LAYERS ═════════════════════════════════════════════ */
  function featureRowHtml(f) {
    const sel = state.selectedIds.includes(f.id);
    const metrics = f.metrics.areaSquareMeters !== undefined ? formatArea(f.metrics.areaSquareMeters)
                  : f.metrics.lengthMeters !== undefined ? formatDistance(f.metrics.lengthMeters)
                  : '';
    const derivedKind = f.geojson && f.geojson.properties && f.geojson.properties._derivedKind;
    const derivedLbl = derivedKind === 'buffer' ? 'buffer'
                     : derivedKind === 'intersection' ? 'intersection'
                     : derivedKind === 'contours' ? 'courbes'
                     : derivedKind === 'bornage' ? 'bornage'
                     : null;

      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7c2.4 0 4.4 1 6 2.2M22 12s-3.5 7-10 7c-2.4 0-4.4-1-6-2.2M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

        <button class="layer-action" data-action="group-visibility" data-gid="${g.id}" title="${anyVisible ? 'Masquer la couche' : 'Afficher la couche'}">${eyeIcon}</button>
        <button class="layer-action danger" data-action="group-delete" data-gid="${g.id}" title="Supprimer la couche (garde les objets)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>`;
  }

  function renderLayers() {
    if (state.features.length === 0 && state.groups.length === 0) {
      return `<div class="empty-state">Aucun objet sur la carte.<div class="small">Utilisez la barre de dessin en haut à gauche de la carte pour créer.</div></div>`;
    }
    // Partition features into groups + ungrouped.
    const grouped = new Map();
    const ungrouped = [];
    for (const f of state.features) {
      if (f.groupId && state.groups.some(g => g.id === f.groupId)) {
        if (!grouped.has(f.groupId)) grouped.set(f.groupId, []);
        grouped.get(f.groupId).push(f);
      } else {
        ungrouped.push(f);
      }
    }

    const selCount = state.selectedIds.length;
    const header = `
      <div class="row" style="justify-content:space-between; margin-bottom:10px; gap:8px;">
        <span style="font-size:11px; color:var(--ink-2);">${state.features.length} objet${state.features.length > 1 ? 's' : ''} · ${state.groups.length} couche${state.groups.length > 1 ? 's' : ''}</span>
        <button class="btn btn-danger" onclick="layersClearAll()">Tout effacer</button>
      </div>
      <div class="row" style="gap:8px; margin-bottom:12px;">
        <button class="btn btn-ghost" onclick="layerCreateGroup()" style="flex:1;">+ Nouvelle couche</button>
        <button class="btn btn-ghost" onclick="layerGroupSelected()" style="flex:1;" ${selCount ? '' : 'disabled'}>Grouper sélection${selCount ? ' (' + selCount + ')' : ''}</button>
      </div>`;

    let body = '';
    for (const g of state.groups) {
      const feats = grouped.get(g.id) || [];
      body += groupHeaderHtml(g, feats);
      if (!g.collapsed) {
        body += `<div class="stack-tight group-body">${feats.map(featureRowHtml).join('') || '<div class="empty-state" style="padding:8px;">Couche vide — assignez des objets ci-dessous.</div>'}</div>`;
      }
    }
    if (ungrouped.length) {
      if (state.groups.length) {
        body += `<div class="group-header-lite">Sans couche</div>`;
      }
      body += `<div class="stack-tight">${ungrouped.map(featureRowHtml).join('')}</div>`;
    }
    return header + body;
  }

  function attachLayersEvents(root) {
    // ── Layer (group) header: tap = select all, long-press = rename ──
    root.querySelectorAll('.group-name[data-gid]').forEach(btn => {
      const gid = btn.dataset.gid;
      let pressTimer = null;
      let longDone = false;
      const clearPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
      btn.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        longDone = false;
        clearPress();
        pressTimer = setTimeout(() => {
          longDone = true;
          clearPress();
          groupStartRename(gid);
        }, 550);
      });
      btn.addEventListener('pointerup', clearPress);
      btn.addEventListener('pointercancel', clearPress);
      btn.addEventListener('pointerleave', clearPress);
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (longDone) { longDone = false; e.preventDefault(); return; }
        toggleGroupSelection(gid);
      });
    });

    // ── Feature rows: tap row = toggle selection (additive multi-select) ──
    root.querySelectorAll('.layer-row[data-id]').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.layer-action, .layer-group-select')) return;
        e.stopPropagation();
        const id = row.dataset.id;
        if (id) toggleSelect(id);
      });
    });

    root.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        const gid = btn.dataset.gid;
        if (gid) {
          if (action === 'group-collapse') toggleGroupCollapsed(gid);
          else if (action === 'group-visibility') {
            const feats = state.features.filter(f => f.groupId === gid);
            const anyVisible = feats.some(f => f.style.visible);
            setGroupVisibility(gid, !anyVisible);
          } else if (action === 'group-delete') {
            const g = state.groups.find(x => x.id === gid);
            if (!g) return;
            ui.confirm('Supprimer la couche ?', `« ${g.name} » sera supprimée. Les objets qu'elle contient sont conservés (déplacés vers « Sans couche »).`, () => deleteGroup(gid));
          }
          return;
        }
        const id = btn.dataset.id;
        if (action === 'zoom') zoomToFeature(id);
        else if (action === 'visibility') toggleVisibility(id);
        else if (action === 'delete') {
          const f = state.features.find(x => x.id === id);
          if (!f) return;
          ui.confirm('Supprimer ?', `Supprimer définitivement « ${f.name} » ?`, () => removeFeature(id));
        }
      });
    });
    // Group assignment dropdowns
    root.querySelectorAll('.layer-group-select').forEach(sel => {
      sel.addEventListener('change', () => {
        assignFeatureToGroup(sel.dataset.id, sel.value);
      });
    });
  }

  window.groupStartRename = function (id) {
    const g = state.groups.find(x => x.id === id);
    const header = document.querySelector(`.group-header[data-gid="${id}"]`);
    if (!g || !header) return;
    const btn = header.querySelector('.group-name');
    if (!btn) return;
    const input = document.createElement('input');
    input.value = g.name;
    input.className = 'layer-name editing';
    input.style.font = 'inherit';
    btn.replaceWith(input);
    input.focus(); input.select();
    function commit() {
      const v = input.value.trim();
      if (v && v !== g.name) renameGroup(id, v);
      else ui.render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') ui.render();
    });
  };

  window.layerStartRename = function (id) {
    const row = document.querySelector(`.layer-row[data-id="${id}"]`);
    if (!row) return;
    const btn = row.querySelector('.layer-name');
    const f = state.features.find(x => x.id === id);
    if (!f || !btn) return;
    const input = document.createElement('input');
    input.value = f.name;
    input.className = 'layer-name editing';
    input.style.font = 'inherit';
    btn.replaceWith(input);
    input.focus(); input.select();
    function commit() {
      const v = input.value.trim();
      if (v && v !== f.name) renameFeature(id, v);
      else ui.render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') ui.render();
    });
  };

  window.layersClearAll = function () {
    if (state.features.length === 0) return;
    ui.confirm('Tout effacer ?', `Supprimer définitivement les ${state.features.length} objets ?`, clearAllFeatures);
  };

  function zoomToFeature(id) {
    const f = state.features.find(x => x.id === id);
    if (!f) return;
    try {
      const bbox = turf.bbox(f.geojson);
      map.fitBounds([[bbox[0], bbox[1]], [bbox[2], bbox[3]]], { padding: 80, maxZoom: 18, duration: 500 });
    } catch (e) {}
  }

  function mountDrawDefaultsInToolbar() {
    const drawer = document.getElementById('draw-drawer');
    const dd = document.getElementById('draw-defaults');
    if (drawer && dd) {
      // Keep gear as the first child (above TerraDraw tools).
      const firstTool = drawer.querySelector('.maplibregl-ctrl-group');
      if (dd.parentElement !== drawer || (firstTool && dd.nextElementSibling !== firstTool)) {
        if (firstTool) drawer.insertBefore(dd, firstTool);
        else drawer.prepend(dd);
      }
      dd.style.removeProperty('display');
    }
    const toggle = document.getElementById('dd-toggle');
    if (toggle) {
      toggle.title = t('draw_defaults');
      toggle.setAttribute('aria-label', t('draw_defaults'));
      toggle.removeAttribute('data-label');
    }
    const row = document.getElementById('draw-toolbar-row');
    const opt = document.getElementById('app-options');
    if (row && opt && opt.parentElement !== row) row.appendChild(opt);
  }

  function initDrawDefaultsUi() {
    const wrap = document.getElementById('draw-defaults');
    const toggle = document.getElementById('dd-toggle');
    const groupSel = document.getElementById('dd-group');
    const newGroupBtn = document.getElementById('dd-new-group');
    const stroke = document.getElementById('dd-stroke');
    const strokeHex = document.getElementById('dd-stroke-hex');
    const width = document.getElementById('dd-width');
    const widthVal = document.getElementById('dd-width-val');
    const fill = document.getElementById('dd-fill');
    const fillHex = document.getElementById('dd-fill-hex');
    const opacity = document.getElementById('dd-opacity');
    const opacityVal = document.getElementById('dd-opacity-val');
    const labelCb = document.getElementById('dd-label');
    if (!wrap || !toggle) return;

    mountDrawDefaultsInToolbar();
    setTimeout(mountDrawDefaultsInToolbar, 500);
    setTimeout(mountDrawDefaultsInToolbar, 1500);

    const refreshGroupOpts = () => {
      if (!groupSel) return;
      const cur = state.drawDefaults.groupId || '';
      groupSel.innerHTML = `<option value="">Sans couche</option>` +
        state.groups.map(g =>
          `<option value="${g.id}" ${cur === g.id ? 'selected' : ''}>${escapeHtml(g.name)}</option>`
        ).join('');
    };

    const syncFromState = () => {
      refreshGroupOpts();
      const st = state.drawDefaults.style;
      if (stroke) stroke.value = st.stroke || '#3aa0ff';
      if (strokeHex) strokeHex.value = st.stroke || '#3aa0ff';
      if (width) width.value = String(st.strokeWidth ?? 2.5);
      if (widthVal) widthVal.textContent = (st.strokeWidth ?? 2.5).toFixed(1);
      if (fill) fill.value = st.fill || '#3aa0ff';
      if (fillHex) fillHex.value = st.fill || '#3aa0ff';
      if (opacity) opacity.value = String(st.fillOpacity ?? 0.3);
      if (opacityVal) opacityVal.textContent = Math.round((st.fillOpacity ?? 0.3) * 100) + '%';
      if (labelCb) labelCb.checked = st.showLabel === false;
    };

    const saveDrawDefaults = () => { saveState(); };

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      wrap.classList.toggle('open');
      toggle.classList.toggle('active', wrap.classList.contains('open'));
      // Close app-options if open (only one popover at a time).
      try {
        const opt = document.getElementById('app-options');
        if (opt) opt.classList.remove('open');
      } catch (_) {}
      syncFromState();
    });

    groupSel?.addEventListener('change', () => {
      state.drawDefaults.groupId = groupSel.value || null;
      saveDrawDefaults();
    });

    newGroupBtn?.addEventListener('click', () => {
      ui.prompt('Nouvelle couche', 'Nom de la couche :', 'Couche ' + (state.groups.length + 1), (name) => {
        if (name && name.trim()) {
          const g = createGroup(name.trim());
          state.drawDefaults.groupId = g.id;
          saveDrawDefaults();
          refreshGroupOpts();
          if (groupSel) groupSel.value = g.id;
        }
      });
    });

    stroke?.addEventListener('input', () => {
      state.drawDefaults.style.stroke = stroke.value;
      if (strokeHex) strokeHex.value = stroke.value;
      saveDrawDefaults();
    });
    strokeHex?.addEventListener('change', () => {
      if (/^#[0-9a-fA-F]{6}$/.test(strokeHex.value)) {
        state.drawDefaults.style.stroke = strokeHex.value;
        if (stroke) stroke.value = strokeHex.value;
        saveDrawDefaults();
      }
    });
    width?.addEventListener('input', () => {
      const v = parseFloat(width.value);
      state.drawDefaults.style.strokeWidth = v;
      if (widthVal) widthVal.textContent = v.toFixed(1);
      saveDrawDefaults();
    });
    fill?.addEventListener('input', () => {
      state.drawDefaults.style.fill = fill.value;
      if (fillHex) fillHex.value = fill.value;
      saveDrawDefaults();
    });
    fillHex?.addEventListener('change', () => {
      if (/^#[0-9a-fA-F]{6}$/.test(fillHex.value)) {
        state.drawDefaults.style.fill = fillHex.value;
        if (fill) fill.value = fillHex.value;
        saveDrawDefaults();
      }
    });
    opacity?.addEventListener('input', () => {
      const v = parseFloat(opacity.value);
      state.drawDefaults.style.fillOpacity = v;
      if (opacityVal) opacityVal.textContent = Math.round(v * 100) + '%';
      saveDrawDefaults();
    });
    labelCb?.addEventListener('change', () => {
      state.drawDefaults.style.showLabel = !labelCb.checked;
      saveDrawDefaults();
    });

    document.addEventListener('click', (e) => {
      if (!wrap.contains(e.target)) {
        wrap.classList.remove('open');
        toggle.classList.remove('active');
      }
    });

    syncFromState();
    onUi(() => { if (wrap.classList.contains('open')) refreshGroupOpts(); });
  }

  /* ═══ 9. PANEL CONTENT — STYLE ══════════════════════════════════════════════ */
  function renderStyle() {
    const targets = describeStyleTargets();
    const sel = getSelectedFeaturesForStyle();
    if (sel.length === 0) {
      return `<div class="empty-state">Sélectionnez un ou plusieurs objets ou couches dans « Calques », ou sur la carte, pour modifier leur style.</div>`;
    }
    const sum = summarizeStyles(sel);
    const mixedNote = Object.values(sum).some(v => v === undefined)
      ? `<div style="font-size:11px; color:var(--warn); margin-bottom:10px;">Valeurs mixtes — toute modification unifiera les ${sel.length} objets sélectionnés.</div>`
      : '';
    const header = targets.label.includes('couche')
      ? `Modification de <strong style="color:var(--brand)">${escapeHtml(targets.label)}</strong> (${sel.length} objet${sel.length > 1 ? 's' : ''})`
      : sel.length === 1
        ? `Modification de <strong style="color:var(--brand)">${escapeHtml(sel[0].name)}</strong>`
        : `Modification de <strong style="color:var(--brand)">${sel.length} objets</strong> sélectionnés`;
    const strokeVal = sum.stroke !== undefined ? sum.stroke : (sel[0].style.stroke || '#3aa0ff');
    const strokeHexVal = sum.stroke !== undefined ? sum.stroke : '';
    const strokeHexPh = sum.stroke === undefined ? '—' : '';
    const widthVal = sum.strokeWidth !== undefined ? sum.strokeWidth : 2.5;
    const widthDisp = sum.strokeWidth !== undefined ? sum.strokeWidth.toFixed(1) : '—';
    const fillVal = sum.fill !== undefined ? sum.fill : (sel[0].style.fill || '#3aa0ff');
    const fillHexVal = sum.fill !== undefined ? sum.fill : '';
    const fillHexPh = sum.fill === undefined ? '—' : '';
    const opacityVal = sum.fillOpacity !== undefined ? sum.fillOpacity : 0.3;
    const opacityDisp = sum.fillOpacity !== undefined ? Math.round(sum.fillOpacity * 100) + '%' : '—';
    const labelChecked = sum.showLabel === false ? 'checked' : '';
    const labelIndet = sum.showLabel === undefined ? ' data-indeterminate="1"' : '';
    return `
      <div style="font-size:13px; color:var(--ink-1); margin-bottom:14px; padding:8px 10px; background:var(--bg-3); border-radius:6px;">${header}</div>
      ${mixedNote}
      <div class="stack">
        <div>
          <label class="field-label">Contour</label>
          <div class="color-row">
            <input type="color" id="st-stroke" value="${strokeVal}" />
            <input type="text" id="st-stroke-hex" class="field" value="${strokeHexVal}" placeholder="${strokeHexPh}" />
          </div>
        </div>
        <div>
          <label class="field-label">Épaisseur</label>
          <div class="slider-row">
            <input type="range" id="st-width" min="0.5" max="10" step="0.5" value="${widthVal}" />
            <span class="val" id="st-width-val">${widthDisp}</span>
          </div>
        </div>
        <div>
          <label class="field-label">Remplissage</label>
          <div class="color-row">
            <input type="color" id="st-fill" value="${fillVal}" />
            <input type="text" id="st-fill-hex" class="field" value="${fillHexVal}" placeholder="${fillHexPh}" />
          </div>
        </div>
        <div>
          <label class="field-label">Opacité</label>
          <div class="slider-row">
            <input type="range" id="st-opacity" min="0" max="1" step="0.05" value="${opacityVal}" />
            <span class="val" id="st-opacity-val">${opacityDisp}</span>
          </div>
        </div>
        <div>
          <label class="checkbox-row">
            <input type="checkbox" id="st-label" ${labelChecked}${labelIndet} />
            <span>Masquer l'étiquette</span>
          </label>
        </div>
        <button type="button" class="btn btn-solid" id="st-apply" style="width:100%;">Appliquer</button>
      </div>`;
  }

  function attachStyleEvents(root) {
    const apply = (patch) => {
      applyStyleToTargets(patch);
    };
    const labelCb = root.querySelector('#st-label');
    if (labelCb && labelCb.dataset.indeterminate === '1') {
      labelCb.indeterminate = true;
    }
    root.querySelector('#st-stroke')?.addEventListener('input', e => {
      apply({ stroke: e.target.value });
      const hex = root.querySelector('#st-stroke-hex'); if (hex) hex.value = e.target.value;
    });
    root.querySelector('#st-stroke-hex')?.addEventListener('change', e => {
      if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) {
        apply({ stroke: e.target.value });
        const c = root.querySelector('#st-stroke'); if (c) c.value = e.target.value;
      }
    });
    root.querySelector('#st-width')?.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      apply({ strokeWidth: v });
      root.querySelector('#st-width-val').textContent = v.toFixed(1);
    });
    root.querySelector('#st-fill')?.addEventListener('input', e => {
      apply({ fill: e.target.value });
      const hex = root.querySelector('#st-fill-hex'); if (hex) hex.value = e.target.value;
    });
    root.querySelector('#st-fill-hex')?.addEventListener('change', e => {
      if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) {
        apply({ fill: e.target.value });
        const c = root.querySelector('#st-fill'); if (c) c.value = e.target.value;
      }
    });
    root.querySelector('#st-opacity')?.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      apply({ fillOpacity: v });
      root.querySelector('#st-opacity-val').textContent = Math.round(v * 100) + '%';
    });
    root.querySelector('#st-label')?.addEventListener('change', e => {
      if (labelCb) labelCb.indeterminate = false;
      apply({ showLabel: !e.target.checked });
    });
    root.querySelector('#st-apply')?.addEventListener('click', () => {
      try { map.triggerRepaint(); } catch (_) {}
    });
  }

  /* ═══ 10. PANEL CONTENT — PROPERTIES (ex-Mesure) ═══════════════════════════ */
  function renderPointPropertiesHtml(f) {
    const pt = getFeaturePointCoords(f);
    if (!pt) return '';
    const wgsLine = formatWgsPairCopy(pt.lng, pt.lat, 8);
    const wgsDisp = formatWgsLabeled(pt.lng, pt.lat, 6);
    let lambertLine = '', lambertDisp = '';
    try {
      const [x, y] = reproject([pt.lng, pt.lat], 'wgs84', 'lambert-maroc-1');
      lambertLine = `${x.toFixed(3)}, ${y.toFixed(3)}`;
      lambertDisp = `${formatProjected(x, 3)} ; ${formatProjected(y, 3)}`;
    } catch (_) {}
    const gmaps = googleMapsUrl(pt.lat, pt.lng);
    return `
      <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
        <div class="field-label">Coordonnées WGS84</div>
        <div style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; color:var(--ink-1); margin-bottom:6px;">${wgsDisp}</div>
        <div class="field-label">Lambert Zone 1 (X ; Y)</div>
        <div style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; color:var(--ink-1); margin-bottom:8px;">${lambertDisp || '—'}</div>
        <div class="row" style="gap:6px; flex-wrap:wrap;">
          <button type="button" class="btn btn-ghost btn-copy-coords" data-copy="${escapeHtml(wgsLine)}" style="flex:1; min-width:120px;">Copier WGS84</button>
          ${lambertLine ? `<button type="button" class="btn btn-ghost btn-copy-coords" data-copy="${escapeHtml(lambertLine)}" style="flex:1; min-width:120px;">Copier Lambert</button>` : ''}
          <a class="btn btn-subtle" href="${gmaps}" target="_blank" rel="noopener noreferrer" style="flex:1; min-width:120px; text-decoration:none; justify-content:center;">Google Maps</a>
        </div>
      </div>`;
  }

  function renderMeasure() {
    const sel = getSelectedFeaturesForStyle();
    if (sel.length === 0) {
      return `<div class="empty-state">Sélectionnez un objet dans « Calques » pour voir ses propriétés.</div>`;
    }
    let totalLen = 0, totalArea = 0;
    const items = sel.map(f => {
      if (f.metrics.lengthMeters) totalLen += f.metrics.lengthMeters;
      if (f.metrics.areaSquareMeters) totalArea += f.metrics.areaSquareMeters;
      const coordsBlock = f.kind === 'point' ? renderPointPropertiesHtml(f) : '';
      return `
        <div class="surface" style="margin-bottom:8px;">
          <div style="font-weight:500; margin-bottom:6px;">${escapeHtml(f.name)}</div>
          <div style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; color:var(--ink-1);">
            ${f.metrics.lengthMeters !== undefined ? `<div><span style="color:var(--ink-2)">Longueur :</span> ${formatDistance(f.metrics.lengthMeters)}</div>` : ''}
            ${f.metrics.areaSquareMeters !== undefined ? `<div><span style="color:var(--ink-2)">Surface  :</span> ${formatArea(f.metrics.areaSquareMeters)}</div>` : ''}
            ${f.kind === 'point' && !f.metrics.lengthMeters && !f.metrics.areaSquareMeters ? `<div><span style="color:var(--ink-2)">Type :</span> Point</div>` : ''}
          </div>
          ${coordsBlock}
        </div>`;
    }).join('');
    let total = '';
    if (sel.length > 1 && (totalLen > 0 || totalArea > 0)) {
      total = `
        <div class="surface" style="background:rgba(58,160,255,0.05); border-color:rgba(58,160,255,0.3); margin-top:12px;">
          <div class="field-label" style="margin-bottom:4px;">Total</div>
          <div style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px;">
            ${totalLen > 0 ? `<div><span style="color:var(--ink-2)">Longueur :</span> ${formatDistance(totalLen)}</div>` : ''}
            ${totalArea > 0 ? `<div><span style="color:var(--ink-2)">Surface  :</span> ${formatArea(totalArea)}</div>` : ''}
          </div>
        </div>`;
    }
    return items + total;
  }

  function attachMeasureEvents(root) {
    root.querySelectorAll('.btn-copy-coords').forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.dataset.copy;
        if (!text) return;
        copyTextToClipboard(text).then((ok) => {
          const prev = btn.textContent;
          btn.textContent = ok ? 'Copié ✓' : 'Échec copie';
          setTimeout(() => { btn.textContent = prev; }, 1400);
        });
      });
    });
  }

  /* ═══ 10b. PANEL CONTENT — TOOLS (buffer, intersection) ═════════════════════ */
  // Which tool sections are unfolded. Kept outside the render so the panel can
  // re-render on every selection change without snapping shut under the user.
  const toolsOpen = { bornage: false, buffer: false, intersect: false, contour: false, elevation: false, route: false };
  const ACC_CARET = '<svg class="acc-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
    + '<path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /** One collapsible tool section. `tag` is a short right-aligned status. */
  function accSection(key, title, tag, body) {
    return `
      <details class="acc" data-acc="${key}"${toolsOpen[key] ? ' open' : ''}>
        <summary>${ACC_CARET}<span>${title}</span>${tag ? `<span class="acc-tag${tag.ready ? ' ready' : ''}">${tag.text}</span>` : ''}</summary>
        <div class="acc-body">${body}</div>
      </details>`;
  }

  function renderTools() {
    const sel = state.features.filter(f => state.selectedIds.includes(f.id));
    const polys = sel.filter(f => ['polygon', 'rectangle', 'circle'].includes(f.kind));
    const bornagePts = (state._bornage && state._bornage.points) ? state._bornage.points.length : 0;
    return `
      <div class="stack">
        ${accSection('bornage', 'Bornage', bornagePts ? { text: `${bornagePts} pt${bornagePts > 1 ? 's' : ''}`, ready: true } : null, `
          <p style="font-size:12px; color:var(--ink-1); margin:0 0 10px;">
            Saisissez autant de points que voulu, puis « Terminer » relie tous les points en polygone.
            Un point situé à plus de 100&nbsp;km du précédent est refusé (erreur de saisie probable).

          <label class="field-label" style="font-size:11px;">Système de coordonnées</label>
          <select id="bn-crs" class="field" style="margin-bottom:8px;">
            ${crsOptionsHtml((state._bornage && state._bornage.crs) || 'wgs84', preferredCrsCountry || 'MA')}
          </select>
          <div style="display:flex; gap:8px; align-items:flex-end;">
            <div style="flex:1;">
              <label class="field-label" style="font-size:11px;" id="bn-x-label">Longitude</label>
              <input type="text" id="bn-x" class="field" inputmode="decimal" autocapitalize="off" autocorrect="off"
                     style="font-family:'JetBrains Mono',ui-monospace,monospace;" />
            </div>
            <div style="flex:1;">
              <label class="field-label" style="font-size:11px;" id="bn-y-label">Latitude</label>
              <input type="text" id="bn-y" class="field" inputmode="decimal" autocapitalize="off" autocorrect="off"
                     style="font-family:'JetBrains Mono',ui-monospace,monospace;" />
            </div>
            <button class="btn btn-solid" id="bn-add" style="white-space:nowrap;">+ Point</button>
          </div>
          <div id="bn-msg" style="font-size:12px; margin-top:8px;"></div>
          <div style="margin-top:10px;">
            <label class="field-label" style="font-size:11px;">Importer un fichier (CSV / TSV)</label>
            <p style="font-size:11px; color:var(--ink-2); margin:4px 0 8px;">
              Table avec colonnes <strong>borne</strong>, <strong>X</strong>, <strong>Y</strong> (séparateur virgule, point-virgule ou tabulation).
            </p>
            <input type="file" id="bn-file" accept=".csv,.txt,.tsv,text/csv,text/plain" style="display:none;" />
            <button class="btn btn-subtle" id="bn-import" style="width:100%;">Choisir un fichier…</button>
            <label style="display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-1); margin-top:8px;">

          <div id="bn-list" style="margin-top:8px;"></div>
          <button class="btn btn-solid" id="bn-finish" style="width:100%; margin-top:10px;">Terminer le polygone</button>
        `)}

        ${accSection('buffer', 'Buffer (zone tampon)', sel.length === 1 ? { text: '1 objet', ready: true } : null, `
          <p style="font-size:12px; color:var(--ink-1); margin:0 0 10px;">
            Crée un nouvel objet polygonal à une distance donnée autour d'un objet sélectionné.
            ${sel.length === 0 ? '<br><strong>Sélectionnez un objet pour commencer.</strong>' : ''}
            ${sel.length > 1 ? '<br><strong>Sélectionnez un seul objet à la fois.</strong>' : ''}
          </p>
          <div style="display:flex; gap:8px; align-items:flex-end;">
            <div style="flex:1;">
              <label class="field-label" style="font-size:11px;">Rayon (mètres)</label>
              <input type="text" id="bf-radius" class="field" inputmode="decimal" autocapitalize="off" autocorrect="off"
                     value="50" style="font-family:'JetBrains Mono',ui-monospace,monospace;" />
            </div>
            <button class="btn btn-solid" id="bf-apply" ${sel.length !== 1 ? 'disabled' : ''}
                    style="white-space:nowrap;">Appliquer</button>
          </div>
        `)}

        ${accSection('intersect', 'Intersection de polygones', polys.length >= 2 ? { text: `${polys.length} polygones`, ready: true } : null, `
          <p style="font-size:12px; color:var(--ink-1); margin:0 0 10px;">
            Calcule la zone commune (chevauchement) entre 2 polygones sélectionnés et la crée comme nouvel objet.
            ${polys.length === 0 ? "<br><strong>Sélectionnez au moins 2 polygones avec « Sélection multiple ».</strong>"
              : polys.length === 1 ? "<br><strong>Encore 1 polygone à sélectionner.</strong>"
              : `<br><strong>${polys.length} polygones sélectionnés.</strong>`}
          </p>
          <button class="btn btn-solid" id="it-apply" ${polys.length < 2 ? 'disabled' : ''}
                  style="width:100%;">Calculer l'intersection</button>
          <div id="it-result" style="font-size:12px; margin-top:8px;"></div>
        `)}

        ${accSection('contour', t('tool_contour'), polys.length === 1 ? { text: '1', ready: true } : null, `
          <p style="font-size:12px; color:var(--ink-1); margin:0 0 10px;">
            Échantillonne l'altitude sur le polygone sélectionné et trace les courbes de niveau.
            ${polys.length === 1 ? '' : '<br><strong>Sélectionnez exactement 1 polygone, rectangle ou cercle.</strong>'}
          </p>
          <div style="display:flex; gap:8px; align-items:flex-end;">

              <label class="field-label" style="font-size:11px;">Pas (mètres)</label>

                     value="10" style="font-family:'JetBrains Mono',ui-monospace,monospace;" />

                    style="white-space:nowrap;">${t('btn_trace')}</button>
          </div>
          <div id="cn-result" style="font-size:12px; margin-top:8px;"></div>
        `)}

        ${accSection('elevation', t('tool_elevation'), (sel.length === 1 && sel[0].kind === 'line') ? { text: '1', ready: true } : null, `
          <div id="tools-elevation-host">${renderElevation()}</div>
        `)}

        ${accSection('route', t('tool_route'), null, `
          <p style="font-size:12px; color:var(--ink-1); margin:0 0 10px;">${t('route_hint')}</p>
          <button class="btn btn-solid" id="rt-start" style="width:100%;">${t('route_start')}</button>
          <div id="rt-msg" style="font-size:12px; margin-top:8px; color:var(--ink-1);"></div>
        `)}
